{{- /*
The IBCF (cscf/border.cfg), TS 23.228 4.14: the entry and exit point on Ici,
with rtpengine as its TrGW. One instance, `<release>-ibcf-0` of a
single-replica StatefulSet, holding every address of every Ici network: the
cfg binds them by value (ici.cfg below), and they are the addresses the
peers' configuration names. No Diameter and no state store; Ready once the
peers are loaded. The Service is what the S-CSCF's ibcf.<ims realm> resolves
to.

The IBCF is on every Ici network, and picks the interconnect itself
(23.228 4.14 "Selecting the appropriate signalling interconnect"): the peer
a request goes to is on one of them, which decides the socket it leaves by
and the TrGW templates its media takes.
*/}}
{{- with .Values.cscf.border }}
{{- if .enabled }}
{{- $b := . }}
{{- with $ }}
{{- $peers := $b.peers }}
{{- if not $peers }}{{ fail "cscf.border.peers: at least one peer network" }}{{ end }}
{{- $nets := (include "ims.ici.networks" . | fromJson).nets }}
{{- /* Each peer's Ici network, in `peers` order */}}
{{- $peernet := list }}
{{- range $net := $nets }}
{{- $t := $.Subcharts.trgw.Values.templates }}
{{- range $dir := list "incoming" "outgoing" }}
{{- if not (hasKey $t (printf "%s%s" $dir $net.sfx)) }}
{{- fail (printf "trgw.templates: no %q for the Ici network %q" (printf "%s%s" $dir $net.sfx) $net.name) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* `<match>=<set>` per route, the set being the peer's position */}}
{{- $routes := list }}
{{- range $i, $p := $peers }}
{{- if not $p.name }}{{ fail (printf "cscf.border.peers[%d] has no name" $i) }}{{ end }}
{{- if not $p.entry }}{{ fail (printf "cscf.border.peers[%d] (%s) has no entry point" $i $p.name) }}{{ end }}
{{- $net := "" }}
{{- range $c := $nets }}{{ if eq $c.name ($p.network | default (first $nets).name | toString) }}{{ $net = $c }}{{ end }}{{ end }}
{{- if not $net }}{{ fail (printf "cscf.border.peers[%d] (%s): network %q is none of ici.networks" $i $p.name $p.network) }}{{ end }}
{{- if and (gt (len $nets) 1) (not $p.network) }}{{ fail (printf "cscf.border.peers[%d] (%s): a network is required with more than one Ici network" $i $p.name) }}{{ end }}
{{- $peernet = append $peernet $net }}
{{- range $r := $p.routes }}{{ $routes = append $routes (printf "%s=%d" $r (add1 $i)) }}{{ end }}
{{- end }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace (printf "%s-ibcf" .Release.Name) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-ibcf
  labels: {{- include "ims.labels" . | nindent 4 }}
data:
  {{- if $b.thkey }}
  thkey: {{ $b.thkey | b64enc }}
  {{- else if and $secret $secret.data $secret.data.thkey }}
  # Kept: a new key would make the masked headers of every call in progress
  # undecodable
  thkey: {{ $secret.data.thkey }}
  {{- else }}
  thkey: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-ibcf
  labels: {{- include "ims.labels" . | nindent 4 }}
data:
  # setid destination flags priority attributes. A set's destinations are
  # tried highest priority first, which is `entry` order, and sent to from
  # the peer's Ici network
  peers.list: |
    {{- range $i, $p := $peers }}
    {{- $net := index $peernet $i }}
    {{- range $j, $d := $p.entry }}
    {{ add1 $i }} {{ $d }} 0 {{ sub (len $p.entry) $j }} peer={{ $p.name }};trust={{ ternary 1 0 (eq true $p.trust) }};{{ with $net.name }}net={{ . }};{{ end }}sockname=Ici{{ $net.sfx }}
    {{- end }}
    {{- end }}
  # The Ici sockets, a UDP and a TCP one per address, all of a network's
  # under its name. A name resolves to the first socket that carries it, so
  # what dispatcher sends to a peer leaves from its network's first address;
  # every address receives
  ici.cfg: |
    #!define ICI_LISTENS
    {{- range $net := $nets }}
    {{- range $a := $net.addresses }}
    listen = udp:{{ (split "/" $a)._0 }}:5060 name "Ici{{ $net.sfx }}"
    listen = tcp:{{ (split "/" $a)._0 }}:5060 name "IciT{{ $net.sfx }}"
    {{- end }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ibcf
  labels: {{- include "ims.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
    protocol: TCP
    name: tcp
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
    protocol: UDP
    name: udp
  publishNotReadyAddresses: true
  selector: {{- include "ims.selectorLabels" . | nindent 4 }}
    role: ibcf
{{- /* All its addresses on each Ici network, and the control interface's
network when rtpengine's ng socket is on its vips */}}
{{- $attach := list }}
{{- $icinet := list }}
{{- range $net := $nets }}
{{- $attach = append $attach (dict "name" $net.nad "interface" $net.interface "ips" $net.addresses) }}
{{- $icinet = concat $icinet $net.addresses }}
{{- end }}
{{- with include "rtpengine.ng.network" .Subcharts.trgw }}
{{- $attach = append $attach (fromJson .) }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-ibcf
  labels: {{- include "ims.labels" . | nindent 4 }}
    role: ibcf
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}-ibcf
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels: {{- include "ims.selectorLabels" . | nindent 6 }}
      role: ibcf
  template:
    metadata:
      annotations:
        # peers.list and ici.cfg are read at startup only
        checksum/peers: {{ toJson (list $peers $nets) | sha256sum }}
        k8s.v1.cni.cncf.io/networks: {{ toJson $attach | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels: {{- include "ims.labels" . | nindent 8 }}
        role: ibcf
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - {{ include "ims.dnsIP" . }}
        searches:
        - {{ .Release.Namespace }}.svc.cluster.local
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: cscf
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args: ["-f", "/etc/cscf/border.cfg"]
        env:
        - name: REALM
          value: {{ tpl .Values.domain . }}
        # The Ici sources: the IBCF's own addresses with their prefixes,
        # which is_in_subnet masks the same way as the source
        - name: ICINET
          value: {{ join "," $icinet | quote }}
        - name: RTPADR
          value: {{ include "rtpengine.ng" .Subcharts.trgw | quote }}
        - name: ROUTES
          value: {{ join " " $routes | quote }}
        - name: THKEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-ibcf
              key: thkey
        {{- if .Values.cscf.emergency.enabled }}
        - name: ECSCF
          value: {{ printf "sip:ecscf.%s" (include "ims.realm.ims" .) | quote }}
        {{- end }}
        ports:
        - name: tcp
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        - name: udp
          containerPort: {{ .Values.service.port }}
          protocol: UDP
        - name: mon
          containerPort: 9090
          protocol: TCP
        # /check is `ds_list_exists("1")`
        readinessProbe:
          httpGet: {path: /check, port: mon}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /metrics, port: mon}
          periodSeconds: 20
          failureThreshold: 6
        {{- with $b.resources }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: peers
          mountPath: /etc/cscf/peers.list
          subPath: peers.list
        - name: peers
          mountPath: /etc/cscf/ici.cfg
          subPath: ici.cfg
      volumes:
      - name: peers
        configMap:
          name: {{ .Release.Name }}-ibcf
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
