{{- $dot := . -}}
{{- $on := dict "pcscf" true "icscf" true "scscf" true "ecscf" .Values.cscf.emergency.enabled "ibcf" .Values.cscf.border.enabled }}
{{- range $cscf, $enabled := $on }}
{{- with $dot }}
{{- if $enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ $cscf }}
  labels: {{- include "ims.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
    protocol: TCP
    name: tcp
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.port }}
    protocol: UDP
    name: udp
  publishNotReadyAddresses: true
  selector: {{- include "ims.selectorLabels" . | nindent 4 }}
    role: {{ $cscf }}
{{- end }}
{{- end }}
{{- end }}
