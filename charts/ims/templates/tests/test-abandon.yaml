{{- if .Values.test.abandon.enabled }}
{{- $valkey := printf "-h %s -p %v -n %v" (include "valkey.name" .Subcharts.rtpengine.Subcharts.valkey) .Values.rtpengine.valkey.ports.valkey .Values.db.proxy }}
# Registrations that never complete, and what they leave behind.
#
# Each cycle is a UE that attaches, sends the initial REGISTER, verifies the
# 401's challenge and then walks away (IMS_ABANDON): no SAs on its side, no
# protected REGISTER. That is a handset losing coverage or rebooting in the
# middle of a registration, and it is the one case where the P-CSCF holds state
# for a registration the S-CSCF never completed -- the pending contact
# pcscf_save_pending() wrote at the first REGISTER, and the IPsec tunnel
# ipsec_create() built for it at the 401, measured at 4 SAs and 4 policies.
# Nothing the UE sends removes them. Only the contact's own expiry is meant to:
# `pending_reg_expires` (30 s) after the REGISTER, noticed at the next usrloc
# timer tick (every 60 s), with the tunnel going in the same callback.
#
# The last cycle registers for real, from a new address, to show the abandoned
# ones do not get in its way -- the reg-info it is sent must name its contact
# and no other (REG_EVENT_EXCLUSIVE) -- and then de-registers.
#
# Then the check: the P-CSCF writes its usrloc through to valkey, and within
# `deadline` there must be no location row left for any address the run used.
# The row is what this pod can see; the tunnel is not, as it lives in the
# P-CSCF's own network namespace. The two were measured going together, in the
# one expiry callback.
#
# Two containers because the check needs valkey-cli and the UE needs the test
# image: the UE runs first as an init container, and hands its log, its outcome
# and its addresses to the check through a shared volume. It never fails the
# pod itself -- an init container that fails means the check never runs, and
# `helm test --logs` shows the check's log alone.
#
# Weighted after the rereg hook, which leaves the IMSI de-registered.
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-abandon
  labels: {{- include "ims.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "2"
spec:
  restartPolicy: Never
  volumes:
  - name: run
    emptyDir: {}
  initContainers:
  - name: ue
    image: {{ .Values.test.image }}
    command:
    - sh
    - -c
    - |
      status=0
      i=1
      while [ "$i" -le "$CYCLES" ]; do
        [ "$i" -gt 1 ] && sleep "$GAP"
        echo "=== cycle $i/$CYCLES: new PDN connection, REGISTER, 401, walk away" >> /run/test/ue.log
        IMS_ABANDON=1 lua ims_test_s5.lua > /run/test/cycle 2>&1
        rc=$?
        cat /run/test/cycle >> /run/test/ue.log
        # The test image has to know IMS_ABANDON; one that does not completes
        # the registration and would leave nothing pending to look for.
        if ! grep -q "abandoned at the 401" /run/test/cycle; then
          echo "=== cycle $i: the UE did not abandon -- does the test image know IMS_ABANDON?" >> /run/test/ue.log
          status=1
        elif [ "$rc" -ne 0 ]; then
          status=1
        fi
        sed -n 's/.*Create Session Resp *PAA \([0-9.]*\),.*/\1/p' /run/test/cycle >> /run/test/paa
        i=$((i + 1))
      done
      sleep "$GAP"
      echo "=== final: new PDN connection, a complete registration, de-REGISTER" >> /run/test/ue.log
      IMS_DEREG=1 REG_EVENT_EXCLUSIVE=1 lua ims_test_s5.lua > /run/test/cycle 2>&1 || status=1
      cat /run/test/cycle >> /run/test/ue.log
      sed -n 's/.*Create Session Resp *PAA \([0-9.]*\),.*/\1/p' /run/test/cycle >> /run/test/paa
      echo "$status" > /run/test/status
    {{- with .Values.test.resources }}
    resources: {{- toYaml . | nindent 6 }}
    {{- end }}
    env:
    {{- include "ims.test.env" . | nindent 4 }}
    - {name: CYCLES,        value: {{ .Values.test.abandon.cycles | quote }}}
    - {name: GAP,           value: {{ .Values.test.abandon.gap | quote }}}
    - {name: IMS_SUBS,      value: "1"}
    - {name: IMS_EXPIRES,   value: {{ .Values.test.abandon.expires | quote }}}
    - {name: REG_EVENT_EXPIRES, value: {{ .Values.test.abandon.expires | quote }}}
    - {name: IMS_VERBOSE,   value: "1"}
    - {name: IMS_CALL,      value: "0"}
    - {name: IMS_SMS,       value: "0"}
    securityContext: {{- include "ims.test.securityContext" . | nindent 6 }}
    volumeMounts:
    - {name: run, mountPath: /run/test}
  containers:
  - name: check
    image: {{ .Values.rtpengine.valkey.image.repository }}:{{ .Values.rtpengine.valkey.image.tag }}
    {{- with .Values.sidecar.resources }}
    resources: {{- toYaml . | nindent 6 }}
    {{- end }}
    command:
    - sh
    - -c
    - |
      cat /run/test/ue.log
      if [ "$(cat /run/test/status 2>/dev/null)" != 0 ]; then
        echo "=== the UE runs did not go as asked, see above"
        exit 1
      fi
      paas=$(sort -u /run/test/paa)
      [ -n "$paas" ] || { echo "=== no PAA in the UE's log to look for"; exit 1; }
      echo "=== waiting up to {{ .Values.test.abandon.deadline }}s for the P-CSCF to drop every contact of:" $paas
      t=0
      while :; do
        left=
        for a in $paas; do
          k=$(valkey-cli {{ $valkey }} --scan --pattern "location:entry::*[:@]$a:*")
          [ -n "$k" ] && left="$left $k"
        done
        [ -z "$left" ] && { echo "=== clean after ${t}s: no location row left for any of them"; exit 0; }
        [ "$t" -ge {{ .Values.test.abandon.deadline }} ] && break
        sleep 5
        t=$((t + 5))
      done
      echo "=== still held after {{ .Values.test.abandon.deadline }}s:"
      for k in $left; do
        echo "   $k  reg_state=$(valkey-cli {{ $valkey }} hget "$k" reg_state)  expires=$(valkey-cli {{ $valkey }} hget "$k" expires)"
      done
      exit 1
    volumeMounts:
    - {name: run, mountPath: /run/test}
{{- end }}
