{{- /*
The interconnect check (border.sh under compose): pro2call's ibcf_peer.lua
plays the peer network on Ici and an S-CSCF on the pod network, and drives
the IBCF from both sides. Every check is a line of its log.

One pod per Ici network checked: `<release>-test-border` on the first, with
`address` and `dial`, and `<release>-test-border-<name>` for each entry of
`networks`. helm test runs them one after the other.
*/}}
{{- if and .Values.cscf.border.enabled .Values.test.border.enabled }}
{{- $t := .Values.test.border }}
{{- $nets := (include "ims.ici.networks" . | fromJson).nets }}
{{- $checks := list (dict "pod" (printf "%s-test-border" .Release.Name) "net" (first $nets) "address" $t.address "dial" $t.dial "mediaTimeout" $t.mediaTimeout) }}
{{- range $name, $c := $t.networks }}
{{- $net := "" }}
{{- range $n := $nets }}{{ if eq $n.name $name }}{{ $net = $n }}{{ end }}{{ end }}
{{- if not $net }}{{ fail (printf "test.border.networks: %q is none of ici.networks" $name) }}{{ end }}
{{- if eq $net.name (first $nets).name }}{{ fail (printf "test.border.networks: %q is the first Ici network, which test.border.address checks" $name) }}{{ end }}
{{- if not (and $c.address $c.dial) }}{{ fail (printf "test.border.networks.%s: address and dial are required" $name) }}{{ end }}
{{- $checks = append $checks (dict "pod" (printf "%s-test-border-%s" $.Release.Name $name) "net" $net "address" $c.address "dial" $c.dial "mediaTimeout" (ternary $c.mediaTimeout $t.mediaTimeout (hasKey $c "mediaTimeout"))) }}
{{- end }}
{{- range $c := $checks }}
{{- with $ }}
{{- $ici := $c.net }}
{{- $peer := (split "/" $c.address)._0 }}
{{- $listed := false }}
{{- range $p := .Values.cscf.border.peers }}
{{- range $e := $p.entry }}
{{- if and (regexMatch (printf "^sips?:([^@]*@)?%s([:;>]|$)" (regexQuoteMeta $peer)) $e) (eq ($p.network | default (first $nets).name | toString) $ici.name) }}{{ $listed = true }}{{ end }}
{{- end }}
{{- end }}
{{- if not $listed }}
{{- fail (printf "test.border: %s is no entry point of a peer on the Ici network %q in cscf.border.peers" $peer $ici.name) }}
{{- end }}
{{- /* The TrGW's addresses, one per replica on either side, in the same
order: `internal`, and `external<sfx>` on this Ici network */}}
{{- $sides := dict "internal" "internal" (printf "external%s" $ici.sfx) "external" }}
{{- $trgw := dict }}
{{- range $if := .Values.trgw.media.interfaces }}
{{- with get $sides $if.name }}{{ $_ := set $trgw . ($if.vips | default list) }}{{ end }}
{{- end }}
{{- range $name, $side := $sides }}
{{- if not (get $trgw $side) }}
{{- fail (printf "test.border: the TrGW's %q interface needs vips, the addresses the SDP is checked against" $name) }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ $c.pod }}
  labels: {{- include "ims.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    k8s.v1.cni.cncf.io/networks: {{ list (dict "name" $ici.nad "interface" $ici.interface "ips" (list $c.address)) | toJson | quote }}
spec:
  restartPolicy: Never
  containers:
  - name: peer
    image: {{ .Values.test.image }}
    command: [lua]
    args: [ibcf_peer.lua]
    {{- with .Values.test.resources }}
    resources: {{- toYaml . | nindent 6 }}
    {{- end }}
    env:
    - {name: PEER_ICI,     value: {{ $peer | quote }}}
    - {name: PEER_IBCF,    value: {{ (split "/" (first $ici.addresses))._0 | quote }}}
    - {name: PEER_IBCF_MX, value: {{ printf "%s-ibcf-0.%s-ibcf.%s.svc.cluster.local" .Release.Name .Release.Name .Release.Namespace }}}
    - {name: PEER_MX_IF,   value: eth0}
    - {name: PEER_TRGW,    value: {{ join " " $trgw.external | quote }}}
    - {name: PEER_TRGW_MX, value: {{ join " " $trgw.internal | quote }}}
    - {name: PEER_REALM,   value: {{ tpl .Values.domain . | quote }}}
    - {name: PEER_DIAL,    value: {{ $c.dial | quote }}}
    # In the home range, provisioned or not: the answer is the home
    # network's either way
    - {name: PEER_HOME,    value: {{ printf "tel:+%v000000099" .Values.global.e164.home | quote }}}
    - {name: PEER_MEDIA_TIMEOUT_S, value: {{ $c.mediaTimeout | quote }}}
{{- end }}
{{- end }}
{{- end }}
