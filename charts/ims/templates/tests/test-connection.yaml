# emulates GTP-C and SIP/RTP over GTP-U
# SIP procedures:
# - REGISTER
# - SUBSCRIBE (reg)
# - INVITE (if at least 2 UEs)
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test
  labels: {{- include "ims.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  containers:
  - name: test
    image: {{ .Values.test.image }}
    command: [lua]
    args: [ims_test_s5.lua]
    {{- with .Values.test.resources }}
    resources: {{- toYaml . | nindent 6 }}
    {{- end }}
    env:
    {{- include "ims.test.env" . | nindent 4 }}
    - {name: IMS_SUBS,  value: {{ .Values.test.subscribers | quote }}}
    securityContext: {{- include "ims.test.securityContext" . | nindent 6 }}
