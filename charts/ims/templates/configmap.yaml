{{- $ims := include "ims.realm.ims" . }}
{{- $epc := include "ims.realm.epc" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-cscf
  labels: {{- include "ims.labels" . | nindent 4 }}
data:
  # cdp's peer table. Each CSCF dials the node it needs directly -- Rx to the
  # PCRF, Cx to the HSS -- because readiness is `cdp_has_app(<app id>)` and only
  # a peer that advertises the application itself can satisfy it. Names are
  # fully qualified in the home domain, which is what the CoreDNS zone in
  # values.yaml answers; nothing here resolves through cluster DNS.
  proxy.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <DiameterPeer
        FQDN="pcscf.{{ $ims }}"
        Realm="{{ $ims }}"
        Vendor_Id="10415"
        Product_Name="PCSCF"
        Workers="{{ .Values.workers }}"
    >
            <Peer FQDN="pcrf.{{ $epc }}" Realm="{{ $epc }}" port="3868"/>
            <Auth id="16777236" vendor="10415"/> <!-- Rx 3GPP -->
            <SupportedVendor vendor="10415" />
            <DefaultRoute FQDN="pcrf.{{ $epc }}" metric="1"/>
    </DiameterPeer>

  interrogating.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <DiameterPeer
        FQDN="icscf.{{ $ims }}"
        Realm="{{ $ims }}"
        Vendor_Id="10415"
        Product_Name="ICSCF"
        Workers="{{ .Values.workers }}"
    >
            <Peer FQDN="hss.{{ $epc }}" Realm="{{ $epc }}" port="3868"/>
            <Auth id="16777216" vendor="10415"/> <!-- Cx 3GPP -->
            <SupportedVendor vendor="10415" />
            <DefaultRoute FQDN="hss.{{ $epc }}" metric="1"/>
    </DiameterPeer>

  serving.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <DiameterPeer
        FQDN="scscf.{{ $ims }}"
        Realm="{{ $ims }}"
        Vendor_Id="10415"
        Product_Name="SCSCF"
        Workers="{{ .Values.workers }}"
    >
            <Peer FQDN="hss.{{ $epc }}" Realm="{{ $epc }}" port="3868"/>
            <Auth id="16777216" vendor="10415"/> <!-- Cx 3GPP -->
            <SupportedVendor vendor="10415" />
            <DefaultRoute FQDN="hss.{{ $epc }}" metric="1"/>
    </DiameterPeer>
