{{- $dot := . -}}
{{- range tuple "proxy" "interrogating" "serving" }}
{{- $cscf := . -}}
{{- with $dot }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ trunc 1 $cscf }}cscf
  labels: {{- include "ims.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # All replicas of a role share one Diameter identity (`pcscf.ims.<realm>` and
  # so on, from configmap.yaml). freeDiameter accepts exactly one connection per
  # identity and answers the second with "Rejecting new connection attempt while
  # our state machine is in state STATE_OPEN".
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "ims.selectorLabels" . | nindent 6 }}
      role: {{ trunc 1 $cscf }}cscf
  template:
    metadata:
      annotations:
        # diameter.xml is a subPath mount, which kubelet never updates in place.
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels: {{- include "ims.labels" . | nindent 8 }}
        role: {{ trunc 1 $cscf }}cscf
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - {{ include "ims.dnsIP" . }}
        searches:
        - {{ .Release.Namespace }}.svc.cluster.local
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      {{- include "ims.waitdb" (dict "root" . "cscf" $cscf) | nindent 6 }}
      {{- if eq "proxy" $cscf }}
      {{- include "ims.ipsec" . | nindent 6 }}
      {{- else if eq "serving" $cscf }}
      {{- include "ims.register" . | nindent 6 }}
      {{- end }}
      containers:
      - name: cscf
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args: ["-f", {{ printf  "/etc/cscf/%s.cfg" $cscf | quote }}]
        env:
        - name: REALM
          value: {{ tpl .Values.domain . }}
        {{- if eq "proxy" $cscf }}
        - name: IPSEC
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        {{- end }}
        - name: DBURL
          value: {{ template "valkey.name" .Subcharts.rtpengine.Subcharts.valkey }}:{{ .Values.rtpengine.valkey.ports.valkey }}/{{ index .Values.db $cscf }}
        {{- if eq "serving" $cscf }}
        - name: RTPADR
          value: udp:{{ template "rtpengine.name" .Subcharts.rtpengine }}:{{ .Values.rtpengine.service.port }}
        {{- end }}
        ports:
        - name: tcp
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        - name: udp
          containerPort: {{ .Values.service.port }}
          protocol: UDP
        - name: mon
          containerPort: 9090
          protocol: TCP
        # /check is `cdp_has_app(...)`
        readinessProbe:
          httpGet: {path: /check, port: mon}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /metrics, port: mon}
          periodSeconds: 20
          failureThreshold: 6
        {{- with .Values.resources }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: diameter
          mountPath: /etc/cscf/diameter.xml
          subPath: diameter.xml
        {{- if eq "proxy" $cscf }}
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        {{- end }}
      {{- if and (eq "proxy" $cscf) .Values.global.ue.subnet }}
      {{- include "ims.ueroute" . | nindent 6 }}
      {{- end }}
      volumes:
      - name: diameter
        configMap:
          name: {{ .Release.Name }}-cscf
          items:
          - key: {{ $cscf }}.xml
            path: diameter.xml
      {{- if eq "proxy" $cscf }}
      {{- include "ims.kmod" . | nindent 6 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
