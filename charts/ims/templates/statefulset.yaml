{{- $dot := . -}}
{{- $roles := dict "proxy" "pcscf" "interrogating" "icscf" "serving" "scscf" "emergency" "ecscf" "border" "ibcf" }}
{{- range tuple "proxy" "interrogating" "serving" "emergency" "border" }}
{{- $cscf := . -}}
{{- $role := get $roles $cscf }}
{{- with $dot }}
{{- $e := dig $cscf dict .Values.cscf }}
{{- $diameter := has $cscf (list "proxy" "interrogating" "serving") }}
{{- if or $diameter $e.enabled }}
{{- $border := dict }}
{{- if eq "border" $cscf }}
{{- $border = include "ims.border" . | fromJson }}
{{- end }}
{{- /*
With Gm attached the P-CSCF is a single pod with every `gm.addresses` entry on
its one attachment: the networks annotation lives in the pod template, so a
second replica would claim the same addresses. `$gm` and `$gm6` are its IPv4
and IPv6 address, empty everywhere else.
*/}}
{{- $g := dict }}
{{- if eq "proxy" $cscf }}
{{- $g = include "ims.gm" . | fromJson }}
{{- end }}
{{- $gms := $g.ips | default list }}
{{- $gm := $g.v4 | default "" }}
{{- $gm6 := $g.v6 | default "" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-{{ $role }}
  labels: {{- include "ims.labels" . | nindent 4 }}
    role: {{ $role }}
spec:
  replicas: {{ if or $gm $border }}1{{ else }}{{ .Values.replicaCount }}{{ end }}
  serviceName: {{ .Release.Name }}-{{ $role }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels: {{- include "ims.selectorLabels" . | nindent 6 }}
      role: {{ $role }}
  template:
    metadata:
      {{- $ann := dict }}
      {{- if $diameter }}
      {{- $_ := set $ann "checksum/config" (include (print .Template.BasePath "/configmap.yaml") . | sha256sum) }}
      {{- end }}
      {{- with $border }}
      {{- /* peers.list and ici.cfg are read at startup only */}}
      {{- $_ := set $ann "checksum/peers" (toJson (list $e.peers .nets) | sha256sum) }}
      {{- $_ := set $ann "k8s.v1.cni.cncf.io/networks" (toJson .attach) }}
      {{- end }}
      {{- if $gm }}
      {{- $_ := set $ann "k8s.v1.cni.cncf.io/networks" (list (dict "name" (printf "%s-gm" .Release.Name) "interface" .Values.gm.interface "ips" $gms) | toJson) }}
      {{- end }}
      {{- with merge (deepCopy (.Values.podAnnotations | default dict)) $ann }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
      labels: {{- include "ims.labels" . | nindent 8 }}
        role: {{ $role }}
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - {{ include "ims.dnsIP" . }}
        searches:
        - {{ .Release.Namespace }}.svc.cluster.local
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $diameter }}
      initContainers:
      {{- include "ims.identity" . | nindent 6 }}
      {{- include "ims.waitdb" (dict "root" . "cscf" $cscf) | nindent 6 }}
      {{- if eq "proxy" $cscf }}
      {{- include "ims.ipsec" . | nindent 6 }}
      {{- end }}
      {{- end }}
      containers:
      - name: cscf
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args: ["-f", {{ printf  "/etc/cscf/%s.cfg" $cscf | quote }}]
        {{- $env := include "ims.cscf.env" (dict "root" . "cscf" $cscf "gm" $gm "gm6" $gm6 "border" $border) | fromYamlArray }}
        {{- $names := list }}
        {{- range $env }}{{ $names = append $names .name }}{{ end }}
        {{- range $k, $v := $e.env }}
        {{- if has $k $names }}{{ fail (printf "cscf.%s.env.%s: set by the chart" $cscf $k) }}{{ end }}
        {{- with tpl (ternary "" (toString $v) (kindIs "invalid" $v)) $ }}
        {{- $env = append $env (dict "name" $k "value" .) }}
        {{- $names = append $names $k }}
        {{- end }}
        {{- end }}
        {{- if and (eq "emergency" $cscf) (not (has "PSAP" $names)) }}{{ fail "cscf.emergency.env.PSAP: at least one PSAP" }}{{ end }}
        env: {{- toYaml $env | nindent 8 }}
        ports:
        - name: tcp
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        - name: udp
          containerPort: {{ .Values.service.port }}
          protocol: UDP
        - name: mon
          containerPort: 9090
          protocol: TCP
        # /check is `cdp_has_app(...)`, the PSAP table for the E-CSCF and
        # `ds_list_exists("1")` for the IBCF
        readinessProbe:
          httpGet: {path: /check, port: mon}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /metrics, port: mon}
          periodSeconds: 20
          failureThreshold: 6
        # Per-role, because the roles are not the same size
        {{- with $e.resources }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if $diameter }}
        volumeMounts:
        - name: identity
          mountPath: /etc/cscf/diameter.xml
          subPath: diameter.xml
        {{- else if $border }}
        volumeMounts:
        - name: peers
          mountPath: /etc/cscf/peers.list
          subPath: peers.list
        - name: peers
          mountPath: /etc/cscf/ici.cfg
          subPath: ici.cfg
        {{- end }}
        {{- if eq "proxy" $cscf }}
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        {{- end }}
      {{- /* With Gm attached the route is in the attachment instead (ims.gm.config) */}}
      {{- if and (eq "proxy" $cscf) (not $gm) .Values.global.ue.subnet }}
      {{- include "ims.ueroute" . | nindent 6 }}
      {{- end }}
      {{- if $diameter }}
      volumes:
      - name: diameter
        configMap:
          name: {{ .Release.Name }}-cscf
          items:
          - key: {{ $cscf }}.xml
            path: diameter.xml
      - name: identity
        emptyDir: {}
      {{- if eq "proxy" $cscf }}
      {{- include "ims.kmod" . | nindent 6 }}
      {{- end }}
      {{- else if $border }}
      volumes:
      - name: peers
        configMap:
          name: {{ .Release.Name }}-ibcf
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
{{- end }}
