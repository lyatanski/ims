# PLMN = MCC + MNC.
mcc: "001"
mnc: "01"

# Home domain. The default is the 3GPP form; it should not need overriding.
domain: mnc{{ .Values.mnc }}.mcc{{ .Values.mcc }}.3gppnetwork.org

# Diameter realms.
realm:
  ims: ims.{{ tpl .Values.domain . }}
  epc: epc.{{ tpl .Values.domain . }}

# ENUM (RFC 6116)
enum: e164.{{ tpl .Values.domain . }}.

dialplan:
  cc: "{{ .Values.global.e164.home }}"
  idd: "00"
  ndd: "0"

# The next hop for a number the ENUM tree does not claim.
# Empty with cscf.border on: the IBCF, which routes it by its peers' `routes`.
trunk: ""

# Under `global` because Helm passes that -- and only that -- down to the
# subcharts, and the CoreDNS zone below is rendered by the dns subchart with its
# own context. Anything the zone templates need has to live here.
global:
  core:
    release: core
  e164:
    home: "359"
  ue:
    subnet: 10.10.0.0/16
    mtu: 1452
    # The IPv6 UE pool (core's session.subnet6), routed the same way as the
    # IPv4 one above; empty subnet6 routes none.
    subnet6: fd10:10::/48

gm:
  enabled: true
  # The device name inside the pod.
  interface: gm0
  # The P-CSCF's Gm addresses, all on its one attachment and kept across
  # restarts and rescheduling: one IPv4 (required, `IPSEC`) and at most one
  # IPv6 (`IPSEC6`), each with its prefix length. They pin the P-CSCF to a
  # single pod, `<release>-pcscf-0`, whatever `replicaCount` says. Keep core's
  # `ims.pcscf` (the PCO) the same addresses, without the prefix lengths.
  addresses:
  - 10.20.0.10/24
  # The next hop to the UE pools over Gm, one per family like `addresses`. They
  # become routes in the attachment's IPAM config, `global.ue.subnet` through
  # the IPv4 one and, while an IPv6 address is listed, `global.ue.subnet6`
  # through the IPv6 one, and the interface's MTU becomes `global.ue.mtu`.
  gateways:
  - 10.20.0.1
  config:
    cniVersion: 0.3.1
    type: macvlan
    master: eth0
    mode: bridge
    capabilities:
      ips: true
    ipam:
      type: static

# Ici, the interconnect (TS 23.228 Annex K) the IBCF meets the peers on, used
# with cscf.border only. One IBCF, `<release>-ibcf-0`, holding every address
# listed, kept across restarts and rescheduling -- the addresses the peers'
# own configuration names. It receives on all of them and sends to a peer
# from its network's first. IPv4, and the prefix length is required: it is
# also what tells the IBCF which sources are on Ici.
#
# One Ici network, described by `interface`, `addresses` and `config`; or,
# with `networks`, several -- an IPX and a direct peering, say -- and those
# three are ignored. The IBCF is then on every network and picks the one a
# request leaves by from the peer it goes to (cscf.border.peers `network`),
# 23.228 4.14's "selecting the appropriate signalling interconnect". The
# networks share the IBCF's routing table, so they may not overlap, and
# anything past a peer's own subnet needs a route in `config`.
ici:
  # The device name inside the pod.
  interface: ici0
  addresses:
  - 10.40.0.10/24
  config:
    cniVersion: 0.3.1
    type: macvlan
    master: eth0
    mode: bridge
    capabilities:
      ips: true
    ipam:
      type: static
  # Per network:
  #   name       [a-z0-9]+, quoted where YAML would read it as a boolean
  #              (y, n, on, off). The IBCF's sockets on it are Ici-<name> and
  #              IciT-<name>, and its media takes the TrGW templates
  #              incoming-<name> and outgoing-<name>, which trgw.templates has
  #              to define, through a trgw.media.interfaces entry on it
  #   interface  the device name inside the pod, at most 15 characters
  #   addresses  the IBCF's on it, the first the one it sends from
  #   config     its CNI config, as `config` above
  networks: []
  # - name: ipx
  #   interface: ici-ipx
  #   addresses: [10.40.0.10/24]
  #   config: {cniVersion: 0.3.1, type: macvlan, master: eth1, mode: bridge,
  #            capabilities: {ips: true}, ipam: {type: static}}

# Seconds between reconciles of the UE route, for a P-CSCF without the Gm
# attachment (with it the attachment carries the route).
reconcile: 10

# valkey database numbers, one per role.
db:
  proxy: 2
  interrogating: 3
  serving: 4
  # the TAS's barring lists
  telephony: 5

replicaCount: 1

image:
  repository: ghcr.io/lyatanski/kamailio
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Diameter worker threads per CSCF
workers: 4

test:
  image: ghcr.io/lyatanski/pro2call:latest
  subscribers: 2
  t3ms: 3000
  k: "3919F39741B626604B4BACE23ACFB094"
  opc: "177FAD988A964A3AD0421B4693257056"
  imsi: "{{ .Values.mcc }}{{ .Values.mnc }}0000000001"
  msisdn:
    cc: "{{ .Values.global.e164.home }}"
    digits: 9
  uri: tel
  # ipv4 | ipv6 | ipv4v6: the PDN the UE asks for. ipv6 and ipv4v6 register
  # and call over IPv6, which needs an IPv6 gm.addresses entry and a dual-stack cluster.
  pdnType: ipv4
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 2, memory: 1Gi}
  # The interconnect check, a helm test of its own: pro2call's ibcf_peer.lua
  # as the peer network on Ici and an S-CSCF on the pod network, driving the
  # IBCF from both sides. Needs cscf.border, a test.image that carries the
  # script, this `address` among a peer's `entry` and `+<dial>` among its
  # `routes`, that peer on the first Ici network, and a trgw `network` on
  # `internal` and `external` (`external-<name>` with ici.networks, the first
  # one's) whose ipam names an IPv4 subnet -- where the TrGW addresses the SDP
  # has to name come from.
  border:
    enabled: false
    # The peer's Ici address, on the first Ici network
    address: 10.40.0.30/24
    # The peer network's E.164 country code
    dial: "999"
    # rtpengine's `timeout`, how long a call without media lasts; 0 skips
    # the check that waits it out
    mediaTimeout: 60
    # A peer on each further Ici network to check, by ici.networks name,
    # each with its own pod: `address` and `dial` as above, which that
    # network's peer has to have the same way, and optionally `mediaTimeout`.
    networks: {}
    #   peering: {address: 10.41.0.30/24, dial: "998", mediaTimeout: 0}

podAnnotations: {}

service:
  port: 5060

cscf:
  proxy:
    resources:
      requests: {cpu: 500m, memory: 512Mi}
      limits: {cpu: 2, memory: 1Gi}

  interrogating:
    resources:
      requests: {cpu: 200m, memory: 128Mi}
      limits: {cpu: 1, memory: 384Mi}

  serving:
    resources:
      requests: {cpu: 400m, memory: 256Mi}
      limits: {cpu: 2, memory: 768Mi}

  emergency:
    enabled: true
    # The PSAP table, <service>[@<cell prefix>]=<uri> each: the service URN
    # less "urn:service:" (sos, sos.fire), an optional prefix of the
    # utran-cell-id-3gpp the UE is in (MCC MNC TAC cell, hex), and a sip: URI
    # for a PSAP over IP or a tel: URI for one in the PSTN. Templated. Nothing
    # answers at the default: point it at a PSAP.
    psap:
    - sos=sip:psap.{{ include "ims.realm.ims" . }}
    # The next hop for a tel: PSAP. Empty with cscf.border on: the IBCF, which
    # routes it by its peers' `routes`. Empty without it, those requests are
    # refused.
    trunk: ""
    # Emergency numbers, <number>=<service URN>, for the P-CSCF and the
    # E-CSCF. Empty keeps 112 and 911, both urn:service:sos.
    numbers: []
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 1, memory: 256Mi}

  # TAS: call barring by number
  telephony:
    enabled: true
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 1, memory: 256Mi}

  # IBCF (cscf/border.cfg): the entry and exit point on Ici, with rtpengine
  # as its TrGW, and the S-CSCF's next hop for other networks' domains and,
  # unless `trunk` says otherwise, off-net numbers. Off by default, as there
  # is nothing for it to do without an interconnect agreement. On, it needs
  # a peer, the `ici` attachment, and the TrGW's `external` interface where
  # the peers can reach it -- on Ici, through an attachment of its own (the
  # `trgw.media.interfaces`, the rtpengine chart's values).
  border:
    enabled: false
    # The peer networks, one dispatcher set each in this order; the IBCF is
    # Ready once the first is loaded.
    #   name    for the logs and the CDRs
    #   trust   inside this network's trust domain (TS 24.229 4.4), which
    #           keeps P-Asserted-Identity, the charging headers and the like
    #           in both directions
    #   entry   its entry points, SIP URIs by address, tried in this order. A
    #           request on Ici is taken only from one of these addresses
    #   routes  what goes to it: Request-URI domains, E.164 prefixes ("+44"),
    #           or "*" for anything else; the longest matching prefix wins
    #   network the ici.networks entry it is on, the only one it is sent to
    #           and taken from; required with more than one
    peers: []
    # - name: peer
    #   trust: false
    #   entry: [sip:10.40.0.30:5060]
    #   routes: [ims.mnc099.mcc001.3gppnetwork.org, "+999"]
    #   network: ipx
    # The topology hiding key, which every IBCF has to share. Empty: one is
    # generated at install and kept in a Secret across upgrades.
    thkey: ""
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 1, memory: 256Mi}

sidecar:
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 64Mi}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

dra:
  enabled: false

trgw:
  # The IBCF ends a call whose media stopped (cscf/border.cfg route[XMLRPC])
  b2bUrl: http://%%:9090/RPC2

dns:
  service:
    spec:
      clusterIP: '{{ include "ims.dnsIP" . }}'
  zones:
  - zone: 3gppnetwork.org
    plugins:
    - name: template
      parameters: IN ANY
      configBlock: |-
        match "(^|[.])(?P<name>[^.]*)\.epc\.mnc\d{2,3}\.mcc\d{3}\.3gppnetwork.org"
        answer "{{`{{ .Name }}`}} 30 IN CNAME {{ .Values.global.core.release }}-{{`{{ .Group.name }}`}}.{{ .Release.Namespace }}.svc.cluster.local"
        fallthrough
    - name: template
      parameters: IN SRV
      configBlock: |-
        match "(?P<name>.cscf|ibcf|tas)?\.ims\.mnc\d{2,3}\.mcc\d{3}\.3gppnetwork.org"
        answer "{{`{{ .Name }}`}} 30 SRV 0 0 5060 {{ .Release.Name }}-{{`{{ or .Group.name \"icscf\" }}`}}.{{ .Release.Namespace }}.svc.cluster.local"
        fallthrough
    # ENUM (RFC 6116)
    - name: template
      parameters: IN NAPTR
      configBlock: |-
        match "^([0-9]\.)+{{ join "\\." (reverse (splitList "" (toString .Values.global.e164.home))) }}\.e164\.(?P<home>mnc\d{2,3}\.mcc\d{3}\.3gppnetwork\.org)\.$"
        answer "{{`{{ .Name }}`}} 30 IN NAPTR 10 100 \"u\" \"E2U+sip\" \"!^\\+(.*)$!sip:\\1@ims.{{`{{ .Group.home }}`}}!\" ."
        fallthrough
    - name: template
      parameters: IN NAPTR
      configBlock: |-
        match "^([0-9]\.)+e164\.mnc\d{2,3}\.mcc\d{3}\.3gppnetwork\.org\.$"
        rcode NXDOMAIN
    - name: template
      parameters: IN ANY
      configBlock: |-
        match "(^|[.])(?P<name>[^.]*).*\.mnc\d{2,3}\.mcc\d{3}\.3gppnetwork.org"
        answer "{{`{{ .Name }}`}} 30 IN CNAME {{ .Release.Name }}-{{`{{ .Group.name }}`}}.{{ .Release.Namespace }}.svc.cluster.local"
        fallthrough
