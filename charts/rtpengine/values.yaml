replicaCount: 2

# Each replica writes its calls to valkey database `offset + i` and keeps a
# standby copy of replica `(i + 1) mod replicaCount`'s, from the keyspace
# notifications on that database. A replica that restarts restores both.
db:
  offset: 8

valkey:
  # The two notifications rtpengine acts on: `$` for the SET that writes or
  # updates a call, `g` for the DEL that ends it. Without them the standby
  # subscribes, is never told anything, and has no copy to take over from.
  notifyKeyspaceEvents: K$g

# rtpengine log level: 7 is debug, 6 info
logLevel: 6

media:
  portMin: 30000
  portMax: 40000

  # Logical interfaces, rendered as the `[interface-<i>-<name>]` config sections
  # rtpengine reads when `interfaces-config` is set. A logical interface is a
  # name for a local address to answer offers with: rtpengine answers with the
  # address of the interface it picks, and that address is what the far end
  # sends RTP to, so it has to be one that end can reach. A call between two
  # UEs and a call out to a trunk do not have the same answer, which is the
  # whole reason there is more than one entry here.
  #
  # Nothing in this list decides which interface a given call gets. That is
  # `templates` below, selected per call by the control client -- see it.
  #
  # The client is the IBCF, rtpengine being its TrGW (TS 23.228 Annex I):
  # `internal` faces the network, `external` the peers on Ici. The S-CSCF no
  # longer anchors media, so with the IBCF off nothing here carries a call.
  #
  # Order matters: the first entry is rtpengine's default interface, the one a
  # control message that names no direction lands on.
  #
  # Per entry:
  #
  #   name       the logical interface name. Templates name it in `direction=`,
  #              and it is also the config section suffix, so it has to be
  #              unique within this list. A `base:suffix` name puts the entry
  #              in a round-robin group that `direction=base` selects from.
  #   address    what rtpengine binds: a device name inside the pod, a literal
  #              address, or `any` for every address the pod has. Required
  #              unless `alias` is set. With `network` below this is the device
  #              the attachment creates -- rtpengine resolves a device name to
  #              an address itself, so nothing has to read the address out of
  #              the pod and hand it over.
  #   advertised optional. What to put in SDP when it differs from the address
  #              bound, i.e. rtpengine behind a NAT.
  #   alias      another entry's `name`, making this one a second name for that
  #              interface rather than an interface of its own. Mutually
  #              exclusive with `address`.
  #   portMin    optional, overriding the range above for this interface only.
  #   portMax
  #   network    optional. A secondary network attached by Multus from a
  #              NetworkAttachmentDefinition the chart renders, which is where
  #              `address` comes from. Without one, `address` can still only be
  #              an address the pod already has -- under Kubernetes that means
  #              the pod address, routable from inside the cluster and nowhere
  #              else.
  #   vips       optional. One address per replica, in ordinal order, outside
  #   vips6      the attachment's IPAM range: the address replica `i` answers
  #              offers with instead of whatever the pod was handed. `address`
  #              is then the device it goes on. Each replica also binds the
  #              address of the replica it is standby for -- `(i + 1) mod
  #              replicaCount`, the one whose calls it copies -- so a call it
  #              takes over keeps the address the far end is sending to. The
  #              interface becomes one logical interface per owner,
  #              `<name>-<k>`, and every `direction=<name>` in `templates` is
  #              rewritten per replica to its own, so the client goes on
  #              naming templates only.
  #
  # Media moves onto these interfaces; control stays off them. Without `vips`
  # the client reaches the ng socket through the ClusterIP Service, pinned to
  # one replica per client address, and it is bound to the pod address. With them it is bound to the first such
  # interface's addresses, one rtpengine node per replica, and the client is
  # given an attachment of its own to that interface's network -- a call's
  # commands then follow its media address, which is what lets a standby that
  # takes the address over answer for the call too. The client has no other
  # way to move an existing call to another node. Either way nothing on an
  # interface facing elsewhere (`external` on Ici) answers ng, UDP or HTTP.
  interfaces:

    # The UE side. On by default, for the same reason as the P-CSCF's Gm: the
    # address rtpengine answers a UE's offer with has to be one the UE can
    # reach, and the pod address is not.
    #
    # The pool address alone is not one an ordinal keeps across
    # rescheduling; `vips` is. Off by default because it takes a privileged
    # init container -- ip_nonlocal_bind is outside Kubernetes' safe sysctls
    # -- and two addresses per replica kept out of the pool, e.g. with
    # `exclude: [10.30.0.240/28]` in the whereabouts ipam below and
    # `vips: [10.30.0.241, 10.30.0.242]`.
  - name: internal
    address: media0
    network:
      enabled: true
      name: media
      config:
        cniVersion: 0.3.1
        type: macvlan
        master: eth0
        mode: bridge
        ipam:
          type: whereabouts
          range: 10.30.0.0/24
          gateway: 10.30.0.1
          routes:
          - dst: 10.10.0.0/16
            gw: 10.30.0.1

  - name: external
    alias: internal

# Signalling templates, rendered as rtpengine's `[templates-<i>]` section: a name,
# and the string of ng flags it stands for. A control message carrying
# `template=<name>` is processed as if it had carried the flags.
#
#   internal   both legs inside
#   outgoing   an offer from inside on its way out, as the IBCF names it for
#              a call leaving the network
#   incoming   an offer from outside on its way in
#
# strict-source: once latched, a stream is only taken from that source.
# replace-origin: the o= line names the TrGW too, not the side behind it.
templates:
  internal: direction=internal direction=internal
  outgoing: direction=internal direction=external strict-source replace-origin
  incoming: direction=external direction=internal strict-source replace-origin

# Where rtpengine reports a call whose media stopped (its `timeout`, 60 s):
# an XMLRPC URL, `%%` standing for the address the call's offer came from.
# The IBCF's is http://%%:9090/RPC2, and it ends such a call towards both
# sides (dlg.terminate_dlg, xmlrpc-format 2). Empty: rtpengine drops the call
# on its own and no one is told.
b2bUrl: ""

image:
  repository: ghcr.io/lyatanski/rtpengine
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

podAnnotations: {}

service:
  port: 9910

monitor:
  port: 9090

resources:
  requests: {cpu: 500m, memory: 256Mi}
  limits: {cpu: 2, memory: 512Mi}

nodeSelector: {}

tolerations: []

affinity: {}
