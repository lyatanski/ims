{{/*
The media attachments, one per interface with a network enabled. Enabling one
is what creates it -- the chart owns the NetworkAttachmentDefinition rather
than expecting the cluster to carry one, so there is no state where the pod is
annotated for a network that does not exist.

Two interfaces sharing a `network.name` would render the object twice, which is
why `rtpengine.validate` rejects it.

Helm has no ordering for a kind it does not know, and sorts those last, so
these are applied after the StatefulSet that references them. That is
survivable where a missing Multus configuration is not: a NAD that is not there
yet fails the CNI ADD loudly -- an event naming the missing net-attach-def --
and the kubelet retries the sandbox until it is, whereas an unconfigured Multus
attaches nothing and reports nothing.
*/}}
{{- range $if := .Values.media.interfaces }}
{{- with $if.network }}
{{- if .enabled }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ include "rtpengine.network.name" (dict "root" $ "name" .name) }}
  labels: {{- include "rtpengine.labels" $ | nindent 4 }}
spec:
  # A string, not a mapping: the CRD types this as the raw CNI config, and the
  # plugin chain parses it itself.
  config: {{ include "rtpengine.network.config" (dict "root" $ "network" .) | quote }}
{{- end }}
{{- end }}
{{- end }}
