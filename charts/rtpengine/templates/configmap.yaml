apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rtpengine.name" . }}
  labels: {{- include "rtpengine.labels" . | nindent 4 }}
data:
  rtpengine.conf: |
    {{- include "rtpengine.validate" . }}
    {{- $n := int .Values.replicaCount }}
    {{- $valkey := printf "%s:%v" (include "valkey.name" .Subcharts.valkey) .Values.valkey.ports.valkey }}
    {{- $off := int .Values.db.offset }}
    {{- if gt (add $off $n) 16 }}
      {{- fail (printf "rtpengine: db.offset (%d) + replicaCount (%d) exceeds valkey's 16 databases" $off $n) }}
    {{- end }}
    {{- /* rtpengine speaks plain redis: no MOVED handling, and keyspace
           notifications are published only by the node that holds the key */}}
    {{- if gt (int .Values.valkey.cluster.primaries) 1 }}
      {{- fail "rtpengine: valkey.cluster.primaries > 1; rtpengine cannot use a valkey cluster" }}
    {{- end }}
    {{- $per := include "rtpengine.vip.names" . | fromJsonArray }}
    {{- range $i := until $n }}
    {{- $own := add $off $i }}
    {{- $pod := printf "%s-%d" (include "rtpengine.name" $) $i }}
    [{{ $pod }}]
    log-level = {{ $.Values.logLevel }}
    table = -1
    {{- /*
    This replica's own addresses, not 0.0.0.0: an interface on another
    network (the TrGW's on Ici) would otherwise take ng commands from it, over
    UDP and over HTTP alike (POST /ng-plain). The pod name is the pod address
    (/etc/hosts), which is what the probes and the Service reach.
    */}}
    listen-http = {{ $pod }}:{{ $.Values.monitor.port }}
    listen-ng = {{ include "rtpengine.ng.listen" (dict "root" $ "i" $i) }}
    {{- with $.Values.b2bUrl }}
    b2b-url = {{ . }}
    xmlrpc-format = 2
    {{- end }}
    interfaces-config = interface-{{ $i }}
    {{- if $.Values.templates }}
    templates = templates-{{ $i }}
    {{- end }}
    timeout = 60
    silent-timeout = 3600
    tos = 184
    port-min = {{ $.Values.media.portMin }}
    port-max = {{ $.Values.media.portMax }}
    no-redis-required = true
    {{- /* `redis` is what a restart restores from; without it nothing is */}}
    redis = {{ $valkey }}/{{ $own }}
    redis-write = {{ $valkey }}/{{ $own }}
    {{- /* a lone replica would subscribe to its own database */}}
    {{- if gt $n 1 }}
    redis-subscribe = {{ $valkey }}/{{ add $off (mod (add1 $i) $n) }}
    active-switchover = true
    {{- end }}
    redis-resolve-on-reconnect = true
    {{ end }}
    {{- /*
    Interfaces, per replica, because the first one rtpengine reads is its
    default and a replica's default has to be its own address. An interface
    with vips is one logical interface per owner -- this replica, then the one
    it is standby for -- since a restored call finds its interface by name and
    position, not address: a single shared name would rebind the peer's calls
    on this replica's own address. The section name only has to be unique;
    `name` is the logical interface, which is how its two address families
    become one.
    */}}
    {{- range $i := until $n }}
    {{- $owners := uniq (list (int $i) (int (mod (add1 $i) $n))) }}
    {{- range $if := $.Values.media.interfaces }}
    {{- if has $if.name $per }}
    {{- range $k := $owners }}
    {{- if $if.alias }}
    [interface-{{ $i }}-{{ $if.name }}-{{ $k }}]
    name = {{ $if.name }}-{{ $k }}
    alias = {{ $if.alias }}-{{ $k }}
    {{ end }}
    {{- range $fam, $vips := dict "4" $if.vips "6" $if.vips6 }}
    {{- with $vips }}
    [interface-{{ $i }}-{{ $if.name }}-{{ $k }}-{{ $fam }}]
    name = {{ $if.name }}-{{ $k }}
    address = {{ index . $k }}
    {{- with $if.portMin }}
    port-min = {{ . }}
    {{- end }}
    {{- with $if.portMax }}
    port-max = {{ . }}
    {{- end }}
    {{ end }}
    {{- end }}
    {{- end }}
    {{- else }}
    [interface-{{ $i }}-{{ $if.name }}]
    {{- with $if.alias }}
    alias = {{ . }}
    {{- end }}
    {{- with $if.address }}
    address = {{ . }}
    {{- end }}
    {{- with $if.advertised }}
    advertised = {{ . }}
    {{- end }}
    {{- with $if.portMin }}
    port-min = {{ . }}
    {{- end }}
    {{- with $if.portMax }}
    port-max = {{ . }}
    {{- end }}
    {{ end }}
    {{- end }}
    {{- with $.Values.templates }}
    [templates-{{ $i }}]
    {{- range $name, $flags := . }}
    {{- range $p := $per }}
    {{- $flags = regexReplaceAll (printf "direction=%s(\\s|$)" (regexQuoteMeta $p)) $flags (printf "direction=%s-%d${1}" $p $i) }}
    {{- end }}
    {{ $name }} = {{ $flags }}
    {{- end }}
    {{ end }}
    {{- end }}
  {{- with include "rtpengine.vip.script" . }}
  vip.sh: |
    {{- . | nindent 4 }}
  {{- end }}
