apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rtpengine.name" . }}
  labels: {{- include "rtpengine.labels" . | nindent 4 }}
data:
  rtpengine.conf: |
    {{- include "rtpengine.validate" . }}
    {{- $n := int .Values.replicaCount }}
    {{- $valkey := "" }}
    {{- if .Values.valkey.enabled }}
    {{- $valkey = printf "%s:%v" (include "valkey.name" .Subcharts.valkey) .Values.valkey.ports.valkey }}
    {{- else }}
    {{- $valkey = tpl (required "rtpengine: valkey.address is required with valkey.enabled false" .Values.valkey.address) . }}
    {{- end }}
    {{- $off := int .Values.db.offset }}
    {{- if gt (add $off $n) 16 }}
      {{- fail (printf "rtpengine: db.offset (%d) + replicaCount (%d) exceeds valkey's 16 databases" $off $n) }}
    {{- end }}
    {{- /* rtpengine speaks plain redis: no MOVED handling, and keyspace
           notifications are published only by the node that holds the key */}}
    {{- if and .Values.valkey.enabled (gt (int .Values.valkey.cluster.primaries) 1) }}
      {{- fail "rtpengine: valkey.cluster.primaries > 1; rtpengine cannot use a valkey cluster" }}
    {{- end }}
    {{- range $i := until $n }}
    {{- $own := add $off $i }}
    {{- $pod := printf "%s-%d" (include "rtpengine.name" $) $i }}
    [{{ $pod }}]
    log-level = {{ $.Values.logLevel }}
    table = -1
    {{- /*
    This replica's own addresses, not 0.0.0.0: an interface on another
    network (the TrGW's on Ici) would otherwise take ng commands from it, over
    UDP and over HTTP alike (POST /ng-plain). The pod name is the pod address
    (/etc/hosts), which is what the probes and the Service reach.
    */}}
    listen-http = {{ $pod }}:{{ $.Values.monitor.port }}
    listen-ng = {{ include "rtpengine.ng.listen" (dict "root" $ "i" $i) }}
    {{- with $.Values.b2bUrl }}
    b2b-url = {{ . }}
    xmlrpc-format = 2
    {{- end }}
    interfaces-config = interface-{{ $i }}
    {{- if $.Values.templates }}
    templates = templates-{{ $i }}
    {{- end }}
    timeout = 60
    silent-timeout = 3600
    tos = 184
    port-min = {{ $.Values.media.portMin }}
    port-max = {{ $.Values.media.portMax }}
    no-redis-required = true
    {{- /* `redis` is what a restart restores from; without it nothing is */}}
    redis = {{ $valkey }}/{{ $own }}
    redis-write = {{ $valkey }}/{{ $own }}
    {{- /* a lone replica would subscribe to its own database */}}
    {{- if gt $n 1 }}
    redis-subscribe = {{ $valkey }}/{{ add $off (mod (add1 $i) $n) }}
    active-switchover = true
    {{- end }}
    redis-resolve-on-reconnect = true
    {{ end }}
    {{- /*
    Interfaces and templates, per replica: a replica's own section names
    them (`interfaces-config`, `templates`), and the first interface rtpengine
    reads is its default.
    */}}
    {{- $bgpif := "" }}
    {{- $fams := list }}
    {{- if $.Values.bgp.enabled }}
    {{- $bgpif = include "rtpengine.bgp.interface" $ }}
    {{- $fams = include "rtpengine.bgp.families" $ | fromJsonArray }}
    {{- end }}
    {{- range $i := until $n }}
    {{- range $if := $.Values.media.interfaces }}
    {{- if eq $if.name $bgpif }}
    {{- /*
    The BGP interface binds the pair's addresses instead of its own: one
    logical interface per address, `<name>-<k>`, the same on both replicas,
    and `<name>` an alias of this replica's own. A call is stored under the
    logical interface and the position of its address in it, and the replica
    that restores it looks both up in its own config -- so the other's address
    has to sit under the same name and at the same position here too. Own
    first, so a default interface is this replica's own address.
    */}}
    {{- $order := list $i }}
    {{- range $k := until $n }}{{- if ne $k $i }}{{- $order = append $order $k }}{{- end }}{{- end }}
    {{- range $k := $order }}
    {{- range $fam := $fams }}
    {{- $f := int $fam }}
    [interface-{{ $i }}-{{ $if.name }}-{{ $k }}-v{{ $f }}]
    name = {{ $if.name }}-{{ $k }}
    address = {{ index (index $.Values.addresses $k) (printf "v%d" $f) }}
    {{- with $if.advertised }}
    advertised = {{ . }}
    {{- end }}
    {{- with $if.portMin }}
    port-min = {{ . }}
    {{- end }}
    {{- with $if.portMax }}
    port-max = {{ . }}
    {{- end }}
    {{ end }}
    {{- end }}
    [interface-{{ $i }}-{{ $if.name }}]
    alias = {{ $if.name }}-{{ $i }}
    {{ continue }}
    {{- end }}
    [interface-{{ $i }}-{{ $if.name }}]
    {{- with $if.alias }}
    {{- /* straight to the address, not through the BGP interface's alias */}}
    alias = {{ . }}{{ if eq . $bgpif }}-{{ $i }}{{ end }}
    {{- end }}
    {{- with $if.address }}
    address = {{ . }}
    {{- end }}
    {{- with $if.advertised }}
    advertised = {{ . }}
    {{- end }}
    {{- with $if.portMin }}
    port-min = {{ . }}
    {{- end }}
    {{- with $if.portMax }}
    port-max = {{ . }}
    {{- end }}
    {{ end }}
    {{- with $.Values.templates }}
    [templates-{{ $i }}]
    {{- range $name, $flags := . }}
    {{ $name }} = {{ $flags }}
    {{- end }}
    {{ end }}
    {{- end }}
