apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rtpengine.name" . }}
  labels: {{- include "rtpengine.labels" . | nindent 4 }}
data:
  rtpengine.conf: |
    {{- include "rtpengine.validate" . }}
    {{- $n := int .Values.replicaCount }}
    {{- $valkey := printf "%s:%v" (include "valkey.name" .Subcharts.valkey) .Values.valkey.ports.valkey }}
    {{- $off := int .Values.db.offset }}
    {{- if gt (add $off $n) 16 }}
      {{- fail (printf "rtpengine: db.offset (%d) + replicaCount (%d) exceeds valkey's 16 databases" $off $n) }}
    {{- end }}
    {{- range $i := until $n }}
    {{- $own := add $off $i }}
    [{{ include "rtpengine.name" $ }}-{{ $i }}]
    log-level = {{ $.Values.logLevel }}
    table = -1
    listen-http = 0.0.0.0:{{ $.Values.monitor.port }}
    listen-ng = 0.0.0.0:{{ $.Values.service.port }}
    interfaces-config = interface
    {{- if $.Values.templates }}
    templates = templates
    {{- end }}
    timeout = 60
    silent-timeout = 3600
    tos = 184
    port-min = {{ $.Values.media.portMin }}
    port-max = {{ $.Values.media.portMax }}
    no-redis-required = true
    redis-write = {{ $valkey }}/{{ $own }}
    redis-subscribe = {{ $valkey }}/{{ add $off (mod (add1 $i) $n) }}
    redis-resolve-on-reconnect = true
    {{ end }}
    {{- range $if := .Values.media.interfaces }}
    [interface-{{ $if.name }}]
    {{- with $if.alias }}
    alias = {{ . }}
    {{- end }}
    {{- with $if.address }}
    address = {{ . }}
    {{- end }}
    {{- with $if.advertised }}
    advertised = {{ . }}
    {{- end }}
    {{- with $if.portMin }}
    port-min = {{ . }}
    {{- end }}
    {{- with $if.portMax }}
    port-max = {{ . }}
    {{- end }}
    {{ end }}
    {{- with .Values.templates }}
    [templates]
    {{- range $name, $flags := . }}
    {{ $name }} = {{ $flags }}
    {{- end }}
    {{- end }}
