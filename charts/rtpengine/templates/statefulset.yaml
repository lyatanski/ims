apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rtpengine.name" . }}
spec:
  selector:
    matchLabels: {{- include "rtpengine.selectorLabels" . | nindent 6 }}
  serviceName: {{ include "rtpengine.name" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print .Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with include "rtpengine.networks" . }}
        k8s.v1.cni.cncf.io/networks: {{ . | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels: {{- include "rtpengine.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "rtpengine.vip.script" . }}
      # Privileged because ip_nonlocal_bind is outside Kubernetes' safe
      # sysctls, and the kubelet refuses the pod unless its allowlist names it
      initContainers:
      - name: vip
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["sh", "/etc/rtpengine/vip.sh"]
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        securityContext:
          privileged: true
        volumeMounts:
        - name: conf
          mountPath: /etc/rtpengine
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
        args:
        - --config-section=$(HOSTNAME)
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - name: control
          containerPort: {{ .Values.service.port }}
          protocol: UDP
        - name: monitor
          containerPort: {{ .Values.monitor.port }}
          protocol: TCP
        startupProbe:
          httpGet:
            path: /ping
            port: monitor
        livenessProbe:
          httpGet:
            path: /ping
            port: monitor
        readinessProbe:
          httpGet:
            path: /ping
            port: monitor
        {{- with .Values.resources }}
        resources: {{- toYaml . | nindent 12 }}
        {{- end }}
        volumeMounts:
        - name: conf
          mountPath: /etc/rtpengine
      volumes:
      - name: conf
        configMap:
          name: {{ include "rtpengine.name" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
