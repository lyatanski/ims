image:
  repository: docker.io/valkey/valkey
  tag: 9-alpine
  # The statefulset reads this; without it the rendered imagePullPolicy was the
  # empty string.
  pullPolicy: IfNotPresent

resources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: 1, memory: 256Mi}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
imagePullSecrets: []

ports:
  valkey: 6379
  bus: 16379

# valkey's `notify-keyspace-events`: the event classes it publishes on the
# __keyspace@<db>__ channels, empty for none. A client subscribing to those
# channels is not told when this is off -- the subscribe succeeds and nothing
# ever arrives -- so whatever subscribes has to set it here.
notifyKeyspaceEvents: ""

cluster:
  primaries: 1
  replicas: 0
