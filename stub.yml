# core.yml with the HSS — and the mongo / subscriber-seed / DRA machinery
# behind it — replaced by the pro2call Cx/HSS emulator.
#
# compose.yml includes ${CORE:-core.yml}, so this is a drop-in alternative:
#
#     CORE=stub.yml docker compose up -d --remove-orphans
#
# (--remove-orphans when switching back and forth: the mongo / dra / seed
# containers core.yml leaves behind are not in this model.)
#
# The emulator (pro2call bindings/examples/cx_hss.lua) answers UAR/MAR/SAR/LIR
# from the shared USIM keys for ANY IMSI, minting a real Milenage vector per
# MAR. No subscriber provisioning, no mongo `$or` lookup and no freeDiameter
# relay on the Cx path — what is left under load is the CSCF chain itself.
#
# smf / upf / pcrf are copied verbatim from core.yml: the load generator
# attaches over S5/S8 exactly as before, and the SMF needs the PCRF's Gx CCR-A
# before it answers a Create Session.
#
# The emulator is Lua over the pro2call bindings, so that tree is bind-mounted
# for the script and its prebuilt modules. Build them there first:
#
#     cd ../pro2call && cmake -S . -B out && cmake --build out
#
# Override the location with $PRO2CALL when it does not sit next to this repo.

services:
  hss:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:edge
        # Runtime deps of the mounted lua modules (net/diam/ipsec):
        # liblua5.1 + libstdc++/libgcc, and libcrypto for Milenage/md5.
        RUN apk add --no-cache lua5.1 libstdc++ libcrypto3
    command: lua bindings/examples/cx_hss.lua
    working_dir: /src
    environment:
      LUA_CPATH: /src/out/bindings/lua/?.so
      HSS_REALM: ${REALM}
      HSS_SCSCF: sip:scscf.ims.${REALM}
      IMS_K:     ${K}
      IMS_OPC:   ${OPC}
      HSS_STATS_MS: ${HSS_STATS_MS:-5000}
    volumes:
    - ${PRO2CALL:-../pro2call}:/src:ro
    expose:
    - 3868/tcp
    # The emulator keeps no durable state (SQN restarts, the UE does not check
    # freshness) and the CSCFs' cdp re-peers on its own, so restarting is free
    # — and it keeps a crash from wedging the whole stack.
    restart: unless-stopped

  pcrf:
    image: ghcr.io/lyatanski/open5gs
    command: pcrfd -c /etc/pcrf/open5gs.yaml
    configs:
    - source: pcrf.yaml
      target: /etc/pcrf/open5gs.yaml
    - source: pcrf.diameter
      target: /etc/pcrf/diameter.conf
    volumes:
    - cert-pcrf:/var/pcrf
    expose:
    - 3868/tcp
    depends_on:
      cert-pcrf:
        condition: service_completed_successfully

  cert-pcrf:
    image: ghcr.io/lyatanski/openssl
    command: req -new -batch -x509 -days 3650 -nodes -newkey rsa:1024 -out crt.pem -keyout key.pem -subj /CN=pcrf.epc.${REALM}
    working_dir: /var/pcrf
    volumes:
    - cert-pcrf:/var/pcrf

  smf:
    image: ghcr.io/lyatanski/open5gs
    command: smfd -c /etc/smf/open5gs.yaml
    configs:
    - source: smf.yaml
      target: /etc/smf/open5gs.yaml
    - source: smf.diameter
      target: /etc/smf/diameter.conf
    volumes:
    - cert-smf:/var/smf
    expose:
    - 3868/tcp
    depends_on:
      cert-smf:
        condition: service_completed_successfully
      pcrf:
        condition: service_started

  cert-smf:
    image: ghcr.io/lyatanski/openssl
    command: req -new -batch -x509 -days 3650 -nodes -newkey rsa:1024 -out crt.pem -keyout key.pem -subj /CN=smf.epc.${REALM}
    working_dir: /var/smf
    volumes:
    - cert-smf:/var/smf

  upf:
    image: ghcr.io/lyatanski/open5gs
    command: upfd -c /etc/upf/open5gs.yaml
    configs:
    - source: upf.yaml
      target: /etc/upf/open5gs.yaml
    expose:
    - 8805/udp
    - 2152/udp
    devices:
    - /dev/net/tun
    cap_add:
    - NET_ADMIN
    restart: unless-stopped
    depends_on:
      smf:
        condition: service_started

  upftun:
    image: alpine
    command:
    - sh
    - -c
    - |
      sleep 3
      ip addr add ${UEGW}/16 dev tunue;
      ip link set tunue up
    network_mode: service:upf
    cap_add:
    - NET_ADMIN
    restart: on-failure


configs:
  pcrf.yaml:
    content: |
      logger:
        level: error          # info floods the single event loop under load
        file:
          path: /var/log/pcrf.log
      global:
        max:
          ue: 16384           # Gx session pool; sized for high create rate
      pcrf:
        freeDiameter: /etc/pcrf/diameter.conf
        metrics:
          server:
          - address: 0.0.0.0
            port: 9090
        policy:
        - supi_range:          # Filter policies by SUPI
          - 001010000000000-001019999999999
          session:
          - name: internet
            type: 3  # 1:IPv4, 2:IPv6, 3:IPv4v6
            ambr:
              downlink:
                value: 1
                unit: 3  # 0:bps, 1:Kbps, 2:Mbps, 3:Gbps, 4:Tbps
              uplink:
                value: 1
                unit: 3
            qos:
              index: 9
              arp:
                priority_level: 8
                pre_emption_vulnerability: 1  # 1: Disabled, 2:Enabled
                pre_emption_capability: 1  # 1: Disabled, 2:Enabled
          - name: ims
            type: 3  # 1:IPv4, 2:IPv6, 3:IPv4v6
            ambr:
              downlink:
                value: 1
                unit: 3  # 0:bps, 1:Kbps, 2:Mbps, 3:Gbps, 4:Tbps
              uplink:
                value: 1
                unit: 3  # 0:bps, 1:Kbps, 2:Mbps, 3:Gbps, 4:Tbps
            qos:
              index: 5
              arp:
                priority_level: 1
                pre_emption_vulnerability: 1  # 1: Disabled, 2:Enabled
                pre_emption_capability: 1  # 1: Disabled, 2:Enabled
            pcc_rule:
            - qos:
                index: 1
                arp:
                  priority_level: 1
                  pre_emption_vulnerability: 1   # 1: Disabled, 2:Enabled
                  pre_emption_capability: 1   # 1: Disabled, 2:Enabled
                mbr:
                  downlink:
                    value: 82
                    unit: 1  # 0:bps, 1:Kbps, 2:Mbps, 3:Gbps, 4:Tbps
                  uplink:
                    value: 82
                    unit: 1  # 0:bps, 1:Kbps, 2:Mbps, 3:Gbps, 4:Tbps
                gbr:
                  downlink:
                    value: 82
                    unit: 1  # 0:bps, 1:Kbps, 2:Mbps, 3:Gbps, 4:Tbps
                  uplink:
                    value: 82
                    unit: 1  # 0:bps, 1:Kbps, 2:Mbps, 3:Gbps, 4:Tbps
              flow:
              - direction: 2
                description: "permit out icmp from any to assigned"
              - direction: 1
                description: "permit out icmp from any to assigned"
              - direction: 2
                description: "permit out udp from 10.200.136.98/32 23455 to assigned 1-65535"
              - direction: 1
                description: "permit out udp from 10.200.136.98/32 1-65535 to assigned 50021"
            - qos:
                index: 2
                arp:
                  priority_level: 4
                  pre_emption_vulnerability: 2   # 1: Disabled, 2:Enabled
                  pre_emption_capability: 2   # 1: Disabled, 2:Enabled
                mbr:
                  downlink:
                    value: 802
                    unit: 1  # 0:bps, 1:Kbps, 2:Mbps, 3:Gbps, 4:Tbps
                  uplink:
                    value: 802
                    unit: 1  # 0:bps, 1:Kbps, 2:Mbps, 3:Gbps, 4:Tbps
                gbr:
                  downlink:
                    value: 802
                    unit: 1  # 0:bps, 1:Kbps, 2:Mbps, 3:Gbps, 4:Tbps
                  uplink:
                    value: 802
                    unit: 1  # 0:bps, 1:Kbps, 2:Mbps, 3:Gbps, 4:Tbps

  pcrf.diameter:
    content: |
      Identity = "pcrf.epc.${REALM}";
      No_SCTP;
      TLS_Cred = "/var/pcrf/crt.pem", "/var/pcrf/key.pem";
      TLS_CA = "/var/pcrf/crt.pem";

      LoadExtension = "/opt/lib/freeDiameter/dbg_msg_dumps.fdx" : "0x4444";
      LoadExtension = "/opt/lib/freeDiameter/dict_rfc5777.fdx";
      LoadExtension = "/opt/lib/freeDiameter/dict_mip6i.fdx";
      LoadExtension = "/opt/lib/freeDiameter/dict_nasreq.fdx";
      LoadExtension = "/opt/lib/freeDiameter/dict_nas_mipv6.fdx";
      LoadExtension = "/opt/lib/freeDiameter/dict_dcca.fdx";
      LoadExtension = "/opt/lib/freeDiameter/dict_dcca_3gpp.fdx";

      ConnectPeer = "pcscf.ims.${REALM}" { No_TLS; };
      ConnectPeer = "smf.epc.${REALM}" { No_TLS; };

  smf.yaml:
    content: |
      logger:
        level: error          # info floods the single event loop under load
        file:
          path: /var/log/smf.log
      global:
        max:
          ue: 16384           # session/UE context pool; sized for high create rate
      smf:
        freeDiameter: /etc/smf/diameter.conf
        metrics:
          server:
          - address: 0.0.0.0
            port: 9091
        pfcp:
          server:
          - dev: eth0
            advertise: smf
          client:
        gtpc:
          server:
          - address: 0.0.0.0
        gtpu:
          server:
          - address: 0.0.0.0
            advertise: upf
        session:
        - subnet: ${UENET}
          gateway: ${UEGW}
          dnn: ims
        dns:
        - ${DNSv4}
        p-cscf:
        - pcscf
        ctf:
          enabled: no

  smf.diameter:
    content: |
      Identity = "smf.epc.${REALM}";
      No_SCTP;
      TLS_Cred = "/var/smf/crt.pem", "/var/smf/key.pem";
      TLS_CA = "/var/smf/crt.pem";

      LoadExtension = "/opt/lib/freeDiameter/dbg_msg_dumps.fdx" : "0x4444";
      LoadExtension = "/opt/lib/freeDiameter/dict_rfc5777.fdx";
      LoadExtension = "/opt/lib/freeDiameter/dict_mip6i.fdx";
      LoadExtension = "/opt/lib/freeDiameter/dict_nasreq.fdx";
      LoadExtension = "/opt/lib/freeDiameter/dict_nas_mipv6.fdx";
      LoadExtension = "/opt/lib/freeDiameter/dict_dcca.fdx";
      LoadExtension = "/opt/lib/freeDiameter/dict_dcca_3gpp.fdx";

      ConnectPeer = "pcrf.epc.${REALM}" { ConnectTo = "pcrf"; No_TLS; };

  upf.yaml:
    content: |
      logger:
        level: error          # info floods the single event loop under load
        file:
          path: /var/log/upf.log
      global:
        max:
          ue: 16384           # session/UE context pool; sized for high create rate
      upf:
        metrics:
          server:
          - address: 0.0.0.0
            port: 9091
        pfcp:
          server:
          - dev: eth0
            advertise: upf
          client:
            smf:
            - address: smf
        gtpu:
          server:
          - address: 0.0.0.0
            advertise: upf
        session:
        - subnet: ${UENET}
          gateway: ${UEGW}
          dnn: ims
          dev: tunue


volumes:
  cert-pcrf:
  cert-smf:
