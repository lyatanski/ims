services:
  promtail:
    image: grafana/promtail
    command: -config.file=/etc/promtail/config.yml
    configs:
    - source: promtail.yml
      target: /etc/promtail/config.yml
    volumes:
    - /var/lib/docker:/var/lib/docker
    - /var/run/docker.sock:/var/run/docker.sock

  loki:
    image: grafana/loki
    command: -config.file=/etc/loki/local-config.yaml
    expose:
    - 3100/tcp

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    expose:
    - 8080/tcp

  prometheus:
    image: prom/prometheus
    command: --config.file=/etc/prometheus/prometheus.yml
    expose:
    - 9090/tcp
    configs:
    - source: prometheus.yml
      target: /etc/prometheus/prometheus.yml

  jsonnet:
    image: ghcr.io/lyatanski/grafonnet
    command:
    - sh
    - -c
    - |
      jsonnet /dash/ims.jsonnet -o /board/ims.json
      jsonnet /dash/log.jsonnet -o /board/log.json
      jsonnet /dash/stat.jsonnet -o /board/stat.json
    configs:
    - source: stat.jsonnet
      target: /dash/stat.jsonnet
    - source: log.jsonnet
      target: /dash/log.jsonnet
    - source: ims.jsonnet
      target: /dash/ims.jsonnet
    volumes:
    - dash:/board

  grafana:
    image: grafana/grafana
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    configs:
    - source: datasources.yml
      target: /etc/grafana/provisioning/datasources/ds.yaml
    - source: dashboards.yml
      target: /etc/grafana/provisioning/dashboards/ds.yaml
        #- source: logs.json
        #  target: /etc/dashboards/logs.json
        #- source: cadvisor.json
        #  target: /etc/dashboards/cadvisor.json
        #- source: rtpengine.json
        #  target: /etc/dashboards/rtpengine.json
    volumes:
    - dash:/etc/dashboards/
    depends_on:
      jsonnet:
        condition: service_completed_successfully
    ports:
    - 3000:3000


configs:
  promtail.yml:
    content: |
      server:
        http_listen_port: 9080
        grpc_listen_port: 0
      positions:
        filename: /tmp/positions.yaml
      clients:
      - url: http://loki:3100/loki/api/v1/push
      scrape_configs:
      - job_name: system
        docker_sd_configs:
        - host: unix:///var/run/docker.sock
          refresh_interval: 5s
        relabel_configs:
        - source_labels: ['__meta_docker_container_name']
          regex: '/(.*)'
          target_label: 'container'
        #pipeline_stages:

  datasources.yml:
    content: |
      apiVersion: 1
      datasources:
      - name: Loki
        type: loki
        orgId: 1
        uid: loki
        url: http://loki:3100
        access: proxy
        basicAuth: false
        editable: false
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        access: proxy
        basicAuth: false
        editable: false

  dashboards.yml:
    content: |
      apiVersion: 1
      providers:
      - name: dashboards
        type: file
        updateIntervalSeconds: 3600
        options:
          path: /etc/dashboards

  logs.json:
    file: dash/log.json

  cadvisor.json:
    file: dash/stat.json

  stat.jsonnet:
    file: dash/stat.jsonnet

  ims.jsonnet:
    file: dash/ims.jsonnet

  log.jsonnet:
    file: dash/log.jsonnet

  rtpengine.json:
    file: dash/rtp.json

  prometheus.yml:
    content: |
      global:
        scrape_interval: 10s
      scrape_configs:
      - job_name: cadvisor
        static_configs:
        - targets:
          - cadvisor:8080
      - job_name: pcscf
        honor_timestamps: false
        static_configs:
        - targets:
          - pcscf:9090
      - job_name: icscf
        honor_timestamps: false
        static_configs:
        - targets:
          - icscf:9090
      - job_name: scscf
        honor_timestamps: false
        static_configs:
        - targets:
          - scscf:9090
      - job_name: rtpengine
        honor_timestamps: false
        static_configs:
        - targets:
          - rtpengine:9090
volumes:
  dash:
