services:
  fluentbit:
    image: fluent/fluent-bit
    command: -c /fluent-bit/etc/fluent-bit.conf
    configs:
    - source: fluent-bit.conf
      target: /fluent-bit/etc/fluent-bit.conf
    - source: enrich.lua
      target: /fluent-bit/etc/enrich.lua
    volumes:
    - /var/lib/docker/containers:/var/lib/docker/containers:ro

  loki:
    image: grafana/loki
    command: -config.file=/etc/loki/local-config.yaml
    expose:
    - 3100/tcp

  cadvisor:
    image: gcr.io/cadvisor/cadvisor
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    expose:
    - 8080/tcp

  prometheus:
    image: prom/prometheus
    command: --config.file=/etc/prometheus/prometheus.yml
    expose:
    - 9090/tcp
    configs:
    - source: prometheus.yml
      target: /etc/prometheus/prometheus.yml

  jsonnet:
    image: ghcr.io/lyatanski/grafonnet
    command:
    - sh
    - -exc
    - |
      for jsonnet in /dash/*.jsonnet; do
        jsonnet $$jsonnet -o /board/$$(basename $$jsonnet .jsonnet).json
      done
    configs:
    - source: stat.jsonnet
      target: /dash/stat.jsonnet
    - source: log.jsonnet
      target: /dash/log.jsonnet
    - source: rtp.jsonnet
      target: /dash/rtp.jsonnet
    - source: ims.jsonnet
      target: /dash/ims.jsonnet
    - source: load.jsonnet
      target: /dash/load.jsonnet
    - source: open5gs.jsonnet
      target: /dash/open5gs.jsonnet
    - source: arch.jsonnet
      target: /dash/arch.jsonnet
    volumes:
    - dash:/board

  grafana:
    image: grafana/grafana
    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /usr/share/grafana/dashboards/stat.json
    configs:
    - source: datasources.yml
      target: /etc/grafana/provisioning/datasources/ds.yaml
    - source: dashboards.yml
      target: /etc/grafana/provisioning/dashboards/ds.yaml
    volumes:
    - dash:/usr/share/grafana/dashboards
    depends_on:
      jsonnet:
        condition: service_completed_successfully
    ports:
    - 3000:3000


configs:
  fluent-bit.conf:
    content: |
      [SERVICE]
          flush     1
          log_level info

      [INPUT]
          name             tail
          tag              docker.*
          path             /var/lib/docker/containers/*/*-json.log
          path_key         filepath
          multiline.parser docker
          db               /tmp/flb.db
          refresh_interval 5
          read_from_head   true

      [FILTER]
          name   lua
          match  docker.*
          script /fluent-bit/etc/enrich.lua
          call   set_container

      [OUTPUT]
          name            loki
          match           docker.*
          host            loki
          port            3100
          label_keys      $$container
          remove_keys     stream,time,filepath
          drop_single_key raw

  enrich.lua:
    content: |
      -- Resolve the Docker container name from the log file path and set it as
      -- the `container` record key (replaces Promtail's docker_sd relabel of
      -- __meta_docker_container_name). Cached per id to avoid re-reading the
      -- container's config.v2.json on every log line.
      local cache = {}

      local function name_for(id)
        if cache[id] then return cache[id] end
        local name = id:sub(1, 12)
        local f = io.open('/var/lib/docker/containers/' .. id .. '/config.v2.json', 'r')
        if f then
          local data = f:read('*a')
          f:close()
          local n = data:match('"Name":"/([^"]+)"')
          if n then name = n end
        end
        cache[id] = name
        return name
      end

      function set_container(tag, ts, record)
        local fp = record['filepath']
        if fp then
          local id = fp:match('/containers/([0-9a-f]+)/')
          if id then record['container'] = name_for(id) end
        end
        return 1, ts, record
      end

  datasources.yml:
    content: |
      apiVersion: 1
      datasources:
      - name: Loki
        type: loki
        orgId: 1
        uid: loki
        url: http://loki:3100
        access: proxy
        basicAuth: false
        editable: false
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus:9090
        access: proxy
        basicAuth: false
        editable: false

  dashboards.yml:
    content: |
      apiVersion: 1
      providers:
      - name: dashboards
        type: file
        updateIntervalSeconds: 3600
        options:
          path: /usr/share/grafana/dashboards

  stat.jsonnet:
    content: |
      local g = import 'github.com/grafana/grafonnet/gen/grafonnet-latest/main.libsonnet';
      local ds = 'prometheus';

      local stat(title, expr, pos, unit=null) =
        g.panel.stat.new(title)
        + g.panel.stat.queryOptions.withDatasource('prometheus', ds)
        + g.panel.stat.queryOptions.withTargets([g.query.prometheus.new(ds, expr)])
        + g.panel.stat.panelOptions.withGridPos(pos.h, pos.w, pos.x, pos.y)
        + g.panel.stat.panelOptions.withTransparent()
        + if unit == null then {} else g.panel.stat.standardOptions.withUnit(unit);

      local ts(title, expr, pos, unit) =
        g.panel.timeSeries.new(title)
        + g.panel.timeSeries.queryOptions.withDatasource('prometheus', ds)
        + g.panel.timeSeries.queryOptions.withTargets([
            g.query.prometheus.new(ds, expr)
            + g.query.prometheus.withLegendFormat('{{name}}')
          ])
        + g.panel.timeSeries.panelOptions.withGridPos(pos.h, pos.w, pos.x, pos.y)
        + g.panel.timeSeries.standardOptions.withUnit(unit);

      g.dashboard.new('stat')
      + g.dashboard.withUid('stat')
      + g.dashboard.withDescription('container resource monitoring')
      + g.dashboard.time.withFrom('now-6h')
      + g.dashboard.withRefresh('5s')
      + g.dashboard.graphTooltip.withSharedCrosshair()
      + g.dashboard.withPanels([
        stat('Running containers', 'count(time() - container_last_seen{name!=\'\'} < 30)',              {h: 3, w: 8, x: 0,  y: 0}),
        stat('Total Mem Usage',    'sum(container_memory_usage_bytes{name!=\'\'})',                     {h: 3, w: 8, x: 8,  y: 0}, 'bytes'),
        stat('Total CPU Usage',    'sum(rate(container_cpu_user_seconds_total{name!=\'\'}[5m]) * 100)', {h: 3, w: 8, x: 16, y: 0}, 'percent')
        + g.panel.stat.standardOptions.withMin(0)
        + g.panel.stat.standardOptions.withMax(100),

        ts('CPU Usage',  'rate(container_cpu_user_seconds_total{name!=\'\'}[5m]) * 100',                {h: 7, w: 24, x: 0,  y: 3 }, 'percent'),
        ts('Mem Usage',  'container_memory_usage_bytes{name!=\'\'}',                                    {h: 7, w: 24, x: 0,  y: 10}, 'bytes'),
        ts('Network Rx', 'irate(container_network_receive_bytes_total{name!=\'\'}[5m])',                {h: 7, w: 12, x: 0,  y: 17}, 'Bps'),
        ts('Network Tx', 'irate(container_network_transmit_bytes_total{name!=\'\'}[5m])',               {h: 7, w: 12, x: 12, y: 17}, 'Bps'),
      ])

  ims.jsonnet:
    content: |
      // IMS KPI dashboard - aligned with 3GPP TS 32.454 (KPIs for the IMS).
      //
      // KPIs are grouped by TS 32.454 category (accessibility, retainability,
      // utilization). Most panels reuse native Kamailio xhttp_prom statistics;
      // the session-establishment and setup-time KPIs use custom counters that
      // the S-CSCF exposes (declared in monitor.cfg, incremented in serving.cfg)
      // because Kamailio's tm module does not export transaction stats.
      // See doc/monitor.md for the full KPI-to-metric mapping.
      local g = import 'github.com/grafana/grafonnet/gen/grafonnet-latest/main.libsonnet';
      local ds = 'prometheus';

      // ---- metric names (all carry a job label: pcscf / icscf / scscf) ----
      local m = {
        reg_ok:    'kamailio_ims_registrar_scscf_accepted_regs{job="scscf"}',
        reg_no:    'kamailio_ims_registrar_scscf_rejected_regs{job="scscf"}',
        sar_to:    'kamailio_ims_registrar_scscf_sar_timeouts{job="scscf"}',
        sar_rt:    'kamailio_ims_registrar_scscf_sar_avg_response_time{job="scscf"}',
        mar_to:    'kamailio_ims_auth_mar_timeouts{job="scscf"}',
        mar_rt:    'kamailio_ims_auth_mar_avg_response_time{job="scscf"}',
        ses_att:   'kamailio_ims_session_setup_attempts_total{job="scscf"}',
        ses_ok:    'kamailio_ims_session_setup_success_total{job="scscf"}',
        ses_no:    'kamailio_ims_session_setup_failure_total{job="scscf"}',
        dur_b:     'kamailio_ims_session_setup_duration_bucket{job="scscf"}',
        dur_s:     'kamailio_ims_session_setup_duration_sum{job="scscf"}',
        dur_c:     'kamailio_ims_session_setup_duration_count{job="scscf"}',
        impus:     'kamailio_ims_usrloc_scscf_active_impus{job="scscf"}',
        contacts:  'kamailio_ims_usrloc_scscf_active_contacts{job="scscf"}',
        subs:      'kamailio_ims_usrloc_scscf_active_subscriptions{job="scscf"}',
        pcontacts: 'kamailio_ims_usrloc_pcscf_registered_contacts{job="pcscf"}',
        dlg_act:   'kamailio_dialog_ng_active{job="scscf"}',
        dlg_early: 'kamailio_dialog_ng_early{job="scscf"}',
        dlg_proc:  'kamailio_dialog_ng_processed{job="scscf"}',
        dlg_exp:   'kamailio_dialog_ng_expired{job="scscf"}',
        ro_act:    'kamailio_ims_charging_active_ro_sessions{job="scscf"}',
        ccr_i:     'kamailio_ims_charging_initial_ccrs{job="scscf"}',
        ccr_ok:    'kamailio_ims_charging_successful_initial_ccrs{job="scscf"}',
        ccr_rt:    'kamailio_ims_charging_ccr_avg_response_time{job="scscf"}',
        ccr_to:    'kamailio_ims_charging_ccr_timeouts{job="scscf"}',
        killed:    'kamailio_ims_charging_killed_calls{job="scscf"}',
        uar_rx:    'kamailio_ims_icscf_uar_replies_received{job="icscf"}',
        uar_rt:    'kamailio_ims_icscf_uar_replies_response_time{job="icscf"}',
        lir_rx:    'kamailio_ims_icscf_lir_replies_received{job="icscf"}',
        lir_rt:    'kamailio_ims_icscf_lir_replies_response_time{job="icscf"}',
      };

      // ---- PromQL fragment helpers ($$ escapes Compose interpolation) ----
      local inc(x)  = 'sum(increase(' + x + '[$$__range]))';
      local rt(x)   = 'sum(rate(' + x + '[$$__rate_interval]))';
      local cur(x)  = 'sum(' + x + ')';
      local avgf(x) = 'avg(' + x + ')';
      // failures TS 32.454 attributes to the UE / user, excluded from the
      // network success rate: 404 not found, 480/486/600/603 busy/unavailable,
      // 484 address incomplete, 487 released before answer.
      local fail_user = 'sum(increase(kamailio_ims_session_setup_failure_total{job="scscf", code=~"404|480|484|486|487|600|603"}[$$__range]))';

      // ---- threshold palettes ----
      local ok_thr   = [{ color: 'red', value: null }, { color: 'yellow', value: 95 }, { color: 'green', value: 99 }];
      local drop_thr = [{ color: 'green', value: null }, { color: 'yellow', value: 2 }, { color: 'red', value: 5 }];
      local time_thr = [{ color: 'green', value: null }, { color: 'yellow', value: 1000 }, { color: 'red', value: 3000 }];
      local to_thr   = [{ color: 'green', value: null }, { color: 'red', value: 1 }];

      // ---- panel helpers ----
      local tgt(expr, legend='') =
        g.query.prometheus.new(ds, expr)
        + (if legend == '' then {} else g.query.prometheus.withLegendFormat(legend));

      local steps(arr) =
        g.panel.stat.standardOptions.thresholds.withSteps([
          g.panel.stat.standardOptions.threshold.step.withColor(s.color)
          + g.panel.stat.standardOptions.threshold.step.withValue(s.value)
          for s in arr
        ]);

      local stat(title, expr, p, unit='short', decimals=0) =
        g.panel.stat.new(title)
        + g.panel.stat.queryOptions.withDatasource('prometheus', ds)
        + g.panel.stat.queryOptions.withTargets([tgt(expr)])
        + g.panel.stat.panelOptions.withGridPos(h=p.h, w=p.w, x=p.x, y=p.y)
        + g.panel.stat.standardOptions.withUnit(unit)
        + g.panel.stat.standardOptions.withDecimals(decimals);

      local kpi(title, expr, p, thr, unit='percent', decimals=2) =
        g.panel.stat.new(title)
        + g.panel.stat.queryOptions.withDatasource('prometheus', ds)
        + g.panel.stat.queryOptions.withTargets([tgt(expr)])
        + g.panel.stat.panelOptions.withGridPos(h=p.h, w=p.w, x=p.x, y=p.y)
        + g.panel.stat.options.withColorMode('background')
        + g.panel.stat.options.withGraphMode('area')
        + g.panel.stat.standardOptions.withUnit(unit)
        + g.panel.stat.standardOptions.withDecimals(decimals)
        + steps(thr);

      local ts(title, targets, p, unit='short') =
        g.panel.timeSeries.new(title)
        + g.panel.timeSeries.queryOptions.withDatasource('prometheus', ds)
        + g.panel.timeSeries.queryOptions.withTargets(targets)
        + g.panel.timeSeries.panelOptions.withGridPos(h=p.h, w=p.w, x=p.x, y=p.y)
        + g.panel.timeSeries.standardOptions.withUnit(unit);

      local row(title, y) =
        g.panel.row.new(title)
        + g.panel.row.withGridPos(y);

      g.dashboard.new('IMS KPI (3GPP TS 32.454)')
      + g.dashboard.withUid('ims')
      + g.dashboard.withDescription('IMS Key Performance Indicators per 3GPP TS 32.454. Reuses Kamailio xhttp_prom statistics; session-establishment and setup-time KPIs use custom S-CSCF counters.')
      + g.dashboard.time.withFrom('now-6h')
      + g.dashboard.withRefresh('5s')
      + g.dashboard.graphTooltip.withSharedCrosshair()
      + g.dashboard.withPanels([
        // ===== Accessibility - Registration =====
        row('Accessibility - Registration (Initial Registration Success Rate)', 0),
        kpi('Registration Success Rate (S-CSCF)', '100 * ' + inc(m.reg_ok) + ' / (' + inc(m.reg_ok) + ' + ' + inc(m.reg_no) + ')', { h: 6, w: 6, x: 0, y: 1 }, ok_thr),
        stat('Registration Attempts', '(' + inc(m.reg_ok) + ' + ' + inc(m.reg_no) + ')', { h: 6, w: 6, x: 6, y: 1 }),
        stat('Successful Registrations', inc(m.reg_ok), { h: 6, w: 6, x: 12, y: 1 }),
        stat('Rejected Registrations', inc(m.reg_no), { h: 6, w: 6, x: 18, y: 1 }),
        ts('Registration Rate', [tgt(rt(m.reg_ok), 'accepted'), tgt(rt(m.reg_no), 'rejected'), tgt(rt(m.sar_to), 'SAR timeouts')], { h: 7, w: 24, x: 0, y: 7 }, 'reqps'),

        // ===== Accessibility - Session Establishment =====
        row('Accessibility - Session Establishment (SESR)', 14),
        kpi('Session Establishment Success Rate', '100 * ' + inc(m.ses_ok) + ' / ' + inc(m.ses_att), { h: 6, w: 8, x: 0, y: 15 }, ok_thr),
        kpi('Session Establishment Network Success Rate', '100 * ' + inc(m.ses_ok) + ' / (' + inc(m.ses_att) + ' - ' + fail_user + ')', { h: 6, w: 8, x: 8, y: 15 }, ok_thr),
        stat('Session Setup Attempts', inc(m.ses_att), { h: 6, w: 8, x: 16, y: 15 }),
        ts('Session Setup Rate', [tgt(rt(m.ses_att), 'attempts'), tgt(rt(m.ses_ok), 'success'), tgt(rt(m.ses_no), 'failure')], { h: 7, w: 12, x: 0, y: 21 }, 'reqps'),
        ts('Session Setup Failures by Code', [tgt('sum by (code) (rate(kamailio_ims_session_setup_failure_total{job="scscf"}[$$__rate_interval]))', '{{code}}')], { h: 7, w: 12, x: 12, y: 21 }, 'reqps'),

        // ===== Accessibility - Session Setup Time (latency) =====
        row('Accessibility - Session Setup Time', 28),
        kpi('Session Setup Time (mean)', inc(m.dur_s) + ' / ' + inc(m.dur_c), { h: 6, w: 8, x: 0, y: 29 }, time_thr, 'ms', 0),
        stat('Session Setup Time p95', 'histogram_quantile(0.95, sum by (le) (rate(' + m.dur_b + '[$$__rate_interval])))', { h: 6, w: 8, x: 8, y: 29 }, 'ms'),
        stat('Session Setup Time p99', 'histogram_quantile(0.99, sum by (le) (rate(' + m.dur_b + '[$$__rate_interval])))', { h: 6, w: 8, x: 16, y: 29 }, 'ms'),
        ts('Session Setup Time Percentiles', [
          tgt('histogram_quantile(0.50, sum by (le) (rate(' + m.dur_b + '[$$__rate_interval])))', 'p50'),
          tgt('histogram_quantile(0.95, sum by (le) (rate(' + m.dur_b + '[$$__rate_interval])))', 'p95'),
          tgt('histogram_quantile(0.99, sum by (le) (rate(' + m.dur_b + '[$$__rate_interval])))', 'p99'),
        ], { h: 7, w: 12, x: 0, y: 35 }, 'ms'),
        ts('Diameter Control-Plane Latency', [
          tgt(avgf(m.sar_rt), 'Cx SAR (registration)'),
          tgt(avgf(m.mar_rt), 'Cx MAR (authentication)'),
          tgt(avgf(m.ccr_rt), 'Ro CCR (charging)'),
          tgt('(' + rt(m.uar_rt) + ') / (' + rt(m.uar_rx) + ')', 'Cx UAR (I-CSCF)'),
        ], { h: 7, w: 12, x: 12, y: 35 }, 'ms'),

        // ===== Retainability =====
        row('Retainability - IMS Session Drop Rate', 42),
        kpi('IMS Session Drop Rate', '100 * ' + inc(m.dlg_exp) + ' / ' + inc(m.dlg_proc), { h: 6, w: 8, x: 0, y: 43 }, drop_thr),
        stat('Active Sessions', cur(m.dlg_act), { h: 6, w: 8, x: 8, y: 43 }),
        stat('Early Dialogs', cur(m.dlg_early), { h: 6, w: 8, x: 16, y: 43 }),
        ts('Dialogs Processed vs Expired', [tgt(rt(m.dlg_proc), 'processed'), tgt(rt(m.dlg_exp), 'expired / killed')], { h: 7, w: 12, x: 0, y: 49 }, 'reqps'),
        ts('Active & Early Dialogs', [tgt(cur(m.dlg_act), 'active'), tgt(cur(m.dlg_early), 'early')], { h: 7, w: 12, x: 12, y: 49 }),

        // ===== Utilization - Registered base =====
        row('Utilization - Registered Base', 56),
        stat('Registered IMPUs (S-CSCF)', cur(m.impus), { h: 6, w: 6, x: 0, y: 57 }),
        stat('Registered Contacts (S-CSCF)', cur(m.contacts), { h: 6, w: 6, x: 6, y: 57 }),
        stat('Reg-event Subscriptions', cur(m.subs), { h: 6, w: 6, x: 12, y: 57 }),
        stat('Registered Contacts (P-CSCF)', cur(m.pcontacts), { h: 6, w: 6, x: 18, y: 57 }),
        ts('Registered Base', [
          tgt(cur(m.impus), 'IMPUs (S-CSCF)'),
          tgt(cur(m.contacts), 'contacts (S-CSCF)'),
          tgt(cur(m.subs), 'reg-event subs'),
          tgt(cur(m.pcontacts), 'contacts (P-CSCF)'),
        ], { h: 7, w: 24, x: 0, y: 63 }),

        // ===== Charging (Ro / TS 32.299) =====
        row('Charging - Ro (TS 32.299)', 70),
        stat('Active Ro Sessions', cur(m.ro_act), { h: 6, w: 6, x: 0, y: 71 }),
        stat('Initial CCRs', inc(m.ccr_i), { h: 6, w: 6, x: 6, y: 71 }),
        stat('Successful Initial CCRs', inc(m.ccr_ok), { h: 6, w: 6, x: 12, y: 71 }),
        stat('Killed Calls (out of credit)', inc(m.killed), { h: 6, w: 6, x: 18, y: 71 }),

        // ===== Element health - Diameter (Cx / Ro) =====
        row('Element Health - Diameter (Cx / Ro)', 77),
        stat('I-CSCF UAR Replies', inc(m.uar_rx), { h: 6, w: 6, x: 0, y: 78 }),
        stat('I-CSCF LIR Replies', inc(m.lir_rx), { h: 6, w: 6, x: 6, y: 78 }),
        kpi('MAR Timeouts (auth)', inc(m.mar_to), { h: 6, w: 4, x: 12, y: 78 }, to_thr, 'short', 0),
        kpi('SAR Timeouts (reg)', inc(m.sar_to), { h: 6, w: 4, x: 16, y: 78 }, to_thr, 'short', 0),
        kpi('CCR Timeouts (charging)', inc(m.ccr_to), { h: 6, w: 4, x: 20, y: 78 }, to_thr, 'short', 0),
      ])

  load.jsonnet:
    content: |
      // Registration Load & Bottleneck dashboard. Walks the IMS registration path top
      // to bottom so you can SEE which stage gates under load:
      //   outcome -> SIP UDP transport -> Cx round-trip (HSS/DRA) -> HSS DB (mongo).
      local g = import 'github.com/grafana/grafonnet/gen/grafonnet-latest/main.libsonnet';
      local ds = 'prometheus';

      local ri = '[$$__rate_interval]';
      local rng = '[$$__range]';

      local tgt(expr, legend='') =
        g.query.prometheus.new(ds, expr)
        + (if legend == '' then {} else g.query.prometheus.withLegendFormat(legend));

      local steps(arr) =
        g.panel.stat.standardOptions.thresholds.withSteps([
          g.panel.stat.standardOptions.threshold.step.withColor(s.color)
          + g.panel.stat.standardOptions.threshold.step.withValue(s.value)
          for s in arr
        ]);

      local stat(title, expr, p, unit='short', decimals=0) =
        g.panel.stat.new(title)
        + g.panel.stat.queryOptions.withDatasource('prometheus', ds)
        + g.panel.stat.queryOptions.withTargets([tgt(expr)])
        + g.panel.stat.panelOptions.withGridPos(h=p.h, w=p.w, x=p.x, y=p.y)
        + g.panel.stat.standardOptions.withUnit(unit)
        + g.panel.stat.standardOptions.withDecimals(decimals);

      local kpi(title, expr, p, thr, unit='percent', decimals=2) =
        g.panel.stat.new(title)
        + g.panel.stat.queryOptions.withDatasource('prometheus', ds)
        + g.panel.stat.queryOptions.withTargets([tgt(expr)])
        + g.panel.stat.panelOptions.withGridPos(h=p.h, w=p.w, x=p.x, y=p.y)
        + g.panel.stat.options.withColorMode('background')
        + g.panel.stat.options.withGraphMode('area')
        + g.panel.stat.standardOptions.withUnit(unit)
        + g.panel.stat.standardOptions.withDecimals(decimals)
        + steps(thr);

      local ts(title, targets, p, unit='short') =
        g.panel.timeSeries.new(title)
        + g.panel.timeSeries.queryOptions.withDatasource('prometheus', ds)
        + g.panel.timeSeries.queryOptions.withTargets(targets)
        + g.panel.timeSeries.panelOptions.withGridPos(h=p.h, w=p.w, x=p.x, y=p.y)
        + g.panel.timeSeries.standardOptions.withUnit(unit);

      local row(title, y) =
        g.panel.row.new(title) + g.panel.row.withGridPos(y);

      // windowed Cx round-trip (ms) = rate(response_time sum) / rate(replies count)
      local cxrt(base, joblbl) =
        '(sum(rate(' + base + '_replies_response_time{job="' + joblbl + '"}' + ri + ')) / '
        + 'sum(rate(' + base + '_replies_received{job="' + joblbl + '"}' + ri + ')))';

      local ok_thr   = [{ color: 'red', value: null }, { color: 'yellow', value: 95 }, { color: 'green', value: 99 }];
      local time_thr = [{ color: 'green', value: null }, { color: 'yellow', value: 100 }, { color: 'red', value: 1000 }];
      local drop_thr = [{ color: 'green', value: null }, { color: 'red', value: 1 }];

      g.dashboard.new('Registration Load & Bottleneck')
      + g.dashboard.withUid('load')
      + g.dashboard.withDescription('Walks the IMS registration path under load to localize the gate: outcome -> SIP UDP transport -> Cx round-trip (HSS/DRA) -> HSS database (mongo).')
      + g.dashboard.time.withFrom('now-15m')
      + g.dashboard.withRefresh('2s')
      + g.dashboard.graphTooltip.withSharedCrosshair()
      + g.dashboard.withPanels([
        // ===== Outcome =====
        row('Outcome - registrations', 0),
        kpi('Registration Success Rate', '100 * sum(increase(kamailio_ims_registrar_scscf_accepted_regs{job="scscf"}' + rng + ')) / (sum(increase(kamailio_ims_registrar_scscf_accepted_regs{job="scscf"}' + rng + ')) + sum(increase(kamailio_ims_registrar_scscf_rejected_regs{job="scscf"}' + rng + ')))', { h: 6, w: 8, x: 0, y: 1 }, ok_thr),
        stat('Registered Contacts (P-CSCF)', 'sum(kamailio_ims_usrloc_pcscf_registered_contacts{job="pcscf"})', { h: 6, w: 8, x: 8, y: 1 }),
        stat('Registered IMPUs (S-CSCF)', 'sum(kamailio_ims_usrloc_scscf_active_impus{job="scscf"})', { h: 6, w: 8, x: 16, y: 1 }),
        ts('Registration rate', [
          tgt('sum(rate(kamailio_ims_registrar_scscf_accepted_regs{job="scscf"}' + ri + '))', 'accepted'),
          tgt('sum(rate(kamailio_ims_registrar_scscf_rejected_regs{job="scscf"}' + ri + '))', 'rejected'),
        ], { h: 7, w: 24, x: 0, y: 7 }, 'reqps'),

        // ===== SIP UDP transport =====
        row('SIP transport - UDP receive-buffer drops (the gate once Cx is fast)', 14),
        kpi('P-CSCF UDP RcvbufErrors (range)', 'sum(increase(node_netstat_Udp_RcvbufErrors{cscf="pcscf"}' + rng + '))', { h: 6, w: 8, x: 0, y: 15 }, drop_thr, 'short', 0),
        ts('UDP RcvbufErrors /s (by CSCF)', [tgt('rate(node_netstat_Udp_RcvbufErrors' + ri + ')', '{{cscf}}')], { h: 7, w: 8, x: 8, y: 15 }, 'cps'),
        ts('UDP InDatagrams vs dropped /s (P-CSCF)', [
          tgt('rate(node_netstat_Udp_InDatagrams{cscf="pcscf"}' + ri + ')', 'in datagrams'),
          tgt('rate(node_netstat_Udp_InErrors{cscf="pcscf"}' + ri + ')', 'in errors (dropped)'),
        ], { h: 7, w: 8, x: 16, y: 15 }, 'cps'),

        // ===== Cx round-trip =====
        row('Cx round-trip (HSS / DRA) - is the HSS slow?', 22),
        kpi('MAR windowed RT (auth)', cxrt('kamailio_ims_auth_mar', 'scscf'), { h: 6, w: 8, x: 0, y: 23 }, time_thr, 'ms', 0),
        ts('Cx round-trip time (windowed)', [
          tgt(cxrt('kamailio_ims_icscf_uar', 'icscf'), 'UAR (I-CSCF)'),
          tgt(cxrt('kamailio_ims_auth_mar', 'scscf'), 'MAR (S-CSCF auth)'),
          tgt(cxrt('kamailio_ims_registrar_scscf_sar', 'scscf'), 'SAR (S-CSCF reg)'),
        ], { h: 7, w: 8, x: 8, y: 23 }, 'ms'),
        ts('Cx timeouts /s', [
          tgt('rate(kamailio_ims_auth_mar_timeouts{job="scscf"}' + ri + ')', 'MAR'),
          tgt('rate(kamailio_ims_registrar_scscf_sar_timeouts{job="scscf"}' + ri + ')', 'SAR'),
          tgt('rate(kamailio_ims_icscf_uar_timeouts{job="icscf"}' + ri + ')', 'UAR'),
        ], { h: 7, w: 8, x: 16, y: 23 }, 'cps'),

        // ===== HSS database (mongo) =====
        row('HSS database (mongo) - is it the DB?', 30),
        kpi('COLLSCANs (range)', 'sum(increase(mongodb_ss_metrics_queryExecutor_collectionScans_total' + rng + '))', { h: 6, w: 8, x: 0, y: 31 }, drop_thr, 'short', 0),
        ts('Collection scans /s', [tgt('rate(mongodb_ss_metrics_queryExecutor_collectionScans_total' + ri + ')', 'collection scans')], { h: 7, w: 8, x: 8, y: 31 }, 'cps'),
        ts('Docs scanned /s vs index keys /s', [
          tgt('rate(mongodb_ss_metrics_queryExecutor_scannedObjects' + ri + ')', 'documents scanned'),
          tgt('rate(mongodb_ss_metrics_queryExecutor_scanned' + ri + ')', 'index keys scanned'),
        ], { h: 7, w: 8, x: 16, y: 31 }, 'ops'),
        ts('Mongo ops /s by type', [tgt('rate(mongodb_ss_opcounters' + ri + ')', '{{legacy_op_type}}')], { h: 7, w: 24, x: 0, y: 38 }, 'ops'),

        // ===== Resources =====
        row('Resources', 45),
        ts('CPU % per container', [tgt('rate(container_cpu_user_seconds_total{name!=\'\'}' + ri + ')*100', '{{name}}')], { h: 8, w: 24, x: 0, y: 46 }, 'percent'),
      ])

  open5gs.jsonnet:
    content: |
      local g = import 'github.com/grafana/grafonnet/gen/grafonnet-latest/main.libsonnet';
      local ds = 'prometheus';

      local ts(title, exprs, p, unit='short') =
        g.panel.timeSeries.new(title)
        + g.panel.timeSeries.queryOptions.withDatasource('prometheus', ds)
        + g.panel.timeSeries.queryOptions.withTargets([g.query.prometheus.new(ds, e) for e in exprs])
        + g.panel.timeSeries.panelOptions.withGridPos(h=p.h, w=p.w, x=p.x, y=p.y)
        + g.panel.timeSeries.standardOptions.withUnit(unit);

      g.dashboard.new('Open5GS')
      + g.dashboard.withUid('open5gs')
      + g.dashboard.withDescription('Open5GS EPC core: UPF user-plane (N3 GTP-U, sessions) and MME (eNBs, sessions).')
      + g.dashboard.time.withFrom('now-6h')
      + g.dashboard.withRefresh('5s')
      + g.dashboard.graphTooltip.withSharedCrosshair()
      + g.dashboard.withPanels([
        ts('UPF - GTP Packets', ['fivegs_ep_n3_gtp_indatapktn3upf', 'fivegs_ep_n3_gtp_outdatapktn3upf'], { h: 8, w: 12, x: 0, y: 0 }),
        ts('UPF - Active Sessions', ['fivegs_upffunction_upf_sessionnbr'], { h: 8, w: 12, x: 12, y: 0 }),
      ])

  arch.jsonnet:
    content: |
      // IMS / EPC architecture canvas.
      local g = import 'github.com/grafana/grafonnet/gen/grafonnet-latest/main.libsonnet';
      local ds = { type: 'prometheus', uid: 'prometheus' };

      // ---- geometry: col/row grid mirroring the mermaid layout ----
      local OX = 50; local OY = 100; local CW = 250; local RH = 150;
      local W = 150; local H = 80;
      local px(c) = OX + c * CW;
      local py(r) = OY + r * RH;

      // ---- domain palette ----
      local core  = 'semi-dark-blue';    // open5gs EPC (SMF/UPF/HSS/PCRF)
      local cscf  = 'semi-dark-green';   // Kamailio IMS core (P/I/S-CSCF)
      local media = 'semi-dark-orange';  // rtpengine
      local ocsc  = 'dark-red';          // online charging
      local testc = '#41464d';           // load generator

      // ri holds Grafana's rate-interval macro, written with a doubled dollar so
      // Compose interpolation leaves exactly one dollar for the compiled jsonnet.
      local ri = '[$$__rate_interval]';

      // ---- nodes: id, title, caption (metric meaning), grid pos, colour, expr ----
      local nodes = [
        { id: 'smf',   t: 'SMF',       c: 'SM sessions',   col: 0, row: 0, bg: core,  e: 'sum(fivegs_smffunction_sm_sessionnbr{job="smf"})' },
        { id: 'pcrf',  t: 'PCRF',      c: 'Gx CCR /s',     col: 1, row: 0, bg: core,  e: 'sum(rate(gx_rx_ccr{job="pcrf"}' + ri + '))' },
        { id: 'icscf', t: 'I-CSCF',    c: 'UAR /s',        col: 2, row: 0, bg: cscf,  e: 'sum(rate(kamailio_ims_icscf_uar_replies_received{job="icscf"}' + ri + '))' },
        { id: 'hss',   t: 'HSS',       c: 'IMPUs',         col: 3, row: 0, bg: core,  e: 'sum(hss_impu{job="hss"})' },
        { id: 'upf',   t: 'UPF',       c: 'PFCP sessions', col: 0, row: 1, bg: core,  e: 'sum(fivegs_upffunction_upf_sessionnbr{job="upf"})' },
        { id: 'pcscf', t: 'P-CSCF',    c: 'contacts',      col: 1, row: 1, bg: cscf,  e: 'sum(kamailio_ims_usrloc_pcscf_registered_contacts{job="pcscf"})' },
        { id: 'scscf', t: 'S-CSCF',    c: 'reg IMPUs',     col: 3, row: 1, bg: cscf,  e: 'sum(kamailio_ims_usrloc_scscf_active_impus{job="scscf"})' },
        { id: 'ocs',   t: 'OCS',       c: 'Ro sessions',   col: 4, row: 1, bg: ocsc,  e: 'sum(kamailio_ims_charging_active_ro_sessions{job="scscf"})' },
        { id: 'rtp',   t: 'rtpengine', c: 'own sessions',  col: 1, row: 2, bg: media, e: 'sum(rtpengine_sessions{type="own",job="rtpengine"})' },
      ];

      // ---- node-center lookup, for placing latency chips on the arrows ----
      local byId = { [n.id]: n for n in nodes };
      local cx(id) = px(byId[id].col) + W / 2;
      local cy(id) = py(byId[id].row) + H / 2;

      // windowed Cx round-trip (ms) = rate(response_time sum) / rate(replies count)
      local cxrt(base, joblbl) =
        '(sum(rate(' + base + '_replies_response_time{job="' + joblbl + '"}' + ri + ')) / '
        + 'sum(rate(' + base + '_replies_received{job="' + joblbl + '"}' + ri + ')))';

      // ---- latency edges: only the Diameter legs expose a measured avg RT ----
      // Cx to the HSS (UAR from I-CSCF, MAR/SAR from S-CSCF) and Ro CCR to the
      // OCS. Each chip is placed at the arrow midpoint; dx/dy nudge it off the
      // line into whitespace. The S-CSCF->HSS arrow carries two (MAR + SAR),
      // stacked above/below its midpoint.
      local lat = [
        { id: 'uar', a: 'icscf', b: 'hss', t: 'UAR', dx: 16, dy: 0,   e: cxrt('kamailio_ims_icscf_uar', 'icscf') },
        { id: 'mar', a: 'scscf', b: 'hss', t: 'MAR', dx: 60, dy: -13, e: 'avg(kamailio_ims_auth_mar_avg_response_time{job="scscf"})' },
        { id: 'sar', a: 'scscf', b: 'hss', t: 'SAR', dx: 60, dy: 13,  e: 'avg(kamailio_ims_registrar_scscf_sar_avg_response_time{job="scscf"})' },
        { id: 'ccr', a: 'scscf', b: 'ocs', t: 'CCR', dx: 16, dy: 0,   e: 'avg(kamailio_ims_charging_ccr_avg_response_time{job="scscf"})' },
      ];

      // ---- connection anchors (element-local, -1..1; y up) ----
      local T = { x: 0, y: 1 }; local B = { x: 0, y: -1 };
      local L = { x: -1, y: 0 }; local R = { x: 1, y: 0 };
      local link(from, to, dst) = {
        color: { fixed: '#9aa0a6' }, size: { fixed: 2 }, path: 'straight',
        source: from, target: dst, targetName: to,
      };
      // edges keyed by source element, one entry per mermaid connection
      local conns = {
        smf:   [link(B, 'upf', T), link(R, 'pcrf', L)],
        pcrf:  [link(B, 'pcscf', T)],
        upf:   [link(R, 'pcscf', L), link(B, 'rtp', L)],
        pcscf: [link(R, 'icscf', B), link(R, 'scscf', L)],
        icscf: [link(R, 'hss', L), link(B, 'scscf', L)],
        scscf: [link(T, 'hss', B), link(R, 'ocs', L), link(L, 'Mw', R), link(B, 'rtp', R)],
      };

      // ---- element builders ----
      local card(n) = {
        type: 'metric-value', name: n.id,
        config: { align: 'center', valign: 'bottom', size: 26,
                  color: { fixed: '#ffffff' },
                  text: { mode: 'field', field: n.id, fixed: '' } },
        background: { color: { fixed: n.bg } },
        border: { color: { fixed: '#ffffff' }, width: 1 },
        placement: { top: py(n.row), left: px(n.col), width: W, height: H },
        constraint: { horizontal: 'left', vertical: 'top' },
        connections: if std.objectHas(conns, n.id) then conns[n.id] else [],
      };
      local label(n) = {
        type: 'text', name: n.id + '-t',
        config: { align: 'center', valign: 'middle', size: 14,
                  color: { fixed: '#ffffff' },
                  text: { mode: 'fixed', fixed: n.t } },
        background: { color: { fixed: 'transparent' } },
        placement: { top: py(n.row) + 6, left: px(n.col), width: W, height: 20 },
        constraint: { horizontal: 'left', vertical: 'top' },
      };
      local caption(n) = {
        type: 'text', name: n.id + '-c',
        config: { align: 'center', valign: 'middle', size: 10,
                  color: { fixed: '#dadce0' },
                  text: { mode: 'fixed', fixed: n.c } },
        background: { color: { fixed: 'transparent' } },
        placement: { top: py(n.row) + 24, left: px(n.col), width: W, height: 14 },
        constraint: { horizontal: 'left', vertical: 'top' },
      };
      // ---- latency chip: interface name + live average RT (ms) on its arrow ----
      local CHW = 52; local CHH = 20; local NMW = 32;
      local latmid(ed) = { x: (cx(ed.a) + cx(ed.b)) / 2 + ed.dx,
                           y: (cy(ed.a) + cy(ed.b)) / 2 + ed.dy };
      local latName(ed) = {
        type: 'text', name: ed.id + '-ln',
        config: { align: 'right', valign: 'middle', size: 11,
                  color: { fixed: '#dadce0' },
                  text: { mode: 'fixed', fixed: ed.t } },
        background: { color: { fixed: 'transparent' } },
        placement: { top: latmid(ed).y - CHH / 2, left: latmid(ed).x - CHW / 2 - NMW,
                     width: NMW, height: CHH },
        constraint: { horizontal: 'left', vertical: 'top' },
      };
      local latChip(ed) = {
        type: 'metric-value', name: ed.id + '-lv',
        config: { align: 'left', valign: 'middle', size: 12,
                  color: { fixed: '#ffd54f' },
                  text: { mode: 'field', field: ed.id, fixed: '' } },
        background: { color: { fixed: 'rgba(0,0,0,0.55)' } },
        border: { color: { fixed: '#5f6368' }, width: 1 },
        placement: { top: latmid(ed).y - CHH / 2, left: latmid(ed).x - CHW / 2,
                     width: CHW, height: CHH },
        constraint: { horizontal: 'left', vertical: 'top' },
      };
      local panel = {
        type: 'canvas', id: 1, title: 'IMS / EPC Architecture',
        datasource: ds,
        gridPos: { h: 18, w: 24, x: 0, y: 0 },
        fieldConfig: {
          defaults: { decimals: 0, color: { mode: 'fixed' } },
          overrides: [
            {
              matcher: { id: 'byFrameRefID', options: std.char(65 + std.length(nodes) + j) },
              properties: [{ id: 'unit', value: 'ms' }],
            }
            for j in std.range(0, std.length(lat) - 1)
          ],
        },
        options: {
          inlineEditing: true, showAdvancedTypes: true, panZoom: true, infinitePan: false,
          root: {
            type: 'frame', name: 'Element 1',
            background: { color: { fixed: 'transparent' } },
            border: { color: { fixed: 'dark-green' } },
            constraint: { horizontal: 'left', vertical: 'top' },
            placement: { top: 0, left: 0, width: 100, height: 100 },
            elements:
              [card(n) for n in nodes]
              + [label(n) for n in nodes] + [caption(n) for n in nodes]
              + [latName(ed) for ed in lat] + [latChip(ed) for ed in lat],
          },
        },
        targets:
          [
            {
              datasource: ds, refId: std.char(65 + i),
              expr: nodes[i].e, legendFormat: nodes[i].id,
              instant: true, range: false,
            }
            for i in std.range(0, std.length(nodes) - 1)
          ]
          + [
            {
              datasource: ds, refId: std.char(65 + std.length(nodes) + j),
              expr: lat[j].e, legendFormat: lat[j].id,
              instant: true, range: false,
            }
            for j in std.range(0, std.length(lat) - 1)
          ],
      };

      g.dashboard.new('Architecture')
      + g.dashboard.withUid('arch')
      + g.dashboard.withDescription('Architecture')
      + g.dashboard.time.withFrom('now-6h')
      + g.dashboard.withRefresh('5s')
      + g.dashboard.graphTooltip.withSharedCrosshair()
      + g.dashboard.withPanels([panel])

  log.jsonnet:
    content: |
      local g = import 'github.com/grafana/grafonnet/gen/grafonnet-latest/main.libsonnet';
      local ds = 'loki';
      local var = g.dashboard.variable;

      g.dashboard.new('logs')
      + g.dashboard.withUid('logs')
      + g.dashboard.withDescription('logs overview')
      + g.dashboard.time.withFrom('now-6h')
      + g.dashboard.withRefresh('5s')
      + g.dashboard.withVariables([
        var.query.new('container', 'label_values(container)')
        + var.query.withDatasource('loki', ds)
        + var.query.generalOptions.withLabel('Container')
        + var.query.refresh.onLoad()
        + var.query.withSort(5)
        + var.query.selectionOptions.withMulti()
        + var.query.selectionOptions.withIncludeAll(customAllValue='.+'),
        var.textbox.new('search')
        + var.textbox.generalOptions.withLabel('Search'),
      ])
      + g.dashboard.withPanels([
        g.panel.logs.new('')
        + g.panel.logs.panelOptions.withGridPos(h=22, w=24, x=0, y=0)
        + g.panel.logs.panelOptions.withTransparent()
        + g.panel.logs.queryOptions.withDatasource('loki', ds)
        + g.panel.logs.queryOptions.withTargets([
          g.query.loki.new(ds, '{container=~"$$container"} |~ "(?i)$$search"')
        ]),
      ])

  rtp.jsonnet:
    content: |
      local g = import 'github.com/grafana/grafonnet/gen/grafonnet-latest/main.libsonnet';
      local ds = 'prometheus';
      
      local stat(title, expr, x, y, w, h, unit=null) =
        g.panel.stat.new(title)
        + g.panel.stat.queryOptions.withDatasource('prometheus', ds)
        + g.panel.stat.queryOptions.withTargets([g.query.prometheus.new(ds, expr)])
        + g.panel.stat.options.withGraphMode('area')
        + g.panel.stat.panelOptions.withGridPos(h=h, w=w, x=x, y=y)
        + if unit == null then {} else g.panel.stat.standardOptions.withUnit(unit);

      local gauge(title, expr, x, y) =
        g.panel.gauge.new(title)
        + g.panel.gauge.queryOptions.withDatasource('prometheus', ds)
        + g.panel.gauge.queryOptions.withTargets([g.query.prometheus.new(ds, expr)])
        + g.panel.gauge.panelOptions.withGridPos(h=5, w=3, x=x, y=y);

      local tsTarget(reason, legend) =
        g.query.prometheus.new(ds, 'rtpengine_closed_sessions_total{reason="%s", job="$$job"}' % reason)
        + g.query.prometheus.withLegendFormat(legend);

      g.dashboard.new('RTP')
      + g.dashboard.withUid('rtp')
      + g.dashboard.withDescription('A general view of RTPEngine.')
      + g.dashboard.time.withFrom('now-6h')
      + g.dashboard.withRefresh('5s')
      + g.dashboard.withPanels([
        gauge('Foreign Sessions',     'rtpengine_sessions{type="foreign", job="$$job"}', 0, 0),
        gauge('Own Sessions',         'rtpengine_sessions{type="own", job="$$job"}',     3, 0),
        gauge('Transcoding Sessions', 'rtpengine_transcoded_media{job="$$job"}',         6, 0),

        g.panel.timeSeries.new('Total Closed Sessions')
        + g.panel.timeSeries.queryOptions.withDatasource('prometheus', ds)
        + g.panel.timeSeries.queryOptions.withTargets([
          tsTarget('rejected',         'Rejected'),
          tsTarget('timeout',          'Timeout'),
          tsTarget('silent_timeout',   'Silent Timeout'),
          tsTarget('final_timeout',    'Final Timeout'),
          tsTarget('offer_timeout',    'Offer Timeout'),
          tsTarget('terminated',       'Terminated'),
          tsTarget('force_terminated', 'Force Timeout'),
        ])
        + g.panel.timeSeries.panelOptions.withGridPos(h=8, w=24, x=0, y=5),

        stat('Uptime',                'rtpengine_uptime_seconds{job="$$job"}',            10, 0,  7, 5, 's'),
        stat('Total sessions',        'rtpengine_sessions_total{job="$$job"}',            17, 0,  7, 5),
        stat('Total Relayed Packets', 'rtpengine_packets_total{type="userspace"}',        0,  13, 6, 5),
        stat('Total Relayed Bytes',   'rtpengine_bytes_total{type="userspace"}',          6,  13, 4, 5, 'decbytes'),
        stat('Total Relayed Errors',  'rtpengine_packet_errors_total{type="userspace"}',  10, 13, 6, 5),
        stat('Zero packet streams',   'rtpengine_zero_packet_streams_total{job="$$job"}', 16, 13, 4, 5),
        stat('Total 1-way streams',   'rtpengine_one_way_sessions_total{job="$$job"}',    20, 13, 4, 5),
      ])

  prometheus.yml:
    content: |
      global:
        scrape_interval: 10s
      scrape_configs:
      - job_name: cadvisor
        static_configs:
        - targets:
          - cadvisor:8080
      - job_name: pcscf
        honor_timestamps: false
        static_configs:
        - targets:
          - pcscf:9090
      - job_name: icscf
        honor_timestamps: false
        static_configs:
        - targets:
          - icscf:9090
      - job_name: scscf
        honor_timestamps: false
        static_configs:
        - targets:
          - scscf:9090
      - job_name: rtpengine
        honor_timestamps: false
        static_configs:
        - targets:
          - rtpengine:9090
      # open5gs EPC/IMS core. NB: the HSS Cx counters (cx_rx_uar/mar/sar) update
      # with a lag/batch — trustworthy cumulatively, not for real-time windows.
      - job_name: hss
        honor_timestamps: false
        static_configs:
        - targets:
          - hss:9090
      - job_name: pcrf
        honor_timestamps: false
        static_configs:
        - targets:
          - pcrf:9090
      - job_name: smf
        honor_timestamps: false
        static_configs:
        - targets:
          - smf:9091
      - job_name: upf
        honor_timestamps: false
        static_configs:
        - targets:
          - upf:9091
      # HSS database load (mongo).
      - job_name: mongo
        honor_timestamps: false
        static_configs:
        - targets:
          - mongodb-exporter:9216
