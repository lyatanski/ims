# The ENUM tree route[E164] queries. RFC 6116 roots the public one at
# e164.arpa; this is an operator's own tree, which is what TS 24.229 assumes
# and what keeps the lookup inside the network. The suffix has to be absolute
# -- the module concatenates it onto the reversed digits and queries the result
# verbatim -- so the trailing dot is load-bearing.
modparam("enum", "domain_suffix", ENUM)
#!endif

