request_route {
	if("REGISTER" == $rm) {
		route(REGISTER);
		exit;
	}

	if("SUBSCRIBE" == $rm) {
		route(SUBSCRIBE);
		exit;
	}

	#reg_fetch_contacts("location", "$fu", "caller");

	loose_route();
	# should be before CCR to avoid callback overwrite
	setflag(FLT_DIALOG);
	xinfo("====== $rm <$route_uri>\n");
	if(($route_uri =~ "sip:orig@.*") || ($route_uri =~ "sip:mo@.*") || isc_from_as("orig")) {
		xinfo("====== ORIG\n");
		# Before the transaction, not after: t_newtran() clones the request
		# into it, and a transaction that is suspended -- by Ro_CCR() below,
		# by the SAR in route[ORIG_RESTORE] -- resumes from that clone, so a
		# Request-URI the ENUM lookup rewrites afterwards is gone by the time
		# anything relays it (478, a tel URI with no host).
		route(E164);
		if(!t_newtran()) {
			send_reply_error();
			exit;
		}
		route(ORIG_RESTORE);
		route(ORIG);
		exit;
	}

	xinfo("====== TERM\n");
	if(!lookup("location") && !has_totag()) {
		route(TERM_RESTORE);
	}
	if(!t_newtran()) {
		send_reply_error();
		exit;
	}
	route(MTERM);

	#reg_free_contacts("caller");

	isc_match_filter("orig", "location");

	route(RELAY);
}

# An originating request, from the transaction on. A route of its own because it
# runs from two places: request_route, and route[ORIG_RESTORE_SAA] once the
# served user's profile is back from the HSS -- which is a transaction resumed by
# t_continue(), in which t_newtran() would fail, so the transaction is the
# caller's to create, and route[E164] has run before it.
route[ORIG] {
	route(MORIG);
	isc_match_filter("orig", "location");
	route(RELAY);
}

# S-CSCF restoration, originating side: 3GPP TS 23.380 4.4.2, TS 24.229
# 5.4.3.2. usrloc lives only in this process's memory, so a replaced pod comes
# back knowing nobody while every UE, and the P-CSCF in front of it, still
# believes it is registered -- its Service-Route names this S-CSCF, and the
# ordinal comes back under the same name. The first request such a UE sends
# here is the moment to put that right.
#
# The served user's profile is fetched back with a SAR of type NO_ASSIGNMENT
# (assign_server(), patches/0011): it changes nothing at the HSS, which answers
# it only for the S-CSCF already assigned to the user. With the profile the
# request carries on as for a registered user. Only the binding stays lost, so
# terminating requests for the user still get a 480 until its next REGISTER.
#
# If the profile cannot be had -- DIAMETER_UNABLE_TO_COMPLY because another
# S-CSCF holds the user, an HSS that does not know it, no User-Data -- the
# answer is the 504 24.229 gives for exactly that, below.
route[ORIG_RESTORE] {
	# Only a request that starts something. In-dialog requests follow their
	# own route set and need no binding here; a CANCEL rides the transaction
	# of the INVITE it cancels, which already has its answer. A request
	# coming back from an AS was checked on its first pass.
	if(has_totag() || is_method("ACK|CANCEL") || isc_from_as("orig")) {
		return;
	}
	# 24.229 exempts emergency sessions: sending the UE off to register
	# first is the one thing an emergency call cannot afford.
	if($ru =~ "^urn:service:sos") {
		return;
	}
	# The served user is the identity the P-CSCF asserted, not the To.
	if($ai == $null) {
		return;
	}

	# Both checks key on the Request-URI, hence the swap.
	# term_impu_has_contact() is true only for a record with a VALID_CONTACT,
	# which a registered UE always has; -1 is "no record, or no live binding",
	# and anything else (-3, an identity it could not parse) is not evidence of
	# lost data -- blocking the request on it would be worse than letting it
	# through. term_impu_registered(), whatever its name says, is true for any
	# record at all: one restored by an earlier request holds the profile and
	# no binding, and needs no second trip to the HSS.
	$var(ru) = $ru;
	$ru = $ai;
	term_impu_has_contact("location");
	$var(rc) = $rc;
	if($var(rc) == -1 && term_impu_registered("location")) {
		$var(rc) = 1;
	}
	$ru = $var(ru);
	if($var(rc) != -1) {
		return;
	}

	xnotice("no data for <$ai>: SAR NO_ASSIGNMENT to restore its profile\n");
	# $var is per process, and the SAA resumes in whichever one cdp hands it
	# to: route[E164]'s choice of media template goes with the transaction.
	$avp(orig_media) = $var(media);
	# 0 is NO_ASSIGNMENT. Asynchronous: it resumes in route[ORIG_RESTORE_SAA],
	# and if it cannot be sent it has replied already.
	assign_server("ORIG_RESTORE_SAA", "location", "orig", 0);
	exit;
}

# Diameter Cx: Server-Assignment-Answer for NO_ASSIGNMENT
route[ORIG_RESTORE_SAA] {
	xinfo("SAR (no assignment) return code: $avp(s:saa_return_code)\n");
	# 1 is CSCF_RETURN_TRUE: the profile is stored and the request carries on.
	if($avp(s:saa_return_code) != 1) {
		route(RESTORE_BY_REGISTRATION);
	}
	$var(media) = $avp(orig_media);
	route(ORIG);
}

# The fallback when the profile cannot be fetched (TS 24.229 4.14.3): a 504
# carrying the 3GPP IM CN subsystem XML body. A UE that sees it, with a
# P-Asserted-Identity matching its Service-Route, performs an initial
# registration (5.1.2A.1.6) -- and that REGISTER, landing here, rebuilds usrloc,
# the reg-event subscriptions and the P-CSCF's view in one go.
route[RESTORE_BY_REGISTRATION] {
	xnotice("no profile for <$ai>: 504 to trigger an initial registration\n");
	# 24.229 5.4.3.2 items I)-III). Version 1 of the body without looking
	# at Accept -- the spec says to assume it. The P-Asserted-Identity is the
	# Service-Route this registrar hands out (reply.c: "sip:orig@" +
	# scscf_name + ";lr"), which is what the UE compares it against.
	append_to_reply("P-Asserted-Identity: <" + SRVROUTE + ";lr>\r\n");
	set_reply_body("<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<ims-3gpp version=\"1\"><alternative-service><type>restoration</type><reason>S-CSCF restoration</reason><action>initial-registration</action></alternative-service></ims-3gpp>\n", "application/3gpp-ims+xml");
	t_reply("504", "Server Time-out");
	exit;
}

# S-CSCF restoration, terminating side: 3GPP TS 23.380 4.3.2, TS 24.229
# 5.4.3.3. An initial request for a user with no live binding here -- never
# registered, de-registered, or registered with a pod that has since been
# replaced.
#
# Where the S-CSCF has no data for the user at all, it downloads the
# unregistered profile with a SAR of type UNREGISTERED_USER, then triggers the
# user's unregistered services. Nothing brings back a binding, so a UE this pod
# has forgotten is unreachable until it next registers, and short of an AS the
# answer is 480.
#
# Before this route an initial request that found no binding was relayed to
# its own Request-URI -- the IMS domain, i.e. back to the I-CSCF, which sent
# it here again until Max-Forwards ran out.
route[TERM_RESTORE] {
	# Rides the INVITE's transaction, which has its answer already.
	if(is_method("CANCEL")) {
		return;
	}
	if(!t_newtran()) {
		send_reply_error();
		exit;
	}
	# A record without a live binding still holds the profile -- the S-CSCF
	# keeps it past de-registration for as long as a reg-event subscription
	# lives -- so its unregistered services need no trip to the HSS.
	if(term_impu_registered("location")) {
		route(TERM_UNREG_SERVICES);
		exit;
	}
	xnotice("no data for <$ru>: SAR for the unregistered user\n");
	# Asynchronous, and it stops the script either way: on success the SAA
	# resumes in route[TERM_RESTORE_SAA]; on failure to send it has already
	# replied.
	assign_server_unreg("TERM_RESTORE_SAA", "location", "term");
	exit;
}

# Diameter Cx: Server-Assignment-Answer for UNREGISTERED_USER
route[TERM_RESTORE_SAA] {
	xinfo("SAR (unregistered user) return code: $avp(s:saa_return_code)\n");
	# 1 is CSCF_RETURN_TRUE: the SAA carried a profile and usrloc now holds
	# the user as unregistered. Anything else -- no User-Data, a user the HSS
	# does not know -- leaves nothing to trigger on.
	if($avp(s:saa_return_code) != 1) {
		t_reply("480", "Temporarily Unavailable");
		exit;
	}
	route(TERM_UNREG_SERVICES);
}

# 24.229 5.4.3.3 for an unregistered served user: evaluate the unregistered
# iFCs (isc_match_filter() picks the session case from the record's state), and
# if no AS takes the request there is nobody to deliver it to.
route[TERM_UNREG_SERVICES] {
	if(isc_match_filter("term", "location")) {
		route(MTERM);
		route(RELAY);
		exit;
	}
	t_reply("480", "Temporarily Unavailable");
	exit;
}

route[REGISTER] {
	if(impu_registered("location") && $expires(max) == "0") {
		save("SAA", "location");
		exit;
	}
	if(!ims_www_authenticate("$td")) {
		switch ($?) {
		case -1:
			# user has not been authenticated. Send 401 Unauthorized challenge
			route(CHALLENGE);
			break;
		case -9:
			ims_www_resync_auth("CHALLENGE", "$td");
			break;
		default:
			send_reply("400", "Authentication failed ($?)");
			break;
		}
		exit;
	}
	route(REBIND);
	save("SAA", "location");
}

# One binding per subscriber: retire what an earlier registration left behind.
#
# Injecting the superseded binding back into the REGISTER as a near-expired
# contact produces NOTIFY termination
route[REBIND] {
	# $var is per process, not per message: every one this route reads is set
	# here first, or it carries the last REGISTER's value into this one.
	$var(retired) = 0;
	$var(new) = $(hdr(Contact){nameaddr.uri});
	if($var(new) == $null) {
		return;
	}

	# Only a registered IMPU has a binding to retire. A first registration has
	# no record at all; an IMPU that was de-registered can still have one --
	# the S-CSCF keeps the impurecord for as long as a reg-event subscription
	# on it lives -- holding no contacts. That second case is also why the
	# lookup below must not run unguarded: when no binding is valid, lookup()
	# does not fail, it returns the last dead one it walked past. This guard
	# only narrows that: an IMPU stays REGISTERED from the moment its last
	# binding dies until the usrloc timer next processes it, and a REGISTER in
	# that window is handed a dead binding, re-injects it with expires=1 and so
	# revives it for that second. Only fixing lookup() closes it.
	if(!impu_registered("location")) {
		return;
	}

	# Every live binding of this IMPU, from usrloc. lookup() walks the IMPU's
	# own linked_contacts and keeps only VALID_CONTACT ones -- not expired, not
	# pending delete or notify -- which is exactly the set a terminating request
	# would be forked to. Not reg_fetch_contacts(): it follows the contact hash
	# slot's chain from the IMPU's FIRST binding, so all it can safely offer is
	# index 0, and index 0 is the OLDEST binding -- after a de-registration or
	# an earlier retirement, a dead contact that has not been reaped yet, which
	# hides the live one behind it until the timer gets there.
	#
	# lookup() keys on the Request-URI and leaves its answer there, in $du and in
	# the branches; all three are put back before the message is rebuilt.
	$ru = $tu;
	if(!lookup("location")) {
		revert_uri();
		return;
	}

	# $ru is the first live binding, the branches the rest. Every one that is
	# not the contact this REGISTER brings is superseded by it: a UE that moved
	# address has nothing else to say about the old one, and a backlog from
	# before this route existed drains in one registration.
	#
	# Not expires=0: after update_contacts_helper() stores the contacts,
	# update_contacts_sar_re_registration() walks the message's Contacts again
	# and bails out with "Error processing REGISTER" on the first one that is no
	# longer a valid contact — which an expires=0 contact no longer is. That
	# aborts the rest of the SAA handling, so the REGISTER that carried it never
	# gets its own binding linked. A few seconds is past long before the reap
	# and survives that second walk.
	$var(nb) = $branch(count);
	$var(i) = -1;
	while($var(i) < $var(nb)) {
		if($var(i) < 0) {
			$var(old) = $ru;
		} else {
			$var(old) = $(branch(uri)[$var(i)]);
		}
		if($var(old) != $var(new)) {
			xwarn("retiring superseded binding <$var(old)>, replaced by <$var(new)>\n");
			append_hf("Contact: <$var(old)>;expires=1\r\n");
			$var(retired) = $var(retired) + 1;
		}
		$var(i) = $var(i) + 1;
	}

	revert_uri();
	$du = $null;
	clear_branches();
	if($var(retired) > 0) {
		msg_apply_changes();
	}
}

route[CHALLENGE] {
	# selval() forces its first argument to integer, so it has to be a real
	# condition — feeding it $aa directly makes the conversion (and with it the
	# whole assignment) fail, leaving $var(alg) at whatever the worker used last.
	$var(alg) = selval($aa != "", $aa, "AKAv1-MD5");
	ims_www_challenge("MAA", "$td", "$var(alg)");
}

# Diameter Cx: Multimedia-Auth-Answer (MAA)
route[MAA] {
	xinfo("MAR return code: $avp(s:maa_return_code)\n");
	if(!$avp(s:maa_return_code)) {
		send_reply("500", "MAR failed");
	}
}

# Diameter Cx: Server-Assignment-Answer (SAA)
route[SAA] {
	xinfo("SAR return code: $avp(s:saa_return_code)\n");
	if($avp(s:saa_return_code)) {
		xdbg("SAR Success\n");
		#isc_match_filter_reg("0", "location");
	}
}

route[SUBSCRIBE] {
	# the reason for transaction creation is threefold
	# 1. synchronizes (gives time) for parsing header P-Asserted-Identity XXX
	# 2. subscription reply 200 OK is using t_reply
	# 3. absorbs retransmissions?
	if(!(t_newtran() && (has_totag() || can_subscribe_to_reg("location")))) {
		send_reply_error();
		exit;
	}

	subscribe_to_reg("location");
}

# 3GPP TS 24.229 5.4.3.2 / TS 23.228 5.5.2 -- analysis of the destination
# address on an originating initial request.
#
# A tel URI (RFC 3966) carries a number and no host, and the core parser moves
# that number into the user part and leaves the host empty, so t_relay() has
# nothing to resolve: the number has to become a SIP URI first. ENUM (RFC 6116)
# is that translation. The digits are reversed into a name under the tree in
# ENUM above, and the NAPTR found there carries the regexp that rewrites the
# number -- so the mapping lives in the DNS record, not here. The same applies
# to a sip:+<number>@<domain>;user=phone Request-URI (TS 23.003 13.4), which
# parses with the same E.164 user part and is translated identically.
#
# What comes out has to be an identity the HSS knows: the I-CSCF this is
# relayed to puts the rewritten Request-URI straight into the Cx LIR. See the
# `dns` config in compose.yml for the record that does it, and why it drops the
# leading "+".
#
# The tree answers only for the number ranges this network serves, so a miss
# means "not an IMS number here" and is the trigger for breakout below -- which
# is why the range lives in the zone and not in this file. Note that it is a
# statement about *ranges*, not about the HSS: a number inside a served range
# that nobody provisioned still translates, reaches the I-CSCF, and comes back
# as the HSS's own answer to the LIR.
route[E164] {
	$var(media) = "template=internal";

	if(has_totag()) {
		# in-dialog: the R-URI is the remote target
		#
		# No template: the pair was pinned by the initial offer, and naming one
		# again on a re-offer asks rtpengine to move the call's own ports
		# mid-call. Empty flags are what rtpengine_manage() would have sent
		# anyway.
		$var(media) = "";
		return;
	}
	if($rU == $null) {
		return;
	}

	# RFC 3966 3 lets the number in a tel URI carry visual separators, which an
	# E.164 number never has. Tel URI parameters need no handling here -- the
	# core parser splits them off, so a ";phone-context=..." never reaches $rU.
	$var(e164) = $(rU{re.subst,/[-.()]//g});

	route(DIALPLAN);

	if($var(e164) != $rU) {
		xinfo("dial plan $rU -> $var(e164)\n");
	}

	if(!($var(e164) =~ "^[+]")) {
		# Neither international nor a form the dial plan recognises. Left
		# exactly as dialled -- see route[DIALPLAN] for why that is the
		# deliberate answer rather than a gap.
		return;
	}

	# The lookup takes the number from the variable rather than the Request-URI,
	# so what is queried is the normalised form while the Request-URI stays
	# whatever the UE dialled. A hit rewrites the Request-URI in place, exactly
	# as the Request-URI form of the call would.
	if(enum_pv_query("$var(e164)")) {
		xinfo("ENUM $var(e164) -> $ru\n");
		return;
	}
	xwarn("ENUM: no NAPTR translates $var(e164)\n");

#!ifdef TRUNK
	# TS 23.228 4.3.4 -- the BGCF role, collapsed into this route because the
	# deployment has no separate one. Only the next hop is overridden: the
	# Request-URI keeps the tel URI, which is what TS 24.229 5.4.3.2 forwards
	# to the BGCF and what a trunk expects to be handed.
	xinfo("BGCF " + TRUNK + " <- $var(e164)\n");
	$du = TRUNK;
	$var(media) = "template=outgoing";
	return;
#!else
	# No trunk configured, so a number outside the served ranges is simply not
	# reachable. Say so, rather than letting t_relay() fail on a URI with no
	# host in it.
	send_reply("404", "Not Found");
	exit;
#!endif
}

# Local dialling forms into international format. TS 24.229 5.4.3.2 has the
# S-CSCF analyse the destination address against the served user's dial plan,
# and everything past it -- the ENUM lookup, the served range the zone answers
# for, the identity the HSS is asked about -- is E.164 and nothing else.
#
# Operates on $var(e164) and never on the Request-URI: the caller hands the
# normalised number to enum_pv_query(), so nothing here has to rebuild a tel
# URI that may have had no host in it to begin with.
route[DIALPLAN] {
	if($var(e164) =~ "^[+]") {
		# already international if starts with +
		return;
	}

	$var(n) = E164IDD;
	$var(n) = $(var(n){s.len});
	if($var(n) > 0 && $(var(e164){s.len}) > $var(n)) {
		if($(var(e164){s.substr,0,$var(n)}) == E164IDD) {
			$var(rest) = $(var(e164){s.substr,$var(n),0});
			# ITU-T E.164 6.2.1: a country code never begins with 0. A zero
			# here means the international prefix only appeared to match --
			# what matched is the national prefix, in front of a national
			# number that itself starts with a zero. Falling through to the
			# national rule is the whole reason this check exists: with
			# prefixes 00 and 0, "0" + "000000002" is indistinguishable from
			# "00" + "0000002" by prefix length alone.
			if($(var(rest){s.substr,0,1}) != "0") {
				$var(e164) = "+" + $var(rest);
				return;
			}
		}
	}

#!ifdef E164CC
	$var(n) = E164NDD;
	$var(n) = $(var(n){s.len});
	if($var(n) > 0 && $(var(e164){s.len}) > $var(n)) {
		if($(var(e164){s.substr,0,$var(n)}) == E164NDD) {
			$var(e164) = "+" + E164CC + $(var(e164){s.substr,$var(n),0});
			return;
		}
	}
#!endif
}

route[MORIG] {
	if("INVITE" == $rm) {
		t_on_reply("INVITE");
		# route[E164] chose the template; the chart's `templates` is what it
		# expands to. A name rtpengine does not know is a warning in its log
		# and a fall back to its first interface -- the chart refuses to render
		# that pairing, which is the only thing standing between a typo here
		# and a call that connects with the audio on the wrong network.
		rtpengine_manage("$var(media)");
		# TS 32.454 session KPIs: mark originating setup attempt (initial INVITE only)
		if(!has_totag()) {
			$var(kpidir) = "orig";
			route(SESSION_KPI_START);
		}
	}

	$avp(RR_USER)="mo";
	$var(direction) = "orig";
	route(BILL);
}

route[MTERM] {
	$avp(RR_USER)="mt";
	$var(direction) = "term";
#!ifdef TRUNK
	# A call that entered from the trunk is anchored here, on its terminating
	# leg, because it has no originating leg of ours to have been anchored on
	# -- and with the interfaces the other way round from route[MORIG]: the
	# offer arrived on the external side and is on its way to a UE.
	#
	# What tells that apart from an on-net call is the originating leg's own
	# Record-Route. route[RELAY] writes it with the "mo" user (rr's
	# add_username over $avp(RR_USER), set in route[MORIG]) and the terminating
	# INVITE still carries it, while a call from the trunk has passed no
	# S-CSCF of ours and carries none.
	#
	# Telling them apart is not a refinement. An on-net call is the *same*
	# Call-ID and the same tags on both legs -- both of which this S-CSCF
	# handles -- so anchoring it a second time would offer the caller
	# rtpengine's own address and loop the media back on itself. That is also
	# why none of this is compiled in without a trunk: no trunk, no call from
	# outside, and nothing to be gained for the risk. It does mean trusting a
	# header the far end could forge, which is a statement about what the
	# trunk boundary is expected to be.
	if("INVITE" == $rm && !has_totag()) {
		$var(rr) = $(hdr(Record-Route)[*]);
		if(!($var(rr) =~ MO_RR)) {
			xinfo("no originating leg in the route set: anchoring media\n");
			rtpengine_manage("template=incoming");
			# Two markers, because two different questions get asked later.
			#
			# The AVP is the transaction's, which is the scope
			# onreply_route[INVITE_T] needs: the two legs of an on-net call are
			# two transactions even though they share a Call-ID, a dialog and
			# both tags, so only the leg that made the offer answers it.
			#
			# The dialog var is the call's, and is what the branch below reads
			# on every later request. It is deliberately *not* set for an
			# on-net call, so nothing here touches media the originating leg
			# owns.
			$avp(media) = 1;
			$dlg_var(media) = 1;
		}
	} else if($dlg_var(media) != $null) {
		# Anything after the initial offer on a call this leg anchored: a
		# re-offer and its answer, the ACK that may carry one, and the BYE --
		# rtpengine_manage() reads the method and issues offer, answer or
		# delete itself. No template: the interfaces were pinned by the offer,
		# and a re-offer naming a pair again would move the call's own ports.
		#
		# Without this the session would still go, but only when rtpengine's
		# own `timeout` reaps it a minute after the media stops, and a
		# re-INVITE in between would put the far ends in touch with each other
		# behind the anchor.
		if("INVITE" == $rm) {
			t_on_reply("INVITE_T");
			$avp(media) = 1;
		}
		rtpengine_manage();
	}
#!endif
	# TS 32.454 session KPIs: mark terminating setup attempt (initial INVITE only)
	if("INVITE" == $rm && !has_totag()) {
		t_on_reply("INVITE_T");
		$var(kpidir) = "term";
		route(SESSION_KPI_START);
	}
	route(BILL);
}

route[BILL] {
#!ifdef MOD_ims_charging
	# fail-safe for billing failure
	# calls should be successfully processed even when billing is temporarily unavailable
	if(cdp_has_app("4")) {
		if("INVITE" == $rm) {
#!ifdef RO_IMPI
			$avp(from_user) = $(ulc(caller=>impi){re.subst,/@.*//});
#!endif
			Ro_CCR("CCA", $var(direction), 30, "0", "0");
		}

		if("BYE" == $rm) {
			Ro_CCR_Stop($var(direction), "400", "End of charging");
		}
	} else {
		xwarn("Ro/Rf disconnected!\n");
	}
#!else
	xwarn("Ro/Rf disabled!\n");
#!endif
}

# Diameter Ro: Credit-Control-Answer (CCA)
route[CCA] {
	xinfo("CCR return code: $avp(s:cca_return_code)\n");
	if($avp(s:cca_return_code)) {
		route(RELAY);
	}
}

onreply_route[INVITE] {
	route(SESSION_KPI);
	if(has_body("application/sdp")) {
		rtpengine_manage();
	}
}

# Terminating INVITE reply route: session KPIs, and the answer for a call this
# leg anchored -- which is a call that came in from the trunk and nothing else.
# For an on-net call the media is the originating leg's, and rewriting the
# answer here as well would undo what onreply_route[INVITE] is about to do.
onreply_route[INVITE_T] {
	route(SESSION_KPI);
#!ifdef TRUNK
	if($avp(media) != $null && has_body("application/sdp")) {
		# No template: the interfaces were pinned by the offer route[MTERM]
		# sent, and the answer only needs rewriting onto them.
		rtpengine_manage();
	}
#!endif
}

# TS 32.454 session KPIs - mark a setup attempt and remember its start time.
# $var(kpidir) ("orig"/"term") is set by the caller. Values are stored in
# dialog vars so onreply processing can read them back for the same session.
route[SESSION_KPI_START] {
	prom_counter_inc("ims_session_setup_attempts_total", "1", "$var(kpidir)");
	$dlg_var(kpidir) = $var(kpidir);
	$dlg_var(kpit0s) = $TV(sn);
	$dlg_var(kpit0u) = $TV(un);
}

# TS 32.454 session KPIs - classify the INVITE final response.
# Called from the originating/terminating INVITE reply routes. Everything is
# guarded so a missing dialog var never disrupts call processing; it only means
# a KPI sample is skipped or labelled dir="na".
route[SESSION_KPI] {
	# Nested guards only (no exit/return) so the caller's media handling still
	# runs; exit/return(0) would abort the whole reply route.
	if("INVITE" == $rm) {
		$var(kpidir) = $dlg_var(kpidir);
		if($var(kpidir) == $null) {
			$var(kpidir) = "na";
		}
		# count success/failure once per session (dedup 2xx retransmits and forks)
		if($dlg_var(kpidone) == $null) {
			if($rs =~ "^2[0-9][0-9]$") {
				$dlg_var(kpidone) = "1";
				prom_counter_inc("ims_session_setup_success_total", "1", "$var(kpidir)");
				# Session Setup Time (ms) = INVITE-to-2xx; skip if start unknown
				if($dlg_var(kpit0s) != $null) {
					$var(kt0s) = $dlg_var(kpit0s);
					$var(kt0u) = $dlg_var(kpit0u);
					$var(kns) = $TV(sn);
					$var(knu) = $TV(un);
					$var(kdt) = ($var(kns) - $var(kt0s)) * 1000 + ($var(knu) - $var(kt0u)) / 1000;
					if($var(kdt) < 0) {
						$var(kdt) = 0;
					}
					prom_histogram_observe("ims_session_setup_duration", "$var(kdt)", "$var(kpidir)");
				}
			} else if($rs =~ "^[3-6][0-9][0-9]$") {
				$dlg_var(kpidone) = "1";
				prom_counter_inc("ims_session_setup_failure_total", "1", "$var(kpidir)", "$rs");
			}
		}
	}
}

route[RELAY] {
	record_route();
	if(!t_relay()) {
		send_reply_error();
	}
}

