#!KAMAILIO
# Serving Call Session Control Function (S-CSCF)
# Diameter Cx: 3GPP TS 29.229
# Diameter Ro: 3GPP TS 32.299

#!trydefenv RO_IMPI
#!trydefenvs DBURL
#!trydefenvs RTPADR
#!trydefenvs REGSRV
#!trydefenvs ENUM
#!trydefenvs TRUNK
#!trydefenvs E164CC
# International Direct Dialing
#!trydefenvs E164IDD
#!ifndef E164IDD
#!define E164IDD "00"
#!endif
# National Direct Dialing
#!trydefenvs E164NDD
#!ifndef E164NDD
#!define E164NDD "0"
#!endif
#!defenvs REALM
#!defexps SERVER    "scscf.ims." + REALM
#!defexps SRVURI    "sip:" + SERVER
# The Service-Route URI ims_registrar_scscf builds from scscf_name, less ";lr"
#!defexps SRVROUTE  "sip:orig@" + SERVER
# The Record-Route this S-CSCF writes on an originating leg, which is how
# route[MTERM] tells a call that started inside this network from one that
# arrived from the trunk. A define rather than a concatenation at the match
# itself, so the regex stays a constant the parser compiles once.
#!defexps MO_RR     "mo@" + SERVER
#!defexps EPC_REALM "epc." + REALM
#!define FLT_DIALOG 1
#!define HEALTH cdp_has_app("16777216")
#!define HEALTH_ROUTE route(CAP);

#listen = [::]:5060 advertise SERVER name "Mw"
listen = 0.0.0.0:5060 advertise SERVER name "Mw"
