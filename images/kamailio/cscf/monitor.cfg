listen = tcp:[::]:9090
http_reply_parse = yes
tcp_accept_no_cl = yes

loadmodule "xhttp"
loadmodule "xhttp_prom"

modparam("xhttp_prom", "xhttp_prom_stats", "all")

# ---------------------------------------------------------------------------
# Custom metrics for 3GPP TS 32.454 IMS session KPIs.
#
# The S-CSCF is a stateful (tm) proxy, and Kamailio's tm module does not export
# transaction counters through the statistics framework, so SIP session
# establishment success/latency cannot be derived from the built-in stats.
# These counters are declared on every CSCF role (xhttp_prom is loaded here,
# shared via common.cfg) but are only incremented by the S-CSCF (serving.cfg).
# All exposed with the default "kamailio_" prefix, e.g.
#   kamailio_ims_session_setup_attempts_total{dir="orig"}
#
# TS 32.454 accessibility - Session Establishment Success Rate (SESR):
modparam("xhttp_prom", "prom_counter",
	"name=ims_session_setup_attempts_total; label=dir; help='INVITE-initiated session setup attempts seen by the S-CSCF'")
modparam("xhttp_prom", "prom_counter",
	"name=ims_session_setup_success_total; label=dir; help='Sessions answered with a 2xx final response'")
# label order is dir:code -> l0=dir, l1=code (code lets the network success rate exclude UE-caused failures)
modparam("xhttp_prom", "prom_counter",
	"name=ims_session_setup_failure_total; label=dir:code; help='Sessions ending in a >=300 final response'")
# TS 32.454 latency - Session Setup Time. Buckets are milliseconds (see serving.cfg).
modparam("xhttp_prom", "prom_histogram",
	"name=ims_session_setup_duration; label=dir; buckets=50:100:250:500:750:1000:1500:2000:3000:5000:10000; help='INVITE-to-2xx session setup time in ms'")
# ---------------------------------------------------------------------------

event_route[xhttp:request] {
	if(prom_check_uri())
		prom_dispatch();
	else if(HEALTH)
		xhttp_reply("200", "OK", "text/plain", "ready to serve");
	else
		xhttp_reply("500", "KO", "text/plain", "try again later");
}
