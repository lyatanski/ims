#!KAMAILIO
# monitoring (Prometheus) CSCF settings

listen = tcp:[::]:9090
http_reply_parse = yes
tcp_accept_no_cl = yes

loadmodule "xhttp"
loadmodule "xhttp_prom"

modparam("xhttp_prom", "xhttp_prom_stats", "all")

# TS 32.454 accessibility - Session Establishment Success Rate (SESR):
modparam("xhttp_prom", "prom_counter", "name=ims_session_setup_attempts_total; label=dir; help='INVITE-initiated session setup attempts seen by the S-CSCF'")
modparam("xhttp_prom", "prom_counter", "name=ims_session_setup_success_total; label=dir; help='Sessions answered with a 2xx final response'")
# label order is dir:code -> l0=dir, l1=code (code lets the network success rate exclude UE-caused failures)
modparam("xhttp_prom", "prom_counter", "name=ims_session_setup_failure_total; label=dir:code; help='Sessions ending in a >=300 final response'")
# TS 32.454 latency - Session Setup Time. Buckets are milliseconds (see serving.cfg).
modparam("xhttp_prom", "prom_histogram", "name=ims_session_setup_duration; label=dir; buckets=50:100:250:500:750:1000:1500:2000:3000:5000:10000; help='INVITE-to-2xx session setup time in ms'")

event_route[xhttp:request] {
	if(prom_check_uri()) {
		prom_dispatch();
	} else if(HEALTH) {
		#!ifdef HEALTH_ROUTE
		HEALTH_ROUTE
		#!endif
		xhttp_reply("200", "OK", "text/plain", "ready to serve");
	} else {
		xhttp_reply("500", "KO", "text/plain", "try again later");
	}
}
