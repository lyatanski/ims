#!KAMAILIO
# monitoring (Prometheus) CSCF settings

listen = tcp:[::]:9090 name "monitor"
http_reply_parse = yes
tcp_accept_no_cl = yes

loadmodule "xhttp"
loadmodule "xhttp_prom"

modparam("xhttp_prom", "xhttp_prom_stats", "all")
# The reply buffer, taken from pkg on every scrape. Its default, a third of
# the pkg pool (2.7 MB of 8), is one block that a config as big as the
# S-CSCF's with li.cfg leaves no room for: every scrape then fails "could not
# allocate private memory". A reply is 30 KB at most (the S-CSCF's)
modparam("xhttp_prom", "xhttp_prom_buf_size", 1048576)

# xhttp_prom drops a labelled series that has not been touched for this many
# minutes (60 by default) and starts it again from 0 at its next event, and a
# counter that is born at its first event never shows an increase for it: the
# first failure of every code would not count. Series that are created at
# start (serving.cfg) have to stay, so the idle timeout is set to ten years.
modparam("xhttp_prom", "xhttp_prom_timeout", 5256000)

# TS 32.454 accessibility - Initial Registration Success Rate. The registrar
# counters of ims_registrar_scscf count every REGISTER it accepts, a
# re-registration and a de-registration too: 2 per UE that registers and leaves.
modparam("xhttp_prom", "prom_counter", "name=ims_registration_initial_attempts_total; help='Initial registrations started: a challenge sent for an identity that is not registered'")
modparam("xhttp_prom", "prom_counter", "name=ims_registration_initial_success_total; help='Initial registrations the HSS assigned the S-CSCF for'")
modparam("xhttp_prom", "prom_counter", "name=ims_registration_initial_failure_total; help='Initial registrations the UE failed to authenticate or the HSS refused to assign'")

# TS 32.454 accessibility - Re-registration Success Rate: a REGISTER with an
# Expires above 0 for an identity that is registered already.
modparam("xhttp_prom", "prom_counter", "name=ims_registration_re_attempts_total; help='Re-registrations started: a challenge sent for an identity that is registered'")
modparam("xhttp_prom", "prom_counter", "name=ims_registration_re_success_total; help='Re-registrations the HSS assigned the S-CSCF for'")
modparam("xhttp_prom", "prom_counter", "name=ims_registration_re_failure_total; help='Re-registrations the UE failed to authenticate or the HSS refused to assign'")

# TS 32.454 accessibility - Session Establishment Success Rate (SESR):
modparam("xhttp_prom", "prom_counter", "name=ims_session_setup_attempts_total; label=dir; help='INVITE-initiated session setup attempts seen by the S-CSCF'")
modparam("xhttp_prom", "prom_counter", "name=ims_session_setup_success_total; label=dir; help='Sessions established: the first 180 or 2xx response to the INVITE'")
# label order is dir:code -> l0=dir, l1=code (code lets the network success rate exclude UE-caused failures)
modparam("xhttp_prom", "prom_counter", "name=ims_session_setup_failure_total; label=dir:code; help='Sessions ending in a >=300 final response'")
# TS 32.454 retainability - Session Drop Rate: sessions established, once per
# dialog (the legs of a call between two users of this S-CSCF share one), as
# the dropped sessions are counted per dialog.
modparam("xhttp_prom", "prom_counter", "name=ims_session_established_total; help='Sessions established, once per dialog: the first 180 or 2xx of either leg'")
# TS 32.454 latency - Session Setup Time. Buckets are milliseconds (see serving.cfg).
modparam("xhttp_prom", "prom_histogram", "name=ims_session_setup_duration; label=dir; buckets=5:10:25:50:100:250:500:750:1000:1500:2000:3000:5000:10000; help='INVITE to the first 180 or 2xx session setup time in ms'")

event_route[xhttp:request] {
	# A role that listens on another network's side (the IBCF on Ici) keeps
	# its metrics and health to its own: the 9090 socket is on every address
#!ifdef MONITOR_DENY
	if(MONITOR_DENY) {
		xhttp_reply("403", "Forbidden", "text/plain", "not on this interface");
		exit;
	}
#!endif
#!ifdef X1PORT
	if($Rn == "x1") {
		route(X1);
		exit;
	}
#!endif
	if(prom_check_uri()) {
		prom_dispatch();
	} else if(HEALTH) {
		#!ifdef HEALTH_ROUTE
		HEALTH_ROUTE
		#!endif
		xhttp_reply("200", "OK", "text/plain", "ready to serve");
	} else {
		xhttp_reply("500", "KO", "text/plain", "try again later");
	}
}
