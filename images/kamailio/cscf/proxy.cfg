#!KAMAILIO
# Proxy Call Session Control Function (P-CSCF)
# Diameter Rx: 3GPP TS 29.214

#!trydefenvs DBURL
#!trydefenvs GMDEV
#!defenvs REALM
#!defenvs IPSEC
# The Gm address for UEs on an IPv6 PDN; without it the P-CSCF is IPv4-only
#!trydefenvs IPSEC6
# The E-CSCF URI emergency requests go to; without it they are routed like
# any other request
#!trydefenvs ECSCF
#!defexps SERVER    "pcscf.ims." + REALM
#!defexps SRVURI    "sip:" + SERVER
#!defexps EPC_REALM "epc." + REALM
#!define FLT_DIALOG 1
# An emergency request route[SOS] has rerouted to the E-CSCF
#!define FLT_SOS 2
#!define HEALTH cdp_has_app("16777236")

# One socket per address family. A [::] socket without IPV6_V6ONLY, which
# kamailio never sets, also claims the IPv4 port, so the TCP pair only binds
# side by side with SO_REUSEPORT (tcp_reuse_port); v4 traffic still lands on
# the 0.0.0.0 socket and keeps its native source address
listen = 0.0.0.0:5060 advertise SERVER name "Mw"
listen = [::]:5060 advertise SERVER name "Mw6"
tcp_reuse_port = yes
user_agent_header = "User-Agent: Proxy-CSCF"
server_header = "Server: Proxy-CSCF"
children = 2
#!ifdef GMDEV
mhomed = 1
#!endif
mlock_pages = yes
shm_mem_size = 256 # adjusted to accomodate ims_ipsec_pcscf, ipsec_spi_id_range

loadmodule "tm"
loadmodule "pv"
loadmodule "sl"
loadmodule "rr"
loadmodule "kex"
loadmodule "cdp"
loadmodule "cdp_avp"
loadmodule "textops"
loadmodule "textopsx"
loadmodule "ims_usrloc_pcscf"
loadmodule "ims_ipsec_pcscf"
loadmodule "ims_registrar_pcscf"
loadmodule "ims_dialog"
loadmodule "ims_qos"
#!ifdef ECSCF
loadmodule "htable"
#!endif

include_file "common.cfg"
#!ifdef ECSCF
include_file "sos.cfg"
#!endif

modparam("rr", "enable_full_lr", 1)
modparam("rr", "add_username", 1)
modparam("rr", "custom_user_avp", "$avp(RR_USER)")
modparam("cdp", "config_file", "/etc/cscf/diameter.xml")
modparam("ims_dialog", "dlg_flag", FLT_DIALOG)

modparam("ims_registrar_pcscf", "delete_delay", 1)
modparam("ims_registrar_pcscf", "pcscf_uri", SRVURI)

modparam("ims_usrloc_pcscf", "expires_grace", 1)

# RFC 2406 2.1  Security Parameters Index
# The set of SPI values in the range 1 through 255 are reserved by the
# Internet Assigned Numbers Authority (IANA) for future use
modparam("ims_ipsec_pcscf", "ipsec_spi_id_start", 256)
modparam("ims_ipsec_pcscf", "ipsec_spi_id_range", 4096)
modparam("ims_ipsec_pcscf", "ipsec_client_port", 5061)
modparam("ims_ipsec_pcscf", "ipsec_server_port", 5161)
modparam("ims_ipsec_pcscf", "ipsec_listen_addr", IPSEC)
# The module binds every client and server port up front, UDP and TCP, once per
# address family, and kamailio forks `children` receivers per UDP socket. 400
# sockets is the budget: past it the main process runs out of fds at startup
# ("socketpair failed", "Cannot fork"), and raising nofile only lets the fd
# numbers pass 1024, where cdp's select() loop FD_SETs off its stack and dies
# of SIGILL. So the port pool, which the two families share, halves with IPv6
#!ifdef IPSEC6
modparam("ims_ipsec_pcscf", "ipsec_listen_addr6", IPSEC6)
modparam("ims_ipsec_pcscf", "ipsec_max_connections", 50)
#!else
modparam("ims_ipsec_pcscf", "ipsec_max_connections", 100)
#!endif

modparam("ims_qos", "rx_dest_realm", EPC_REALM)               # Destination-Realm AVP

#!ifdef DBURL
#!defexps DB_URL "redis://" + DBURL

loadmodule "db_redis"
modparam("db_redis", "schema_path", "/etc/cscf/schema/proxy")

loadmodule "pua"
modparam("db_redis", "keys", "pua=entry:id")
modparam("pua", "db_url", DB_URL)
# 3GPP TS 24.229 5.2.3
# Upon receipt of a 200 (OK) response to the first initial REGISTER request
# the P-CSCF shall generate a SUBSCRIBE request
modparam("ims_registrar_pcscf", "subscribe_to_reginfo", 1) #requires pua

modparam("db_redis", "keys", "location=entry:aor,received_port")
modparam("ims_usrloc_pcscf", "db_mode", 1)
modparam("ims_usrloc_pcscf", "db_url", DB_URL)
# Keep the IPsec SAs across a restart that keeps the network namespace (a
# container restart in its pod): the preloaded contacts carry their tunnels,
# so the UEs keep talking to the restarted P-CSCF over ESP (patch 0015)
modparam("ims_ipsec_pcscf", "ipsec_preserve_tunnels", 1)

#modparam("db_redis", "keys", "dialog_in=entry:hash_entry,hash_id")
#modparam("db_redis", "keys", "dialog_out=entry:id")
#modparam("db_redis", "keys", "dialog_vars=entry:hash_entry,hash_id")
#modparam("ims_dialog", "db_mode", 1)
#modparam("ims_dialog", "db_url", DB_URL)
#!endif


request_route {
	route(INIT);

#!ifdef ECSCF
	# 3GPP TS 24.229 5.2.10.4: the Request-URI of an initial request from
	# the UE is inspected for an emergency service identifier "independent
	# of values of possible entries in the received Route header fields".
	# Before loose_route(), as route[SOS] replaces every Route header
	if(!has_totag() && !is_method("REGISTER|ACK|CANCEL")
			&& ($route_uri =~ "sip:orig@.*" || $route_uri =~ "sip:mo@.*")
			&& route(SOS_DETECT)) {
		route(SOS);
		exit;
	}
#!endif
	loose_route();

	# Strip Transport from Request URI
	#$ru = $(ru{re.subst,/;transport=[A-Za-z]*//g});

	xinfo("====== $rm <$route_uri>\n");
	if(is_method("REGISTER")) {
		route(REGISTER);
	} else if(is_method("NOTIFY") && uri==myself) {
		route(NOTIFY);
		exit;
	} else if(has_totag()) {
		route(INDIALOG);
	} else if($route_uri =~ "sip:orig@.*" || $route_uri =~ "sip:mo@.*") {
		route(MORIG);
	} else {
		route(MTERM);
	}

	route(RELAY);
}

# An in-dialog request. This P-CSCF's Record-Route entry, the topmost Route,
# tells which way the dialog was set up: "mo" for one its UE started, "mt" for
# one its UE was called in. Requests from both ends carry the same entry, so it
# says nothing about which way this one goes. The socket it came in on does:
# from the UE over a security association, on a protected port, or from the
# core on Mw. The UE's own requests are then handled as the UE's whichever end
# started the dialog: sec-agree out of Require and Proxy-Require (RFC 3329
# 2.3.1), the Security-Verify checked, the identity asserted, and the route set
# followed to the core. The core's go to the UE over its tunnel.
route[INDIALOG] {
	if($route_uri =~ "^sip:mo@") {
		$avp(RR_USER) = "mo";
	} else {
		$avp(RR_USER) = "mt";
	}
	if($Rn == "Mw" || $Rn == "Mw6") {
		route(MTERM);
	} else {
		route(MORIG);
	}
}

route[RELAY] {
	if(!is_method("REGISTER|SUBSCRIBE"))
		setflag(FLT_DIALOG);

	# TS 24.229 5.2.6.3.3: towards the core this P-CSCF is its Mw URI, the
	# protected port is the UE's alone. Left to itself kamailio sends UDP from
	# the socket the request came in on, and with the same address, port and
	# protocol on both sides rr writes one Record-Route, the protected port's:
	# the core then sends its in-dialog requests there, and route[INDIALOG]
	# takes them for the UE's. Leaving on Mw makes it two: the core's names
	# Mw, the UE's the protected port, and loose_route() takes off both.
	if($Rn != "Mw" && $Rn != "Mw6") {
		if(af == INET6) {
			$fsn = "Mw6";
		} else {
			$fsn = "Mw";
		}
	}

	record_route();
	if(!t_relay()) {
		send_reply_error();
	}
}

#!ifdef ECSCF
# An emergency request within a normal registration, 3GPP TS 24.229
# 5.2.10.4, the condition for 1A) not fulfilled (no operator policy sends
# emergency requests through the S-CSCF): 1B). Only for a registered UE. An
# unregistered one (5.2.10.2) would need requests accepted on the unprotected
# port, and an emergency registration (5.2.10.3) is not supported, so both
# end in route[MORIG]'s 403.
route[SOS] {
	xnotice("emergency $rm <$ru> as $var(sos), to " + ECSCF + "\n");
	# 1) the Request-URI carries the emergency service URN
	$ru = $var(sos);
	# 1B b) every Route header field out, the E-CSCF's in
	remove_hf("Route");
	insert_hf("Route: <" + ECSCF + ";lr>\r\n");
	$du = ECSCF;
	# a route set that is not the Service-Route, on purpose
	setflag(FLT_SOS);
	# 1B a) the originating procedures, without the preloaded-route check
	# and the IBCF this P-CSCF never does, and with no type 1 "orig-ioi",
	# which it never inserts
	route(MORIG);
	route(RELAY);
}
#!endif

route[REGISTER] {
	if(!is_present_hf("Contact")) {
		send_reply("403", "No Contact header");
		exit;
	}
	route(SECVERIFY);

	pcscf_save_pending("location");

	# 3GPP TS 24.229 5.2.2.1
	# When the P-CSCF receives a REGISTER request from the UE, the P-CSCF shall:
	# 1) insert a Path header field in the request including an entry containing:
	# - the SIP URI identifying the P-CSCF
	# RFC 3327
	# necessary for the S-CSCF to be able to route requests
	append_hf("Path: <sip:term@"+SERVER+";lr>\r\n");
	# and the "path" option tag in Supported and Require, beside the UE's own
	# (gruu, outbound, ...): parse_supported() reads every Supported header
	if(!($(hdr(Supported)[*]) =~ "(^|[ ,])path([ ,]|$)")) {
		append_hf("Supported: path\r\n");
	}
	$var(sechdr) = "Require";
	route(RMSEC);
	append_hf("Require: path\r\n");
	$var(sechdr) = "Proxy-Require";
	route(RMSEC);
	route(PVNI);
	# TS 33.203 7.2: the sec-agree headers are between the UE and this P-CSCF.
	# The module reads Security-Client from the transaction's copy of the
	# request, which a removal here does not touch
	remove_hf("Security-Client");
	remove_hf("Security-Verify");

	t_on_reply("RESP");
}

onreply_route[RESP] {
	route(TO_UE);
	if(t_check_status("200")) {
		pcscf_save("location");
	}

	# TS 24.229 5.2.2.2
	# When the P-CSCF receives a 401 (Unauthorized) response to a REGISTER request,
	# the P-CSCF shall remove the "ck" and "ik" WWW-Authenticate header field
	#
	# Match them as header parameters — a leading comma, then the name, then the
	# quoted value — not as a bare `ck=` anywhere in the header. The nonce is
	# base64(RAND||AUTN) and its 32 bytes always encode to a trailing `=`, so
	# roughly one nonce in 256 ends in `ck=` / `ik=` (case-insensitively: the
	# last character before the pad is one of 16, the one before it one of 64).
	# An unanchored pattern matches inside that nonce and eats everything up to
	# the real ck/ik value, leaving the UE a truncated nonce and an unterminated
	# quote — which surfaces at the UE as an AKA AUTN MAC mismatch. Ending the
	# value at its own closing quote ([^"]*) instead of the next `",` also stops
	# ck/ik leaking to the UE when they are the header's last parameter.
	if(t_check_status("401")) {
		ipsec_create("location");
		if(is_present_hf("WWW-Authenticate")) {
			remove_hf("WWW-Authenticate");
			append_hf("WWW-Authenticate: $(hdr(WWW-Authenticate){re.subst,/,[[:space:]]*(ck|ik)=\"[^\"]*\"//gi})\r\n");
		}
	}
}

route[NOTIFY] {
	if(reginfo_handle_notify("location")) {
		send_reply("200", "OK - P-CSCF processed notification");
	} else {
		send_reply_error();
	}
}

# A request from the UE: an initial one, or any in-dialog one (route[INDIALOG])
route[MORIG] {
	if(!pcscf_is_registered("location")) {
		send_reply("403","Forbidden - You must register first with a S-CSCF");
		exit;
	}

	if(!has_totag()) {
		$avp(RR_USER)="mo";
	}

	if(is_present_hf("Security-Verify")) {
		route(SECVERIFY);
	}
	if(!has_totag() && !isflagset(FLT_SOS)) {
		route(SERVICE_ROUTE);
	}
	if(!has_totag() && !is_method("ACK|CANCEL")) {
		route(PVNI);
	}

	# from siputils
	sip_p_charging_vector("g");

	# RFC 3325
	remove_hf("P-Asserted-Identity");
	remove_hf("P-Preferred-Identity");
	if(is_present_hf("P-Preferred-Identity") && pcscf_assert_identity("location", "$hdr(P-Preferred-Identity)")) {
		append_hf("P-Asserted-Identity: $hdr(P-Preferred-Identity)\r\n");
	} else if(is_present_hf("P-Asserted-Identity") && pcscf_assert_identity("location", "$hdr(P-Asserted-Identity)")) {
		append_hf("P-Asserted-Identity: $hdr(P-Asserted-Identity)\r\n");
	} else {
		append_hf("P-Asserted-Identity: <$pcscf_asserted_identity>\r\n");
	}

	$var(sechdr) = "Require";
	route(RMSEC);
	$var(sechdr) = "Proxy-Require";
	route(RMSEC);
	remove_hf("Security-Verify");

	# The Rx session is the dialog's: orig for one this UE started
	if($avp(RR_USER) == "mt") {
		t_on_reply("MT_UE_REPLY");
	} else {
		t_on_reply("MO_REPLY");
	}
}

# RFC 3329 2.3.1, TS 33.203 7.2: a request over a security association has to
# carry the Security-Server that association was offered with, unmodified, in
# its Security-Verify; anything else means the 401 that offered it was
# tampered with on the way. The 494 carries the unmodified Security-Server
# (patch 0019). A request on an unprotected port has nothing to verify: the
# first REGISTER, before there is any association. One on a protected port that
# came over no tunnel of a known contact may not have come over an association
# at all, since the kernel passes in clear what no tunnel's policy selects, so
# it is refused. The REGISTER over a new one is where TS 33.203 has the check;
# UEs leave Security-Verify out of other requests, so there it is checked only
# when present.
route[SECVERIFY] {
	ipsec_verify("location");
	switch($rc) {
	case -1:
		send_reply("494", "Security Agreement Required");
		exit;
	case -3:
		send_reply("403", "Forbidden - Not over a security association");
		exit;
	}
}

# TS 24.229 5.2.6.3: the Route header fields of an initial request from the
# UE have to be the Service-Route the registration returned, so that the
# request reaches the S-CSCF serving the UE. One that does not follow it gets
# it put in place of its own route set.
route[SERVICE_ROUTE] {
	if(pcscf_follows_service_routes("location")) {
		return;
	}
	xnotice("route set <$hdr(Route)> is not the Service-Route: replaced\n");
	# loose_route() has already removed this P-CSCF's own entry, and the
	# module removes every Route header field again; two removals of the same
	# bytes overlap, and the second one is dropped. So the first goes in now.
	msg_apply_changes();
	if(!pcscf_force_service_routes("location")) {
		send_reply("400", "Bad Request - Not following indicated service routes");
		exit;
	}
}

# TS 24.229 5.2.2.1, 5.2.6.3: a REGISTER and an initial request from the UE
# carry the network the UE is visiting, a pre-provisioned string. It is this
# P-CSCF's to say, not the UE's; route[TO_UE] keeps it from any UE.
route[PVNI] {
	remove_hf("P-Visited-Network-ID");
	append_hf("P-Visited-Network-ID: ims." + REALM + "\r\n");
}

# What the core carries and the UE is not given. TS 24.229 5.2.1: before
# sending a request or response to the UE, the P-CSCF removes the
# P-Charging-Function-Addresses and P-Charging-Vector header fields. And the
# P-Visited-Network-ID of route[PVNI], which travels end to end with the
# request from the calling side's P-CSCF.
route[TO_UE] {
	remove_hf("P-Charging-Vector");
	remove_hf("P-Charging-Function-Addresses");
	remove_hf("P-Visited-Network-ID");
}

route[RMSEC] {
	if(is_present_hf($var(sechdr))) {
		remove_hf($var(sechdr));
		$var(hdr) = $(hdr($var(sechdr)){re.subst,/[, ]*sec-agree//gi});
		if($(var(hdr){s.len}) > 0) {
			append_hf("$var(sechdr): $var(hdr)\r\n");
		}
	}
}

# A request to the UE: an initial one, or any in-dialog one (route[INDIALOG])
route[MTERM] {
	if(!has_totag()) {
		$avp(RR_USER)="mt";
	}
	# 1: force the send socket. A request the udp_mtu fallback moves to TCP
	# (common.cfg) then connects from the protected client port, which the
	# outbound SA's selector names, rather than from any port on 5060's
	# address, which no SA covers and would go out unprotected
	ipsec_forward("location", 1);
	$du = $ru;

	route(TO_UE);

	# The Rx session is the dialog's: orig for one this UE started
	if(is_method("INVITE")) {
		if($avp(RR_USER) == "mo") {
			t_on_reply("MO_CORE_REPLY");
		} else {
			t_on_reply("MTAAR");
		}
	}
}

# Diameter Rx: AA-Request (AAR). The replies to a request from the UE go to
# the UE; those to a request from the core come from it
onreply_route[MO_REPLY] {
	route(TO_UE);
	if(is_method("INVITE") && has_body("application/sdp")) {
		Rx_AAR("AAA", "orig", "", -1);
	}
}

onreply_route[MT_UE_REPLY] {
	route(TO_UE);
	if(is_method("INVITE") && has_body("application/sdp")) {
		Rx_AAR("AAA", "term", "", -1);
	}
}

onreply_route[MO_CORE_REPLY] {
	if(has_body("application/sdp")) {
		Rx_AAR("AAA", "orig", "", -1);
	}
}

onreply_route[MTAAR] {
	if(has_body("application/sdp")) {
		Rx_AAR("AAA", "term", "", -1);
	}
}

# Diameter Rx: AA-Answer (AAA)
route[AAA] {
	xinfo("AAR return code: $avp(s:aar_return_code)\n");
}

