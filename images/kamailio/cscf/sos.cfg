#!KAMAILIO
# Emergency service identifiers, shared by the P-CSCF and the E-CSCF
# 3GPP TS 24.229 5.2.10.1, 5.11.2; TS 23.167

# The emergency numbers this network resolves, each mapped to the service URN
# (RFC 5031) it stands for: whitespace-separated <number>=<urn> entries. The
# first one is also the number the E-CSCF asserts back to the UE when the
# Request-URI was a URN. 112 and 911 are the two every ME knows (TS 22.101).
#!trydefenvs SOSNUM
#!ifndef SOSNUM
#!define SOSNUM "112=urn:service:sos 911=urn:service:sos"
#!endif

# Included after common.cfg, by a config that has loaded htable
modparam("htable", "htable", "sosnum=>size=4;")

event_route[htable:mod-init] {
	$var(list) = SOSNUM;
	$var(first) = 1;
	route(SOSLIST);
	while($var(entry) != "") {
		$sht(sosnum=>$var(key)) = $(var(val){s.tolower});
		if($var(first)) {
			$shv(sospai) = $var(key);
			$var(first) = 0;
		}
		xinfo("emergency number $var(key) -> $(var(val){s.tolower})\n");
		route(SOSLIST);
	}
#!ifdef SOS_INIT
	SOS_INIT
#!endif
}

# Pops the first <key>=<value> entry off the whitespace-separated $var(list)
# into $var(entry), $var(key) and $var(val). An empty $var(entry) is the end.
route[SOSLIST] {
	$var(entry) = "";
	if(!($var(list) =~ "[^[:space:]]")) {
		return;
	}
	$var(entry) = $(var(list){re.subst,/^[[:space:]]*([^[:space:]]+).*/\1/});
	$var(list) = $(var(list){re.subst,/^[[:space:]]*[^[:space:]]+//});
	$var(key) = $(var(entry){re.subst,/=.*//});
	$var(val) = $(var(entry){re.subst,/^[^=]*=//});
}

# Whether the Request-URI is an emergency service identifier: any service URN
# under the top-level "sos" type, or one of the numbers above. Sets $var(sos)
# to the service URN, lowercase, and $var(sosnum) to the number if one was
# dialled, "" otherwise. Every "sos" URN counts, subtypes this network does not know
# included: the E-CSCF falls back to the parent service when it picks the PSAP,
# which is the "remove the right most service identifier" of 24.229 5.2.10.2.
route[SOS_DETECT] {
	$var(sosnum) = "";
	$var(sos) = $(ru{s.tolower});
	if($var(sos) =~ "^urn:service:sos([.][a-z0-9.-]+)?$") {
		return 1;
	}
	if($(ru{uri.scheme}) =~ "^(sip|sips|tel)$" && $rU != $null
			&& $sht(sosnum=>$rU) != $null) {
		$var(sosnum) = $rU;
		$var(sos) = $sht(sosnum=>$rU);
		return 1;
	}
	return -1;
}
