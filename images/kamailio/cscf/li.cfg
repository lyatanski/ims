#!KAMAILIO
# Lawful interception: LI_X1, the interface over which the LIPF (the ADMF)
# tasks this node as an IRI-POI or a CC-TF (TS 33.127 5.4.4, TS 33.128 7.12.3)
#
# Wire format ETSI TS 103 221-1 V1.23.1, Profile A (7.2): each request is an
# X1Request container in an HTTP POST, and each answer an X1Response
# container in a 200 OK. An X1 failure is an ErrorResponse inside that
# container, never an HTTP error code (7.2.2.2). Tasks and Destinations
# live in shared memory only. A restart drops them, and the ADMF finds that
# out with GetAllDetails or ListAllDetails and provisions them again.
#
# Clause 8 requires mutual TLS on X1, with each side's identifier matching
# its certificate. This socket is plain HTTP, so it must only be reachable
# from the LI network.
#
# LI_X2 (TS 103 221-2) is route[X2_*] at the end, with the x2 module: every
# CSCF that includes this is an IRI-POI, and its request routes call
# route(X2_REQUEST) and route(X2_REGISTER) under X2_IRIPOI. Not here yet:
# LI_X3, and the requests the NE itself sends (ReportTaskIssue, ReportNEIssue,
# and the Keepalive P2 timer that relies on them). A Destination is reported
# activeAndWorking whatever its X2 connection does; x2.list shows that.
#
# Included after common.cfg by a config that has loaded htable and declared
# X1PORT, and defined X1_CCTF if it is a CC-TF (the P-CSCF, the IBCF).
# Without X1PORT in the environment none of this is loaded and no socket is
# opened.

#!ifdef X1PORT

# NE Identifier (6.1): the one this node answers to. A request addressed to
# any other NE gets 1060. Defaults to the node's SIP name
#!trydefenvs X1NE
#!ifndef X1NE
#!define X1NE SERVER
#!endif
# ADMF Identifier: when set, a request from any other ADMF gets 1040
#!trydefenvs X1ADMF

#!define X1VERSION "v1.23.1"
#!define UUID_RE "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
# xs:token: no leading, trailing or repeated spaces, no control characters
#!define TOKEN_RE "^[[:graph:]]+( [[:graph:]]+)*$"
# Upper bounds for the loops over a request's lists
#!define X1MAX 32

listen = tcp:[::]:X1PORT name "x1"

loadmodule "xmlops"
# The whole request goes through a buffer of this size, and a larger one is
# refused (4095 by default)
modparam("xmlops", "buf_size", 65535)
modparam("xmlops", "xml_ns", "x1=http://uri.etsi.org/03221/X1/2017/10")
modparam("xmlops", "xml_ns", "xsi=http://www.w3.org/2001/XMLSchema-instance")
modparam("xmlops", "xml_ns", "c=http://uri.etsi.org/03280/common/2017/07")

# Task XID -> the <taskDetails> content GetTaskDetails answers with
modparam("htable", "htable", "x1task=>size=8;")
# Task XID -> ;DID;DID; it delivers to
modparam("htable", "htable", "x1tdid=>size=8;")
# Task XID -> its target key
modparam("htable", "htable", "x1ttgt=>size=8;")
# Target key -> ;XID;XID; of the Tasks on it: the lookup the IRI-POI and
# CC-TF are to make. The key is <kind>:<identity>, kind impu, impi or imei,
# or nonlocal for an IMPU of another network (33.128 7.12.2.2)
modparam("htable", "htable", "x1tgt=>size=8;")
# Destination DID -> the <destinationDetails> content
modparam("htable", "htable", "x1dest=>size=6;")
# Destination DID -> its deliveryType
modparam("htable", "htable", "x1dtyp=>size=6;")
# Destination DID -> where its PDUs go, [tcp:|udp:]address:port, the way the
# x2 module takes it
modparam("htable", "htable", "x1daddr=>size=6;")
# Task XID -> the XID its X2 PDUs carry: its productID if it has one (TS 103
# 221-2 5.2.7). Only a Task that delivers over X2 has one
modparam("htable", "htable", "x1tx2=>size=8;")
# Task XID -> its Matched Target Identifier (TS 103 221-2 5.3.18)
modparam("htable", "htable", "x1tmat=>size=8;")
# Task XID -> ;serviceType; of its listOfServiceTypes, if it has one
modparam("htable", "htable", "x1tsvc=>size=8;")
# Serialises X1 requests
modparam("htable", "htable", "x1lock=>size=1;")

# event_route[xhttp:request] (monitor.cfg), for the x1 socket
route[X1] {
	if($rm != "POST") {
		xhttp_reply("405", "Method Not Allowed", "text/plain", "X1 requests are POSTed\n");
		return;
	}
	route(X1_TIME);
	$var(x1rsp) = "";
	$var(x1top) = 0;
	# One request at a time: a container can hold several requests that read
	# and change the same Tasks and Destinations, and so can the next one
	sht_lock("x1lock=>x1");
	route(X1_CONTAINER);
	sht_unlock("x1lock=>x1");

	$var(body) = "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n";
	if($var(x1top) == 1) {
		# 6.1: a request that could not be parsed gets the identifiers, the
		# timestamp and the version, and nothing else
		$var(body) = $var(body) + "<X1TopLevelErrorResponse xmlns=\"http://uri.etsi.org/03221/X1/2017/10\">"
			+ "<admfIdentifier>" + $var(x1admf) + "</admfIdentifier>"
			+ "<neIdentifier>" + X1NE + "</neIdentifier>"
			+ "<messageTimestamp>" + $var(x1ts) + "</messageTimestamp>"
			+ "<version>" + X1VERSION + "</version>"
			+ "</X1TopLevelErrorResponse>";
	} else {
		$var(body) = $var(body) + "<X1Response xmlns=\"http://uri.etsi.org/03221/X1/2017/10\""
			+ " xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\""
			+ " xmlns:etsi103280=\"http://uri.etsi.org/03280/common/2017/07\">"
			+ $var(x1rsp) + "</X1Response>";
	}
	xhttp_reply("200", "OK", "application/xml", "$var(body)");
}

# Qualified Microsecond Date Time (TS 103 280): 2026-11-26T08:48:21.247432Z
# or with a +hh:mm offset, from one clock reading
route[X1_TIME] {
	$var(tv) = $TV(Sn);
	$var(sec) = $(var(tv){s.select,0,.}{s.int});
	$var(tz) = $(var(sec){s.ftime,%z});
	$var(x1ts) = $(var(sec){s.ftime,%Y-%m-%dT%H:%M:%S}) + "." + $(var(tv){s.select,1,.})
		+ $(var(tz){s.substr,0,3}) + ":" + $(var(tz){s.substr,3,2});
}

route[X1_CONTAINER] {
	$var(x1admf) = "unknown";
	if($rb == $null || $(rb{s.len}) == 0 || $(rb{s.len}) > 65535) {
		$var(x1top) = 1;
		return;
	}
	$xml(x1=>doc) = $rb;
	if($xml(x1=>xpath:/x1:X1Request/x1:x1RequestMessage[1]/@xsi:type) == $null) {
		$var(x1top) = 1;
		return;
	}
	$var(e) = $xml(x1=>xpath:/x1:X1Request/x1:x1RequestMessage[1]/x1:admfIdentifier/text());
	if($var(e) =~ TOKEN_RE) {
		route(X1_ESC);
		$var(x1admf) = $var(e);
	}

	# Every request type is checked before any request is acted on: a type
	# the schema does not have makes the container unparseable, and nothing
	# in it may have been carried out by then
	$var(n) = 0;
	$var(i) = 1;
	while($var(i) <= X1MAX) {
		$var(type) = $xml(x1=>xpath:/x1:X1Request/x1:x1RequestMessage[$var(i)]/@xsi:type);
		if($var(type) == "") {
			$var(i) = X1MAX + 1;
		} else {
			$var(type) = $(var(type){s.select,-1,:});
			switch($var(type)) {
				case "ActivateTaskRequest":
				case "ModifyTaskRequest":
				case "DeactivateTaskRequest":
				case "DeactivateAllTasksRequest":
				case "CreateDestinationRequest":
				case "ModifyDestinationRequest":
				case "RemoveDestinationRequest":
				case "RemoveAllDestinationsRequest":
				case "GetTaskDetailsRequest":
				case "GetDestinationDetailsRequest":
				case "GetNEStatusRequest":
				case "GetAllDetailsRequest":
				case "ListAllDetailsRequest":
				case "GetAllTaskDetailsRequest":
				case "GetAllDestinationDetailsRequest":
				case "GetAllGenericObjectDetailsRequest":
				case "ReportTaskIssueRequest":
				case "ReportDestinationIssueRequest":
				case "ReportNEIssueRequest":
				case "PingRequest":
				case "KeepaliveRequest":
				case "CreateObjectRequest":
				case "ModifyObjectRequest":
				case "GetObjectRequest":
				case "DeleteObjectRequest":
				case "ListObjectsOfTypeRequest":
				case "DeleteAllObjectsRequest":
					$var(n) = $var(i);
					$var(i) = $var(i) + 1;
					break;
				default:
					xnotice("X1 request from $var(x1admf) of unknown type\n");
					$var(x1top) = 1;
					return;
			}
		}
	}
	if($var(n) == 0) {
		$var(x1top) = 1;
		return;
	}

	$var(i) = 1;
	while($var(i) <= $var(n)) {
		route(X1_MESSAGE);
		$var(i) = $var(i) + 1;
	}
}

# The request at x1RequestMessage[$var(i)], answered into $var(x1rsp)
route[X1_MESSAGE] {
	$var(m) = "/x1:X1Request/x1:x1RequestMessage[" + $var(i) + "]";
	$var(type) = $xml(x1=>xpath:$var(m)/@xsi:type);
	$var(type) = $(var(type){s.select,-1,:});
	# RequestMessageType (6.7): the type without its "Request"
	$var(rtype) = $(var(type){s.rbefore,R});
	$var(admf) = $xml(x1=>xpath:$var(m)/x1:admfIdentifier/text());
	$var(ne) = $xml(x1=>xpath:$var(m)/x1:neIdentifier/text());
	$var(ver) = $xml(x1=>xpath:$var(m)/x1:version/text());
	$var(txid) = $xml(x1=>xpath:$var(m)/x1:x1TransactionId/text());
	$var(ecode) = 0;
	$var(body) = "";
	# What the log line names: the XID or DID, never a target
	$var(id) = "";

	$var(u) = $var(txid);
	route(X1_UUID);
	if(!($var(admf) =~ TOKEN_RE) || !($var(ne) =~ TOKEN_RE) || $var(ok) == 0
			|| $xml(x1=>xpath:$var(m)/x1:messageTimestamp/text()) == "") {
		$var(ecode) = 1010;
		$var(edesc) = "admfIdentifier, neIdentifier, messageTimestamp, version and x1TransactionId are mandatory";
	} else if(!($var(ver) =~ "^v1[.][0-9]+[.][0-9]+$")) {
		$var(ecode) = 1020;
		$var(edesc) = X1VERSION;
#!ifdef X1ADMF
	} else if($var(admf) != X1ADMF) {
		$var(ecode) = 1040;
		$var(edesc) = "Unexpected ADMF Identifier";
#!endif
	} else if($var(ne) != X1NE) {
		$var(ecode) = 1060;
		$var(edesc) = "Unexpected NE Identifier";
	} else {
		switch($var(type)) {
			case "ActivateTaskRequest":
				route(X1_ACTIVATE);
				break;
			case "ModifyTaskRequest":
				route(X1_MODIFY);
				break;
			case "DeactivateTaskRequest":
				route(X1_DEACTIVATE);
				break;
			case "DeactivateAllTasksRequest":
				# 6.2.4: enabled unless agreed otherwise
				sht_reset("x1task");
				sht_reset("x1tdid");
				sht_reset("x1ttgt");
				sht_reset("x1tgt");
				sht_reset("x1tx2");
				sht_reset("x1tmat");
				sht_reset("x1tsvc");
				$var(body) = "<oK>AcknowledgedAndCompleted</oK>";
				break;
			case "GetTaskDetailsRequest":
				route(X1_GET_TASK);
				break;
			case "CreateDestinationRequest":
				route(X1_CREATE_DEST);
				break;
			case "ModifyDestinationRequest":
				route(X1_MODIFY_DEST);
				break;
			case "RemoveDestinationRequest":
				route(X1_REMOVE_DEST);
				break;
			case "RemoveAllDestinationsRequest":
				route(X1_REMOVE_ALL_DEST);
				break;
			case "GetDestinationDetailsRequest":
				route(X1_GET_DEST);
				break;
			case "GetNEStatusRequest":
				$var(body) = "<neStatusDetails><neStatus>OK</neStatus><listOfFaults/></neStatusDetails>";
				break;
			case "GetAllDetailsRequest":
				route(X1_ALL_TASKS);
				route(X1_ALL_DESTS);
				$var(body) = "<neStatusDetails><neStatus>OK</neStatus><listOfFaults/></neStatusDetails>"
					+ "<listOfTaskResponseDetails>" + $var(tasks) + "</listOfTaskResponseDetails>"
					+ "<listOfDestinationResponseDetails>" + $var(dests) + "</listOfDestinationResponseDetails>";
				break;
			case "GetAllTaskDetailsRequest":
				route(X1_ALL_TASKS);
				$var(body) = "<listOfTaskResponseDetails>" + $var(tasks) + "</listOfTaskResponseDetails>";
				break;
			case "GetAllDestinationDetailsRequest":
				route(X1_ALL_DESTS);
				$var(body) = "<listOfDestinationResponseDetails>" + $var(dests) + "</listOfDestinationResponseDetails>";
				break;
			case "ListAllDetailsRequest":
				route(X1_LIST_ALL);
				break;
			case "PingRequest":
			case "KeepaliveRequest":
				$var(body) = "<oK>AcknowledgedAndCompleted</oK>";
				break;
			default:
				# Generic Objects (annex E), and the issue reports that only an
				# ADMF is sent
				$var(ecode) = 1080;
				$var(edesc) = "Unsupported request";
		}
	}

	route(X1_HEAD);
	if($var(ecode) != 0) {
		$var(e) = $var(edesc);
		route(X1_ESC);
		$var(x1rsp) = $var(x1rsp) + $var(head)
			+ "<requestMessageType>" + $var(rtype) + "</requestMessageType>"
			+ "<errorInformation><errorCode>" + $var(ecode) + "</errorCode>"
			+ "<errorDescription>" + $var(e) + "</errorDescription></errorInformation>"
			+ "</x1ResponseMessage>";
		xnotice("X1 $var(rtype)$var(id) from $var(x1admf): error $var(ecode)\n");
	} else {
		$var(x1rsp) = $var(x1rsp) + $var(head) + $var(body) + "</x1ResponseMessage>";
		xinfo("X1 $var(rtype)$var(id) from $var(x1admf): ok\n");
	}
}

# The fields every response starts with (6.1), into $var(head)
route[X1_HEAD] {
	if($var(ecode) != 0) {
		$var(head) = "<x1ResponseMessage xsi:type=\"ErrorResponse\">";
	} else {
		$var(head) = "<x1ResponseMessage xsi:type=\"" + $var(rtype) + "Response\">";
	}
	$var(e) = $var(admf);
	route(X1_ESC);
	$var(head) = $var(head) + "<admfIdentifier>" + $var(e) + "</admfIdentifier>"
		+ "<neIdentifier>" + X1NE + "</neIdentifier>"
		+ "<messageTimestamp>" + $var(x1ts) + "</messageTimestamp>"
		+ "<version>" + X1VERSION + "</version>";
	$var(e) = $var(txid);
	route(X1_ESC);
	$var(head) = $var(head) + "<x1TransactionId>" + $var(e) + "</x1TransactionId>";
}

# $var(e) as XML character data
route[X1_ESC] {
	$var(e) = $(var(e){s.replace,&,&amp;}{s.replace,<,&lt;}{s.replace,>,&gt;});
}

# The target key of the IMPU $var(uri), into $var(ikey): sip:user@host with
# the host in lower case, or tel:number for a tel URI and a SIP URI with
# user=phone, no parameters either way. Anything else as it is
route[X1_IMPU_KEY] {
	$var(ikey) = $var(uri);
	if(!($var(uri) =~ "^(sips?|tel):")) {
		return;
	}
	if($(var(uri){uri.scheme}) == "tel" || $(var(uri){uri.param,user}) == "phone") {
		if($(var(uri){uri.user}) != "") {
			$var(ikey) = "tel:" + $(var(uri){uri.user});
		}
	} else if($(var(uri){uri.user}) == "") {
		$var(ikey) = "sip:" + $(var(uri){uri.host}{s.tolower});
	} else {
		$var(ikey) = "sip:" + $(var(uri){uri.user}) + "@" + $(var(uri){uri.host}{s.tolower});
	}
}

# $var(ok) = 1 when $var(u) is a UUID as the schema has it: lower case only
route[X1_UUID] {
	$var(ok) = 0;
	if($var(u) =~ UUID_RE && $var(u) == $(var(u){s.tolower})) {
		$var(ok) = 1;
	}
}

route[X1_ACTIVATE] {
	$var(tfail) = 3000;
	route(X1_TASK_PARSE);
	if($var(ecode) != 0) {
		return;
	}
	if($sht(x1task=>$var(xid)) != $null) {
		$var(ecode) = 2010;
		$var(edesc) = $var(xid);
		return;
	}
	route(X1_TASK_STORE);
	$var(body) = "<oK>AcknowledgedAndCompleted</oK>";
}

# 6.2.2: the request carries the whole Task, which replaces the old one
route[X1_MODIFY] {
	$var(tfail) = 3001;
	route(X1_TASK_PARSE);
	if($var(ecode) != 0) {
		return;
	}
	if($sht(x1task=>$var(xid)) == $null) {
		$var(ecode) = 2020;
		$var(edesc) = $var(xid);
		return;
	}
	route(X1_TASK_DROP);
	route(X1_TASK_STORE);
	$var(body) = "<oK>AcknowledgedAndCompleted</oK>";
}

route[X1_DEACTIVATE] {
	$var(xid) = $xml(x1=>xpath:$var(m)/x1:xId/text());
	$var(u) = $var(xid);
	route(X1_UUID);
	if($var(ok) == 0) {
		$var(ecode) = 1010;
		$var(edesc) = "xId is not a UUID";
		return;
	}
	$var(id) = " " + $var(xid);
	if($sht(x1task=>$var(xid)) == $null) {
		$var(ecode) = 2020;
		$var(edesc) = $var(xid);
		return;
	}
	route(X1_TASK_DROP);
	$var(body) = "<oK>AcknowledgedAndCompleted</oK>";
}

route[X1_GET_TASK] {
	$var(xid) = $xml(x1=>xpath:$var(m)/x1:xId/text());
	$var(u) = $var(xid);
	route(X1_UUID);
	if($var(ok) == 0) {
		$var(ecode) = 1010;
		$var(edesc) = "xId is not a UUID";
		return;
	}
	$var(id) = " " + $var(xid);
	if($sht(x1task=>$var(xid)) == $null) {
		$var(ecode) = 2020;
		$var(edesc) = $var(xid);
		return;
	}
	$var(tdet) = $sht(x1task=>$var(xid));
	route(X1_TASK_RESP);
	$var(body) = $var(trd);
}

# <taskResponseDetails> for $var(tdet), into $var(trd)
route[X1_TASK_RESP] {
	$var(trd) = "<taskResponseDetails><taskDetails>" + $var(tdet) + "</taskDetails>"
		+ "<taskStatus><provisioningStatus>complete</provisioningStatus><listOfFaults/></taskStatus>"
		+ "</taskResponseDetails>";
}

# The <taskDetails> of an ActivateTask or ModifyTask (6.2.1.2) into $var(xid),
# $var(tkey), $var(dids) and $var(tdet), the content GetTaskDetails answers
# with, and what X2 delivery takes: $var(pxid), $var(tmat), $var(svcl). Or
# $var(ecode), with $var(tfail) for a failure of the Task itself
route[X1_TASK_PARSE] {
	$var(t) = $var(m) + "/x1:taskDetails";
	$var(xid) = $xml(x1=>xpath:$var(t)/x1:xId/text());
	$var(u) = $var(xid);
	route(X1_UUID);
	if($var(ok) == 0) {
		$var(ecode) = 1010;
		$var(edesc) = "xId is not a UUID";
		return;
	}
	$var(id) = " " + $var(xid);

	# Target identifiers (33.128 7.12.2.2): an IMPU, also as a sipUri or a
	# telUri, an IMPI, a PEIIMEI or an IMEI. One identity per Task, which a
	# nonLocalIdentifier may mark as another network's user. All the
	# identifiers of a Task have to match (6.2.1.2), and which combinations
	# an NE supports is its choice: 3020 for any other
	$var(names) = "impu:sipUri:telUri:impi:peiImei:imei:nonLocalIdentifier";
	$var(ttype) = "";
	$var(tval) = "";
	$var(nonlocal) = "";
	$var(k) = 1;
	while($var(k) <= X1MAX) {
		$var(g) = $var(t) + "/x1:targetIdentifiers/x1:targetIdentifier[" + $var(k) + "]";
		if($xml(x1=>xpath:$var(g)/*/text()) == "") {
			$var(k) = X1MAX + 1;
		} else {
			$var(name) = "";
			$var(j) = 0;
			while($var(j) < 7) {
				$var(try) = $(var(names){s.select,$var(j),:});
				$var(v) = $xml(x1=>xpath:$var(g)/x1:$var(try)/text());
				if($var(v) != "") {
					$var(name) = $var(try);
					$var(j) = 7;
				}
				$var(j) = $var(j) + 1;
			}
			if($var(name) == "") {
				$var(ecode) = 3010;
				$var(edesc) = "only impu, sipUri, telUri, impi, peiImei, imei and nonLocalIdentifier";
				return;
			}
			if($var(name) == "nonLocalIdentifier") {
				if($var(nonlocal) != "" || !($var(v) == "Local" || $var(v) == "NonLocal")) {
					$var(ecode) = 3020;
					$var(edesc) = "one nonLocalIdentifier, Local or NonLocal";
					return;
				}
				$var(nonlocal) = $var(v);
			} else {
				if($var(tval) != "") {
					$var(ecode) = 3020;
					$var(edesc) = "one target identity per Task";
					return;
				}
				$var(ttype) = $var(name);
				$var(tval) = $var(v);
			}
			$var(k) = $var(k) + 1;
		}
	}
	if($var(tval) == "") {
		$var(ecode) = 3020;
		$var(edesc) = "a Task needs one impu, sipUri, telUri, impi, peiImei or imei";
		return;
	}
	if($var(ttype) == "impu" || $var(ttype) == "sipUri" || $var(ttype) == "telUri") {
		$var(uri) = $var(tval);
		route(X1_IMPU_KEY);
		$var(tkey) = "impu:" + $var(ikey);
		if($var(nonlocal) == "NonLocal") {
			$var(tkey) = "nonlocal:" + $var(ikey);
		}
	} else if($var(nonlocal) == "NonLocal") {
		# 33.128 7.12.2.2: a non-local ID is an IMPU
		$var(ecode) = 3020;
		$var(edesc) = "a non-local target is an IMPU";
		return;
	} else if($var(ttype) == "impi") {
		$var(tkey) = "impi:" + $var(tval);
	} else {
		# An IMEI (TS 103 280: 14 digits, or 15 with the check digit) or a
		# PEIIMEI (imei- and 15 digits): the 14 a REGISTER's +sip.instance
		# is matched on
		$var(v) = $(var(tval){s.rm,imei-});
		if(!($var(v) =~ "^[0-9]{14,16}$")) {
			$var(ecode) = 1010;
			$var(edesc) = "an IMEI is 14 to 16 digits";
			return;
		}
		$var(tkey) = "imei:" + $(var(v){s.substr,0,14});
	}
	$var(e) = $var(tval);
	route(X1_ESC);
	$var(tmat) = "<" + $var(ttype) + ">" + $var(e) + "</" + $var(ttype) + ">";
	$var(targets) = "<targetIdentifiers><targetIdentifier>" + $var(tmat) + "</targetIdentifier>";
	if($var(nonlocal) != "") {
		$var(targets) = $var(targets) + "<targetIdentifier><nonLocalIdentifier>" + $var(nonlocal)
			+ "</nonLocalIdentifier></targetIdentifier>";
	}
	$var(targets) = $var(targets) + "</targetIdentifiers>";

	$var(dtype) = $xml(x1=>xpath:$var(t)/x1:deliveryType/text());
	if(!($var(dtype) == "X2Only" || $var(dtype) == "X3Only" || $var(dtype) == "X2andX3")) {
		$var(ecode) = 1010;
		$var(edesc) = "deliveryType is X2Only, X3Only or X2andX3";
		return;
	}
#!ifndef X1_CCTF
	# Only an IRI-POI here: there is no media to trigger a CC-POI for
	if($var(dtype) != "X2Only") {
		$var(ecode) = $var(tfail);
		$var(edesc) = "this NE is an IRI-POI only: X2Only";
		return;
	}
#!endif

	# 5.1.3: a Destination exists before a Task names it. 33.128 5.2.2.3.2:
	# at least one
	$var(dids) = ";";
	$var(dx) = "";
	$var(x2) = 0;
	$var(x3) = 0;
	$var(k) = 1;
	while($var(k) <= X1MAX) {
		$var(u) = $xml(x1=>xpath:$var(t)/x1:listOfDIDs/x1:dId[$var(k)]/text());
		if($var(u) == "") {
			$var(k) = X1MAX + 1;
		} else {
			route(X1_UUID);
			if($var(ok) == 0) {
				$var(ecode) = 1010;
				$var(edesc) = "dId is not a UUID";
				return;
			}
			if($sht(x1dtyp=>$var(u)) == $null) {
				$var(ecode) = 2040;
				$var(edesc) = $var(u);
				return;
			}
			if(!($var(dids) =~ ";" + $var(u) + ";")) {
				$var(dids) = $var(dids) + $var(u) + ";";
				$var(dx) = $var(dx) + "<dId>" + $var(u) + "</dId>";
				if($sht(x1dtyp=>$var(u)) != "X3Only") {
					$var(x2) = 1;
				}
				if($sht(x1dtyp=>$var(u)) != "X2Only") {
					$var(x3) = 1;
				}
			}
			$var(k) = $var(k) + 1;
		}
	}
	if($xml(x1=>xpath:$var(t)/x1:listOfDIDs/x1:dSId[1]/text()) != "") {
		# Destination Sets are Generic Objects (annex E), of which there are none
		$var(ecode) = 2060;
		$var(edesc) = $xml(x1=>xpath:$var(t)/x1:listOfDIDs/x1:dSId[1]/text());
		return;
	}
	if($var(dx) == "") {
		$var(ecode) = $var(tfail);
		$var(edesc) = "a Task needs at least one Destination";
		return;
	}
	if(($var(dtype) != "X3Only" && $var(x2) == 0) || ($var(dtype) != "X2Only" && $var(x3) == 0)) {
		$var(ecode) = 3040;
		$var(edesc) = "no Destination takes the deliveryType of the Task";
		return;
	}

	$var(tdet) = "<xId>" + $var(xid) + "</xId>" + $var(targets)
		+ "<deliveryType>" + $var(dtype) + "</deliveryType>"
		+ "<listOfDIDs>" + $var(dx) + "</listOfDIDs>";

	# The optional fields this NE keeps, in the schema's order. The
	# listOfMediationDetails is for an MDF, and is left out
	$var(v) = $xml(x1=>xpath:$var(t)/x1:correlationID/text());
	if($var(v) != "") {
		if(!($var(v) =~ "^[0-9]+$")) {
			$var(ecode) = 1010;
			$var(edesc) = "correlationID is a non-negative integer";
			return;
		}
		$var(tdet) = $var(tdet) + "<correlationID>" + $var(v) + "</correlationID>";
	}
	$var(v) = $xml(x1=>xpath:$var(t)/x1:implicitDeactivationAllowed/text());
	if($var(v) != "") {
		if(!($var(v) == "true" || $var(v) == "false" || $var(v) == "1" || $var(v) == "0")) {
			$var(ecode) = 1010;
			$var(edesc) = "implicitDeactivationAllowed is a boolean";
			return;
		}
		$var(tdet) = $var(tdet) + "<implicitDeactivationAllowed>" + $var(v) + "</implicitDeactivationAllowed>";
	}
	$var(pxid) = $var(xid);
	$var(u) = $xml(x1=>xpath:$var(t)/x1:productID/text());
	if($var(u) != "") {
		route(X1_UUID);
		if($var(ok) == 0) {
			$var(ecode) = 1010;
			$var(edesc) = "productID is not a UUID";
			return;
		}
		$var(tdet) = $var(tdet) + "<productID>" + $var(u) + "</productID>";
		$var(pxid) = $var(u);
	}
	# 33.128 7.12.3.2.1: the service types of an IMS Task
	$var(svc) = "";
	$var(svcl) = ";";
	$var(k) = 1;
	while($var(k) <= X1MAX) {
		$var(v) = $xml(x1=>xpath:$var(t)/x1:listOfServiceTypes/x1:serviceType[$var(k)]/text());
		if($var(v) == "") {
			$var(k) = X1MAX + 1;
		} else {
			if(!($var(v) == "voice" || $var(v) == "messaging")) {
				$var(ecode) = 3050;
				$var(edesc) = "voice or messaging";
				return;
			}
			$var(svc) = $var(svc) + "<serviceType>" + $var(v) + "</serviceType>";
			$var(svcl) = $var(svcl) + $var(v) + ";";
			$var(k) = $var(k) + 1;
		}
	}
	if($var(svc) != "") {
		$var(tdet) = $var(tdet) + "<listOfServiceTypes>" + $var(svc) + "</listOfServiceTypes>";
	}
}

route[X1_TASK_STORE] {
	$sht(x1task=>$var(xid)) = $var(tdet);
	$sht(x1tdid=>$var(xid)) = $var(dids);
	$sht(x1ttgt=>$var(xid)) = $var(tkey);
	$sht(x1tmat=>$var(xid)) = $var(tmat);
	if($var(dtype) != "X3Only") {
		$sht(x1tx2=>$var(xid)) = $var(pxid);
	}
	if($var(svcl) != ";") {
		$sht(x1tsvc=>$var(xid)) = $var(svcl);
	}
	$var(l) = ";";
	if($sht(x1tgt=>$var(tkey)) != $null) {
		$var(l) = $sht(x1tgt=>$var(tkey));
	}
	$sht(x1tgt=>$var(tkey)) = $var(l) + $var(xid) + ";";
}

# Task $var(xid) and its place in the target index, gone
route[X1_TASK_DROP] {
	$var(okey) = $sht(x1ttgt=>$var(xid));
	$var(l) = $sht(x1tgt=>$var(okey));
	$var(r) = ";" + $var(xid) + ";";
	$var(l) = $(var(l){s.replace,$var(r),;});
	if($var(l) == ";") {
		$sht(x1tgt=>$var(okey)) = $null;
	} else {
		$sht(x1tgt=>$var(okey)) = $var(l);
	}
	$sht(x1task=>$var(xid)) = $null;
	$sht(x1tdid=>$var(xid)) = $null;
	$sht(x1ttgt=>$var(xid)) = $null;
	$sht(x1tx2=>$var(xid)) = $null;
	$sht(x1tmat=>$var(xid)) = $null;
	$sht(x1tsvc=>$var(xid)) = $null;
}

route[X1_ALL_TASKS] {
	$var(tasks) = "";
	sht_iterator_start("x1it", "x1task");
	while(sht_iterator_next("x1it")) {
		$var(tdet) = $shtitval(x1it);
		route(X1_TASK_RESP);
		$var(tasks) = $var(tasks) + $var(trd);
	}
	sht_iterator_end("x1it");
}

route[X1_LIST_ALL] {
	$var(body) = "<ListOfXIDs>";
	sht_iterator_start("x1it", "x1task");
	while(sht_iterator_next("x1it")) {
		$var(body) = $var(body) + "<xId>" + $shtitkey(x1it) + "</xId>";
	}
	sht_iterator_end("x1it");
	$var(body) = $var(body) + "</ListOfXIDs><ListOfDIDs>";
	sht_iterator_start("x1it", "x1dest");
	while(sht_iterator_next("x1it")) {
		$var(body) = $var(body) + "<dId>" + $shtitkey(x1it) + "</dId>";
	}
	sht_iterator_end("x1it");
	$var(body) = $var(body) + "</ListOfDIDs>";
}

# The <destinationDetails> of a CreateDestination or ModifyDestination
# (6.3.1.2) into $var(did), $var(dtype), $var(ddet) and $var(daddr), or
# $var(ecode)
route[X1_DEST_PARSE] {
	$var(d) = $var(m) + "/x1:destinationDetails";
	$var(did) = $xml(x1=>xpath:$var(d)/x1:dId/text());
	$var(u) = $var(did);
	route(X1_UUID);
	if($var(ok) == 0) {
		$var(ecode) = 1010;
		$var(edesc) = "dId is not a UUID";
		return;
	}
	$var(id) = " " + $var(did);
	$var(dtype) = $xml(x1=>xpath:$var(d)/x1:deliveryType/text());
	if(!($var(dtype) == "X2Only" || $var(dtype) == "X3Only" || $var(dtype) == "X2andX3")) {
		$var(ecode) = 1010;
		$var(edesc) = "deliveryType is X2Only, X3Only or X2andX3";
		return;
	}

	# X2 and X3 go to an address and port (TS 103 221-2), not to a URI,
	# a number or a mailbox
	$var(a) = $var(d) + "/x1:deliveryAddress/x1:ipAddressAndPort";
	$var(fam) = "IPv4Address";
	$var(ip) = $xml(x1=>xpath:$var(a)/c:address/c:IPv4Address/text());
	if($var(ip) == "") {
		$var(fam) = "IPv6Address";
		$var(ip) = $xml(x1=>xpath:$var(a)/c:address/c:IPv6Address/text());
	}
	$var(proto) = "TCPPort";
	$var(port) = $xml(x1=>xpath:$var(a)/c:port/c:TCPPort/text());
	if($var(port) == "") {
		$var(proto) = "UDPPort";
		$var(port) = $xml(x1=>xpath:$var(a)/c:port/c:UDPPort/text());
	}
	if($var(ip) == "" || $var(port) == "") {
		$var(ecode) = 6020;
		$var(edesc) = "only ipAddressAndPort";
		return;
	}
	if(!($var(ip) =~ "^[0-9a-f.:]+$") || !($var(port) =~ "^[0-9]{1,5}$")
			|| $(var(port){s.int}) > 65535) {
		$var(ecode) = 1010;
		$var(edesc) = "deliveryAddress is not an address and port";
		return;
	}

	if($var(proto) == "UDPPort") {
		$var(daddr) = "udp:";
	} else {
		$var(daddr) = "tcp:";
	}
	if($var(fam) == "IPv6Address") {
		$var(daddr) = $var(daddr) + "[" + $var(ip) + "]:" + $var(port);
	} else {
		$var(daddr) = $var(daddr) + $var(ip) + ":" + $var(port);
	}

	$var(ddet) = "<dId>" + $var(did) + "</dId>";
	$var(e) = $xml(x1=>xpath:$var(d)/x1:friendlyName/text());
	if($var(e) != "") {
		route(X1_ESC);
		$var(ddet) = $var(ddet) + "<friendlyName>" + $var(e) + "</friendlyName>";
	}
	$var(ddet) = $var(ddet) + "<deliveryType>" + $var(dtype) + "</deliveryType>"
		+ "<deliveryAddress><ipAddressAndPort>"
		+ "<etsi103280:address><etsi103280:" + $var(fam) + ">" + $var(ip)
		+ "</etsi103280:" + $var(fam) + "></etsi103280:address>"
		+ "<etsi103280:port><etsi103280:" + $var(proto) + ">" + $var(port)
		+ "</etsi103280:" + $var(proto) + "></etsi103280:port>"
		+ "</ipAddressAndPort></deliveryAddress>";
}

route[X1_CREATE_DEST] {
	route(X1_DEST_PARSE);
	if($var(ecode) != 0) {
		return;
	}
	if($sht(x1dtyp=>$var(did)) != $null) {
		$var(ecode) = 2030;
		$var(edesc) = $var(did);
		return;
	}
	$sht(x1dest=>$var(did)) = $var(ddet);
	$sht(x1dtyp=>$var(did)) = $var(dtype);
	$sht(x1daddr=>$var(did)) = $var(daddr);
	$var(body) = "<oK>AcknowledgedAndCompleted</oK>";
}

# 6.3.2: the request carries the whole Destination, which replaces the old
# one. Its deliveryType stays while Tasks use it: one of them could be left
# with nowhere to deliver to
route[X1_MODIFY_DEST] {
	route(X1_DEST_PARSE);
	if($var(ecode) != 0) {
		return;
	}
	if($sht(x1dtyp=>$var(did)) == $null) {
		$var(ecode) = 2040;
		$var(edesc) = $var(did);
		return;
	}
	if($sht(x1dtyp=>$var(did)) != $var(dtype)) {
		route(X1_DEST_USERS);
		if($var(users) != "") {
			$var(ecode) = 6001;
			$var(edesc) = "deliveryType of a Destination in use by" + $var(users);
			return;
		}
	}
	$sht(x1dest=>$var(did)) = $var(ddet);
	$sht(x1dtyp=>$var(did)) = $var(dtype);
	$sht(x1daddr=>$var(did)) = $var(daddr);
	$var(body) = "<oK>AcknowledgedAndCompleted</oK>";
}

# 6.3.3: only a Destination no Task uses
route[X1_REMOVE_DEST] {
	$var(did) = $xml(x1=>xpath:$var(m)/x1:dId/text());
	$var(u) = $var(did);
	route(X1_UUID);
	if($var(ok) == 0) {
		$var(ecode) = 1010;
		$var(edesc) = "dId is not a UUID";
		return;
	}
	$var(id) = " " + $var(did);
	if($sht(x1dtyp=>$var(did)) == $null) {
		$var(ecode) = 2040;
		$var(edesc) = $var(did);
		return;
	}
	route(X1_DEST_USERS);
	if($var(users) != "") {
		$var(ecode) = 7010;
		$var(edesc) = "in use by" + $var(users);
		return;
	}
	$sht(x1dest=>$var(did)) = $null;
	$sht(x1dtyp=>$var(did)) = $null;
	$sht(x1daddr=>$var(did)) = $null;
	$var(body) = "<oK>AcknowledgedAndCompleted</oK>";
}

# 6.3.4: enabled unless agreed otherwise, and refused while any Destination
# is in use - every Task uses one
route[X1_REMOVE_ALL_DEST] {
	$var(users) = "";
	sht_iterator_start("x1it", "x1tdid");
	while(sht_iterator_next("x1it")) {
		$var(users) = $var(users) + " " + $shtitkey(x1it);
	}
	sht_iterator_end("x1it");
	if($var(users) != "") {
		$var(ecode) = 8010;
		$var(edesc) = "Destinations in use by" + $var(users);
		return;
	}
	sht_reset("x1dest");
	sht_reset("x1dtyp");
	sht_reset("x1daddr");
	$var(body) = "<oK>AcknowledgedAndCompleted</oK>";
}

# The XIDs of the Tasks that deliver to $var(did), into $var(users)
route[X1_DEST_USERS] {
	$var(users) = "";
	$var(r) = ";" + $var(did) + ";";
	sht_iterator_start("x1it", "x1tdid");
	while(sht_iterator_next("x1it")) {
		if($shtitval(x1it) =~ $var(r)) {
			$var(users) = $var(users) + " " + $shtitkey(x1it);
		}
	}
	sht_iterator_end("x1it");
}

route[X1_GET_DEST] {
	$var(did) = $xml(x1=>xpath:$var(m)/x1:dId/text());
	$var(u) = $var(did);
	route(X1_UUID);
	if($var(ok) == 0) {
		$var(ecode) = 1010;
		$var(edesc) = "dId is not a UUID";
		return;
	}
	$var(id) = " " + $var(did);
	if($sht(x1dest=>$var(did)) == $null) {
		$var(ecode) = 2040;
		$var(edesc) = $var(did);
		return;
	}
	$var(ddet) = $sht(x1dest=>$var(did));
	route(X1_DEST_RESP);
	$var(body) = $var(drd);
}

# <destinationResponseDetails> for $var(ddet), into $var(drd)
route[X1_DEST_RESP] {
	$var(drd) = "<destinationResponseDetails><destinationDetails>" + $var(ddet) + "</destinationDetails>"
		+ "<destinationStatus><destinationDeliveryStatus>activeAndWorking</destinationDeliveryStatus>"
		+ "<listOfFaults/></destinationStatus></destinationResponseDetails>";
}

route[X1_ALL_DESTS] {
	$var(dests) = "";
	sht_iterator_start("x1it", "x1dest");
	while(sht_iterator_next("x1it")) {
		$var(ddet) = $shtitval(x1it);
		route(X1_DEST_RESP);
		$var(dests) = $var(dests) + $var(drd);
	}
	sht_iterator_end("x1it");
}

#!define X2_IRIPOI
# LI_X2 (TS 33.128 7.12.4): the IRI-POI of the CSCF. Every SIP message of an
# intercepted communication goes as an IMSMessage xIRI to the X2 Destinations
# of each Task it is intercepted for. Which CSCFs report a target is the
# LIPF's to choose, by which of them it tasks (TS 33.128 7.12.3.2.1); each
# reports what crosses it.
#
# A communication is intercepted when its initial request matches a Task's
# target (7.12.2.8.2). Each config tells the session case of a request in
# $var(x2side): "o" when its user - the served one, the home one at the IBCF
# - originates it, "t" when it terminates at that user. An IMPU Task matches
# that user: the P-Asserted-Identity (the one this P-CSCF asserts, at the
# P-CSCF) or the From of an originating request, the Request-URI or the To of
# a terminating one. A non-local one (nonLocalIdentifier NonLocal) matches the
# other party: the Request-URI or the To of an originating request, the
# P-Asserted-Identity or the From of a terminating one. An IMPI or IMEI Task
# matches a REGISTER (From, To, Authorization username, +sip.instance IMEI),
# and the sessions of the IMPUs registered with it: the S-CSCF finds the IMPI
# of a served IMPU in usrloc (X2_USRLOC), the P-CSCF learns the IMPUs from the
# P-Associated-URI of the 200 OK to the REGISTER. The E-CSCF and the IBCF see
# no REGISTER, so only IMPU Tasks match there. An IMPU Task matches that IMPU
# and no other of the subscription: tel:+359000000001 is not
# sip:359000000001@ims... (only sip:+359000000001@...;user=phone is), so a
# whole subscription is the IMPI's Task, or one Task per IMPU.
#
# The CSCF keeps the Call-ID (x2call), and reports from then on every request
# and reply of it it receives, and every reply it makes. A request that
# crosses a CSCF twice - the S-CSCF, once per session case or on its way back
# from an AS - is reported each time.
#
# Not reported: the requests a CSCF makes itself (the S-CSCF's reg-event
# NOTIFY, a BYE for a dialog it ends), StartOfInterceptionForActiveIMSSession
# for a Task that starts on a call in progress, and the session-independent
# matches on the SMS TP-DA/TP-OA (7.12.2.8.2.3).

loadmodule "x2"
modparam("x2", "nfid", SERVER)

# Call-ID -> ;XID:case; of the Tasks it is intercepted for. The case: o the
# target originated it, t it terminates at the target, c both
modparam("htable", "htable", "x2call=>size=10;autoexpire=7200;")
# Call-ID -> the From tag of its first request: which party sent a request
modparam("htable", "htable", "x2ftag=>size=10;autoexpire=7200;")
# impi:IMPI -> ;XID; of the IMEI Tasks that IMPI registered from (S-CSCF);
# impu:IMPU -> ;XID; of the IMPI and IMEI Tasks whose registration holds
# that IMPU (P-CSCF)
modparam("htable", "htable", "x2reg=>size=8;autoexpire=86400;")
# Call-ID -> ;XID; of the IMPI and IMEI Tasks its REGISTER matched, until
# the 200 OK names the IMPUs
modparam("htable", "htable", "x2regc=>size=8;autoexpire=300;")

onreply_route {
	# A 100 is the next hop's, not the other party's
	if($rs == 100) {
		return;
	}
	if($rs == 200 && $rm == "REGISTER" && $sht(x2regc=>$ci) != $null) {
		route(X2_REGISTERED);
	}
	$var(x2rpl) = 1;
	route(X2_REPORT);
}

# A REGISTER, from the target (7.12.2.8.2.1)
route[X2_REGISTER] {
	$var(x2rpl) = 0;
	if($shtcn(x1tx2=>**) > 0) {
		$var(x2hits) = ";";
		$var(x2s) = "o";
		$var(x2kind) = "impu";
		$var(uri) = $fu;
		route(X2_MATCH_IMPU);
		$var(uri) = $tu;
		route(X2_MATCH_IMPU);
		if($aU != $null) {
			route(X2_REGISTER_IMPI);
		}
		route(X2_TRACK);
		if($sht(x2call=>$ci) != $null) {
			# every REGISTER is the UE's, whatever its From tag
			$sht(x2ftag=>$ci) = $ft;
		}
	}
	route(X2_REPORT);
}

# The IMPI and IMEI Tasks of a REGISTER. Their XIDs go with the IMPI
# (x2reg, for the S-CSCF's usrloc lookup) when an IMEI matched, and with the
# Call-ID (x2regc) until the 200 OK names the IMPUs (for the P-CSCF)
route[X2_REGISTER_IMPI] {
	$var(x2impi) = $aU;
	$var(x2xids) = ";";
	$var(x2key) = "impi:" + $var(x2impi);
	route(X2_MATCH_KEY);
	if($sht(x1tgt=>$var(x2key)) != $null) {
		$var(x2l) = $sht(x1tgt=>$var(x2key));
		route(X2_ADDL);
	}
	if(is_present_hf("Contact")) {
		$var(x2imei) = $(hdr(Contact){re.subst,/.*urn:gsma:imei:([0-9]{8})-([0-9]{6}).*/\1\2/});
		$var(x2key) = "imei:" + $var(x2imei);
		if($var(x2imei) =~ "^[0-9]{14}$" && $sht(x1tgt=>$var(x2key)) != $null) {
			route(X2_MATCH_KEY);
			$var(x2l) = $sht(x1tgt=>$var(x2key));
			$var(x2save) = $var(x2xids);
			$var(x2key) = "impi:" + $var(x2impi);
			$var(x2xids) = ";";
			if($sht(x2reg=>$var(x2key)) != $null) {
				$var(x2xids) = $sht(x2reg=>$var(x2key));
			}
			route(X2_ADDL);
			$sht(x2reg=>$var(x2key)) = $var(x2xids);
			$var(x2xids) = $var(x2save);
			route(X2_ADDL);
		}
	}
	if($var(x2xids) != ";") {
		$sht(x2regc=>$ci) = $var(x2xids);
	}
}

# The 200 OK to a REGISTER that matched an IMPI or IMEI Task: the IMPUs of
# its implicit registration set (P-Associated-URI, one header or a list) are
# the target's
route[X2_REGISTERED] {
	$var(x2l) = $sht(x2regc=>$ci);
	$var(x2i) = 0;
	while($var(x2i) < 8 && $(hdr(P-Associated-URI)[$var(x2i)]) != $null) {
		$var(x2h) = $(hdr(P-Associated-URI)[$var(x2i)]{re.subst,/,/|/g});
		$var(x2n) = $(var(x2h){s.count,|}) + 1;
		$var(x2q) = 0;
		while($var(x2q) < $var(x2n) && $var(x2q) < 16) {
			$var(uri) = $(var(x2h){s.select,$var(x2q),|}{s.trim}{nameaddr.uri});
			route(X1_IMPU_KEY);
			$var(x2key) = "impu:" + $var(ikey);
			$var(x2xids) = ";";
			if($sht(x2reg=>$var(x2key)) != $null) {
				$var(x2xids) = $sht(x2reg=>$var(x2key));
			}
			route(X2_ADDL);
			$sht(x2reg=>$var(x2key)) = $var(x2xids);
			$var(x2q) = $var(x2q) + 1;
		}
		$var(x2i) = $var(x2i) + 1;
	}
}

# A request in the session case $var(x2side). An initial one is matched
# (7.12.2.8.2.2); then the request is reported for every Task its Call-ID
# is intercepted for.
route[X2_REQUEST] {
	$var(x2rpl) = 0;
	if(!has_totag() && !is_method("ACK|CANCEL") && $shtcn(x1tx2=>**) > 0) {
		$var(x2hits) = ";";
		# the user: IMPU Tasks
		$var(x2kind) = "impu";
		$var(x2s) = $var(x2side);
		if($var(x2side) == "o") {
			route(X2_CALLING);
		} else {
			route(X2_CALLED);
		}
		# the other party: non-local Tasks
		$var(x2kind) = "nonlocal";
		if($var(x2side) == "o") {
			$var(x2s) = "t";
			route(X2_CALLED);
		} else {
			$var(x2s) = "o";
			route(X2_CALLING);
		}
		route(X2_TRACK);
	}
	route(X2_REPORT);
}

# The calling party: the identity this P-CSCF asserted ($avp(asserted)), or
# the P-Asserted-Identity the request came with, and the From
route[X2_CALLING] {
	if($avp(asserted) != $null) {
		$var(uri) = $(avp(asserted){nameaddr.uri});
		route(X2_MATCH_IMPU);
		route(X2_IMPI);
	} else {
		$var(x2i) = 0;
		while($var(x2i) < 4 && $(hdr(P-Asserted-Identity)[$var(x2i)]) != $null) {
			$var(uri) = $(hdr(P-Asserted-Identity)[$var(x2i)]{nameaddr.uri});
			route(X2_MATCH_IMPU);
			# the served user: the first identity asserted
			if($var(x2i) == 0) {
				route(X2_IMPI);
			}
			$var(x2i) = $var(x2i) + 1;
		}
	}
	$var(uri) = $fu;
	route(X2_MATCH_IMPU);
}

# The called party: the Request-URI, the served user, the To, and the
# P-Called-Party-ID the S-CSCF puts in, where the Request-URI is the UE's
# contact already (the P-CSCF)
route[X2_CALLED] {
	$var(uri) = $ru;
	route(X2_MATCH_IMPU);
	route(X2_IMPI);
	$var(uri) = $tu;
	route(X2_MATCH_IMPU);
	if(is_present_hf("P-Called-Party-ID")) {
		$var(uri) = $(hdr(P-Called-Party-ID){nameaddr.uri});
		route(X2_MATCH_IMPU);
	}
}

# The Tasks matched ($var(x2hits)) added to the Call-ID's (x2call), service
# scoping applied. A Task that is both the caller and the called becomes c.
route[X2_TRACK] {
	if($var(x2hits) == ";") {
		return;
	}
	$var(x2cur) = ";";
	if($sht(x2call=>$ci) != $null) {
		$var(x2cur) = $sht(x2call=>$ci);
	}
	$var(x2n) = $(var(x2hits){s.count,;});
	$var(x2k) = 1;
	while($var(x2k) < $var(x2n)) {
		$var(x2e) = $(var(x2hits){s.select,$var(x2k),;});
		$var(x2k) = $var(x2k) + 1;
		$var(x2x) = $(var(x2e){s.select,0,:});
		$var(x2c) = $(var(x2e){s.select,1,:});
		# Service scoping (7.12.3.2.1): a voice Task is not told of a
		# MESSAGE, nor a messaging one of an INVITE
		$var(x2in) = 1;
		if($sht(x1tsvc=>$var(x2x)) != $null) {
			if(is_method("INVITE") && !($sht(x1tsvc=>$var(x2x)) =~ ";voice;")) {
				$var(x2in) = 0;
			}
			if(is_method("MESSAGE") && !($sht(x1tsvc=>$var(x2x)) =~ ";messaging;")) {
				$var(x2in) = 0;
			}
		}
		if($var(x2in) == 1) {
			if(!($var(x2cur) =~ ";" + $var(x2x) + ":")) {
				$var(x2cur) = $var(x2cur) + $var(x2e) + ";";
			} else if(!($var(x2cur) =~ ";" + $var(x2e) + ";")) {
				# the target calling itself
				$var(x2o) = ";" + $var(x2x) + ":o;";
				$var(x2t) = ";" + $var(x2x) + ":t;";
				$var(x2e) = ";" + $var(x2x) + ":c;";
				$var(x2cur) = $(var(x2cur){s.replace,$var(x2o),$var(x2e)}{s.replace,$var(x2t),$var(x2e)});
			}
		}
	}
	if($var(x2cur) == ";") {
		return;
	}
	$sht(x2call=>$ci) = $var(x2cur);
	if($sht(x2ftag=>$ci) == $null) {
		$sht(x2ftag=>$ci) = $ft;
	}
}

# The Tasks on the identity $var(uri), of the kind $var(x2kind) ("impu" or
# "nonlocal"), added to $var(x2hits) with the case $var(x2s)
route[X2_MATCH_IMPU] {
	route(X1_IMPU_KEY);
	$var(x2key) = $var(x2kind) + ":" + $var(ikey);
	route(X2_MATCH_KEY);
	# an IMPU registered with an IMPI or IMEI Task's identity
	if($var(x2kind) == "impu" && $sht(x2reg=>$var(x2key)) != $null) {
		$var(x2l) = $sht(x2reg=>$var(x2key));
		route(X2_ADD);
	}
}

# The Tasks on the target key $var(x2key), added to $var(x2hits)
route[X2_MATCH_KEY] {
	if($sht(x1tgt=>$var(x2key)) == $null) {
		return;
	}
	$var(x2l) = $sht(x1tgt=>$var(x2key));
	route(X2_ADD);
}

# ;XID;XID; in $var(x2l) added to $var(x2hits) as XID:$var(x2s), each XID
# once
route[X2_ADD] {
	$var(x2m) = $(var(x2l){s.count,;});
	$var(x2j) = 1;
	while($var(x2j) < $var(x2m)) {
		$var(x2y) = $(var(x2l){s.select,$var(x2j),;});
		if($var(x2y) != "" && !($var(x2hits) =~ ";" + $var(x2y) + ":")) {
			$var(x2hits) = $var(x2hits) + $var(x2y) + ":" + $var(x2s) + ";";
		}
		$var(x2j) = $var(x2j) + 1;
	}
}

# ;XID;XID; in $var(x2l) added to the list $var(x2xids), each once
route[X2_ADDL] {
	$var(x2m) = $(var(x2l){s.count,;});
	$var(x2j) = 1;
	while($var(x2j) < $var(x2m)) {
		$var(x2y) = $(var(x2l){s.select,$var(x2j),;});
		if($var(x2y) != "" && !($var(x2xids) =~ ";" + $var(x2y) + ";")) {
			$var(x2xids) = $var(x2xids) + $var(x2y) + ";";
		}
		$var(x2j) = $var(x2j) + 1;
	}
}

# The Tasks on the IMPI the IMPU $var(uri) is registered with, at the S-CSCF:
# an IMPI Task, or an IMEI one that IMPI registered from. A usrloc lookup, so
# only while there is such a Task
route[X2_IMPI] {
	if($var(x2kind) != "impu") {
		return;
	}
#!ifdef X2_USRLOC
	if($shtcn(x1tgt=>%~impi:) == 0 && $shtcn(x2reg=>%~impi:) == 0) {
		return;
	}
	if(!reg_fetch_contacts("location", "$var(uri)", "x2")) {
		return;
	}
	$var(x2key) = "impi:" + $ulc(x2=>impi);
	reg_free_contacts("x2");
	route(X2_MATCH_KEY);
	if($sht(x2reg=>$var(x2key)) != $null) {
		$var(x2l) = $sht(x2reg=>$var(x2key));
		route(X2_ADD);
	}
#!endif
}

# The request ($var(x2rpl) 0) or reply (1) at hand, for each Task of its
# Call-ID. A request from the party that sent the first one comes from the
# target in the originating case and goes to it in the terminating one; one
# from the other party the other way, and a reply the other way from its
# request. Both ways (4) when the target called itself.
route[X2_REPORT] {
	if($sht(x2call=>$ci) == $null) {
		return;
	}
	$var(x2l) = $sht(x2call=>$ci);
	$var(x2ft) = $sht(x2ftag=>$ci);
	# kept while the dialog goes on
	$sht(x2call=>$ci) = $var(x2l);
	$sht(x2ftag=>$ci) = $var(x2ft);
	$var(x2fwd) = 0;
	if($ft == $var(x2ft)) {
		$var(x2fwd) = 1;
	}
	if($var(x2rpl) == 1) {
		$var(x2fwd) = 1 - $var(x2fwd);
	}
	$var(x2n) = $(var(x2l){s.count,;});
	$var(x2k) = 1;
	while($var(x2k) < $var(x2n)) {
		$var(x2e) = $(var(x2l){s.select,$var(x2k),;});
		$var(x2x) = $(var(x2e){s.select,0,:});
		$var(x2c) = $(var(x2e){s.select,1,:});
		if($var(x2c) == "c") {
			$var(x2pdir) = 4;
			$var(x2sdir) = 3;
		} else if($var(x2c) == "o") {
			$var(x2sdir) = 1;
			$var(x2pdir) = 2 + $var(x2fwd);
		} else {
			$var(x2sdir) = 2;
			$var(x2pdir) = 3 - $var(x2fwd);
		}
		route(X2_SEND);
		$var(x2k) = $var(x2k) + 1;
	}
}

# The message at hand for Task $var(x2x), with Payload Direction $var(x2pdir) and
# SessionDirection $var(x2sdir), to the Task's X2 Destinations
route[X2_SEND] {
	# gone, or X3 only
	if($sht(x1tx2=>$var(x2x)) == $null) {
		return;
	}
	$var(x2pxid) = $sht(x1tx2=>$var(x2x));
	$var(x2mat) = $sht(x1tmat=>$var(x2x));
	$var(x2dl) = $sht(x1tdid=>$var(x2x));
	$var(x2dests) = "";
	$var(x2m) = $(var(x2dl){s.count,;});
	$var(x2j) = 1;
	while($var(x2j) < $var(x2m)) {
		$var(x2d) = $(var(x2dl){s.select,$var(x2j),;});
		if($sht(x1daddr=>$var(x2d)) != $null && $sht(x1dtyp=>$var(x2d)) != "X3Only") {
			$var(x2dests) = $var(x2dests) + " " + $sht(x1daddr=>$var(x2d));
		}
		$var(x2j) = $var(x2j) + 1;
	}
	if($var(x2dests) == "") {
		return;
	}
	x2_ims_message("$var(x2dests)", "$var(x2pxid)", "", "$var(x2pdir)", "$var(x2sdir)", "$var(x2mat)");
}



#!endif
