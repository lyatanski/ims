#!KAMAILIO
# Interrogating Call Session Control Function (I-CSCF)
# Diameter Cx: 3GPP TS 29.229

#!defenvs DBURL
#!defexps DB_URL "redis://" + DBURL
#!defenvs REALM
#!defexps SERVER    "icscf.ims." + REALM
#!defexps EPC_REALM "epc." + REALM
#!define HEALTH cdp_has_app("16777216")

#listen = [::]:5060 advertise SERVER name "Mw"
listen = 0.0.0.0:5060 advertise SERVER name "Mw"
user_agent_header = "User-Agent: Interrogating-CSCF"
server_header = "Server: Interrogating-CSCF"
children = 4
shm_mem_size = 256

loadmodule "tm"
loadmodule "pv"
loadmodule "sl"
loadmodule "cdp"
loadmodule "cdp_avp"
loadmodule "db_redis"
loadmodule "ims_icscf"
loadmodule "textops"

include_file "common.cfg"

modparam("cdp", "config_file", "/etc/cscf/diameter.xml")
modparam("ims_icscf", "db_url", DB_URL)
modparam("db_redis", "schema_path", "/etc/cscf/schema/interrogating")
modparam("db_redis", "keys", "s_cscf=entry:name")

# Re-read the s_cscf candidate table when a UAA leaves the S-CSCF choice to us
# (patch 0007); without this the table is whatever it was at startup. The
# S-CSCF republishes its row on every health probe with a 10s TTL
# (serving.cfg route[CAP]), so the table tracks liveness on that timescale and
# there is no point re-reading it faster.
modparam("ims_icscf", "scscf_reload_interval", 10)

# Diameter Cx: User-Authorization-Request (UAR) & Location-Info-Request (LIR)
modparam("ims_icscf", "cxdx_dest_realm", EPC_REALM)           # Destination-Realm AVP

request_route {
	if(is_method("REGISTER")) route(REGISTER);

	if(is_method("INVITE|SUBSCRIBE|MESSAGE|INFO|PUBLISH|CANCEL")) {
		I_perform_location_information_request("LIA", "0");
	} else {
		xerr("Misconfiguration! Method '$rm' not allowed at the I-CSCF\n");
		append_to_reply("Allow: INVITE,SUBSCRIBE,MESSAGE,INFO,PUBLISH,CANCEL\r\n");
		send_reply("406","Initial Request Method not allowed at the I-CSCF");
	}
}

route[REGISTER] {
	if(I_scscf_select("0")) {
		# S-CSCF list exist, no need to do a UAR
		route(RELAY);
	} else {
		# no S-CSCF list therefore must do UAR
		# free this from the failed I_scscf_select call
		I_scscf_drop();

		# Asynchronous UAR
		# 0=do not request capabilities; 1=request capabilities
		if(!I_perform_user_authorization_request("UAA", "0")) {
			send_reply("500", "Error in Request");
		}
	}
	exit;
}

# Diameter: User-Authorization-Answer (UAA)
#     user authorization and S-CSCF URI discovery
#
# The reply below is not what a UE sees for a Cx failure the HSS could
# classify. ims_icscf answers those itself, from inside the Diameter callback
# and before this route is reached -- 403 for an unknown user off a UAA, 604
# off an LIA, 480 for an identity registered nowhere, 500 for a result code it
# cannot map. That reply is final, so the t_continue() that would run this
# route finds the transaction already completed, logs "active transaction not
# found", and the route never executes at all.
#
# So a code other than 1 reaching here is always -2, the default created before
# the transaction was suspended and left untouched by the callback's error path
# -- a Cx timeout, a CDP transport failure, a transaction that could not be
# looked up again. Nothing has replied in that case, which is what this is for.
#
# Worth knowing when reading a failed call: which of those the UE actually sees
# depends on the HSS image. Stock open5gs answers an LIR for an identity it does
# not have with Experimental-Result-Code 2004, and ims_icscf maps 5001, 5003 and
# 2003 only -- so 2004 takes its default branch and the UE gets
# "500 Forbidden - HSS responded with unknown Experimental Result Code" instead
# of 604. images/open5gs/patches/0001-* is what makes it answer 5001 for an
# unknown identity and 5003 for a known but unregistered one; against an HSS
# built without that patch, expect the 500.
route[UAA] {
	xinfo("UAR return code: $avp(s:uaa_return_code)\n");
	if($avp(s:uaa_return_code) != 1) {
		send_reply("500", "UAR failed");
		exit;
	}

	route(SELECT);
}

# Diameter: Location-Info-Answer (LIA)
#     request routing information - S-CSCF URI
# Same contract as route[UAA] above: only 1 and -2 ever get here.
route[LIA] {
	xinfo("LIR return code: $avp(lia_return_code)\n");
	if($avp(lia_return_code) != 1) {
		send_reply("500", "LIR failed");
		exit;
	}

	route(SELECT);
}

route[SELECT] {
	if(!I_scscf_select("0")) {
		# select failed
		I_scscf_drop();
		send_reply("500", "Server error on SCSCF Select (UAR)");
		exit;
	}

	route(RELAY);
}

route[RELAY] {
	# now relay to appropriate SCSCF
	if(!t_relay()) {
		send_reply_error();
	}
}
