#		exit;
#	}

	# Reply to OPTIONS:
	if(is_method("OPTIONS") && (uri==myself)) {
		options_reply();
		exit;
	}

	# Ignore Re-Transmits:
	if(t_lookup_request()) {
		exit;
	}
}
