#loadmodule "maxfwd"

loadmodule "siputils"
loadmodule "sanity"
# ruri_sip_version (1), ruri_scheme (2), required_headers (4), cseq_method (32), cseq_value (64), content_length (128), expires_value (256), proxy_require (512), digest credentials (2048)
modparam("sanity", "default_checks", 1511)
# Request URI (1), From URI (2) and To URI (4). Additionally the Contact URI can be also checked (8)
modparam("sanity", "uri_checks", 7)
modparam("sanity", "autodrop", 1)
modparam("sanity", "noreply", 1)

loadmodule "xlog"
modparam("xlog", "prefix", "[$ci $rm-$cs] ")
modparam("xlog", "prefix_mode", 1)

# cfgtrace logs one L_NOTICE line per config action executed — every `if`,
# every route() and every module call, for every message. It is the right tool
# for reading a single flow and the wrong one to leave on: at 900 registering
# subscribers the three CSCFs together wrote 246k lines in a 17-second run,
# each one formatted, written down a pipe to the docker daemon and tailed back
# out of it by Fluent Bit — enough, on a 4-core host, to be a material share of
# the CPU the signalling plane is competing for (see PERF-ANALYSIS.md).
#
# So it is opt-in now. Set CFGTRACE on the service to get it back:
#
#     environment:
#       CFGTRACE: 1
#
# and note it is per-role — tracing just the one CSCF under investigation costs
# a third of what tracing all three does.
#!trydefenvs CFGTRACE
#!ifdef CFGTRACE
loadmodule "debugger"
modparam("debugger", "cfgtrace", 1)
modparam("debugger", "log_level", 1) # L_NOTICE
#!endif

import_file "monitor.cfg"

## 3GPP TS 24.229 4.2A -> RFC 3261 18.1.1 Sending Requests
## If a request is within 200 bytes of the path MTU, or if it is larger
## than 1300 bytes and the path MTU is unknown, the request MUST be sent
## using an RFC 2914 congestion controlled transport protocol, such as TCP.
#udp_mtu = 1300
#udp_mtu_try_proto = TCP

route[INIT] {
#	if(!maxfwd_process("70")) {
