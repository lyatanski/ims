#!KAMAILIO
# common CSCF settings

#!define DEBUG 3
debug = DEBUG

loadmodule "maxfwd"
loadmodule "siputils"
loadmodule "sanity"
# ruri_sip_version (1), ruri_scheme (2), required_headers (4), cseq_method (32),
# cseq_value (64), content_length (128), expires_value (256), parse_uris (1024).
# Not digest credentials (2048): the initial REGISTER of an IMS UE carries an
# empty nonce and response (TS 24.229 5.1.1.2.1), which that check rejects
modparam("sanity", "default_checks", 1511)
# Request URI (1), From URI (2) and To URI (4). Additionally the Contact URI can be also checked (8)
modparam("sanity", "uri_checks", 7)
# RFC 3261 16.3: a request that fails validation is answered as a UAS would,
# with an error code, and goes no further
modparam("sanity", "autodrop", 1)
modparam("sanity", "noreply", 0)

loadmodule "xlog"
modparam("xlog", "prefix", "[$ci $rm-$cs] ")
modparam("xlog", "prefix_mode", 1)

#!ifexp DEBUG >= 3
loadmodule "debugger"
modparam("debugger", "cfgtrace", 1)
modparam("debugger", "log_level", 2) # L_INFO
#!endif

import_file "monitor.cfg"

# 3GPP TS 24.229 4.2A -> RFC 3261 18.1.1 Sending Requests
# If a request is within 200 bytes of the path MTU, or if it is larger
# than 1300 bytes and the path MTU is unknown, the request MUST be sent
# using an RFC 2914 congestion controlled transport protocol, such as TCP.
# Requests only: a response goes back over the transport its request came on
udp_mtu = 1300
udp_mtu_try_proto = TCP

# RFC 3261 16.3 request validation, before anything else looks at the request
route[INIT] {
	# 1. reasonable syntax, 2. URI scheme (416): answered by the module
	sanity_check();

	# Ahead of the Max-Forwards check: an OPTIONS for this element may be
	# answered whatever its Max-Forwards. One for a user (a capability query)
	# is not, and goes on like any other request
	if(is_method("OPTIONS") && uri==myself && $rU==$null) {
		options_reply();
		exit;
	}

	# 3. Max-Forwards, and 16.6 step 3: decremented, or 70 added if missing.
	# What bounds a loop: kamailio has no 16.3 step 4 loop detection
	if(!maxfwd_process("70")) {
		if($rc == -1) {
			send_reply("483", "Too Many Hops");
		} else {
			send_reply("400", "Bad Request - Max-Forwards");
		}
		exit;
	}

	# A retransmission gets the transaction's last reply again, and an ACK to
	# a negative reply ends its transaction; either way the script stops here
	if(!is_method("CANCEL")) {
		t_check_trans();
	}
}
