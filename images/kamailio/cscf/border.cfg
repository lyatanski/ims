#!KAMAILIO
# Interconnection Border Control Function (IBCF)
# Stage 2: 3GPP TS 23.228 4.14 and Annex I; stage 3: TS 24.229 5.10
#
# The network's entry and exit point on Ici, the signalling half of the II-NNI
# (TS 23.228 Annex K). Which side a request arrived on decides the role: from
# a peer it is the entry point (5.10.3), from inside the network the exit
# point (5.10.2). What it does on the way:
#
#   - refuses a source it has no agreement with, and floods from one it has
#   - hides this network's topology from the peer (5.10.4)
#   - screens headers and bodies at the trust-domain boundary (5.10.6, 4.4)
#     and applies privacy there (5.10.8)
#   - anchors the media on the TrGW, rtpengine over the equivalent of Ix
#     (Annex I.3.1), and releases the call when the media dies (5.10.2.4)
#   - writes a CDR per call (TS 32.260 IBCF CDR, here as log lines)
#
# Not done: roaming registration through it (REGISTER is refused, as the
# Path and Service-Route hiding it would need is not there), transcoding,
# STIR/SHAKEN, OMR, transit routing.

#!defenvs REALM
#!defexps SERVER "ibcf.ims." + REALM
# This IBCF's address on Ici, unquoted for the listen line and quoted for the
# comparisons, and the Ici network's prefix
#!defenv ICI
#!defenvs ICIADDR=ICI
#!defenvs ICINET
#!defexps PING_FROM "sip:ibcf@" + ICIADDR
# Where a request from a peer goes (5.10.3.2 4): the I-CSCF
#!defexps ICSCF "sip:icscf.ims." + REALM
# Where an emergency request from a peer goes (5.10.3.2 2C); without it, to
# the I-CSCF like any other
#!trydefenvs ECSCF
# rtpengine's ng socket: the TrGW
#!defenvs RTPADR
# The interconnects, whitespace-separated <match>=<set> entries mapping a
# destination to a dispatcher set in peers.list:
#   <match>  a Request-URI domain, an E.164 prefix ("+44"), or "*" for the
#            rest; the longest matching prefix wins
#   <set>    the set: the peer network's entry points, tried in priority order
# e.g. "ims.mnc002.mcc001.3gppnetwork.org=1 +44=1 *=2"
#!defenvs ROUTES
# The topology hiding key. Anything that keeps the masked headers this IBCF
# wrote decodable is fine, as long as every replica of it has the same one
#!trydefenvs THKEY
#!ifndef THKEY
#!define THKEY "ibcf"
#!endif
# Bodies a request may carry across, by MIME type (5.10.6.3 2), and how
# large (5.10.6.3 1). A multipart body is checked part by part
#!trydefenvs BODIES
#!ifndef BODIES
#!define BODIES "application/sdp|application/3gpp-ims\+xml|application/vnd[.]3gpp[.]sms|application/pidf\+xml|application/vnd[.]etsi[.]pstn\+xml|message/sipfrag|multipart/(mixed|related|alternative)|text/plain"
#!endif
#!defexps BODY_RE "^(" + BODIES + ")([;[:space:]]|$)"
#!trydefenv MAXBODY
#!ifndef MAXBODY
#!define MAXBODY 16384
#!endif
# The longest a call may last (5.10.2.2: periodic refresh "to avoid hung
# states"): the dialog ends with a BYE to both sides when it runs out
#!trydefenv DLGTIMEOUT
#!ifndef DLGTIMEOUT
#!define DLGTIMEOUT 7200
#!endif
# The node names Server and User-Agent give away (23.228 4.14: "capabilities
# of S-CSCFs")
#!define CORE_UA_RE "-(CSCF|AS)$"
#!define FLT_ACC 1
# Healthy once the peers are loaded
#!define HEALTH ds_list_exists("1")
#!define MONITOR_DENY route(FROM_ICI)
#!define SOS_INIT route(ROUTESLOAD);

# Mx, inside the network, on every address; Ici on its own. A socket bound to
# the Ici address is more specific than the wildcard one, so what arrives
# there arrives on it, and $Rn tells the sides apart. One socket per address
# family on Mx: a [::] socket without IPV6_V6ONLY, which kamailio never sets,
# also claims the IPv4 port, so the TCP pair only binds side by side with
# SO_REUSEPORT (tcp_reuse_port)
listen = 0.0.0.0:5060 advertise SERVER name "Mx"
listen = [::]:5060 advertise SERVER name "Mx6"
listen = udp:ICI:5060 name "Ici"
listen = tcp:ICI:5060 name "IciT"
tcp_reuse_port = yes
user_agent_header = "User-Agent: IBCF"
server_header = "Server: IBCF"
children = 4

loadmodule "tm"
loadmodule "pv"
loadmodule "sl"
loadmodule "rr"
loadmodule "textops"
loadmodule "htable"
loadmodule "dialog"
loadmodule "dispatcher"
loadmodule "topoh"
loadmodule "uac"
loadmodule "pike"
loadmodule "acc"
loadmodule "rtpengine"
loadmodule "xmlrpc"
loadmodule "ipops"

include_file "common.cfg"
include_file "sos.cfg"

# A next hop that does not answer is moved on from in seconds, not the 30
# RFC 3261 allows: there is another entry point to try (5.10.2.1 3)
modparam("tm", "fr_timer", 5000)

# Which side of the dialog a request comes from (uac's restore, rr's
# is_direction()) is read off the From tag in the Route
modparam("rr", "append_fromtag", 1)

modparam("htable", "htable", "routes=>size=6;")

# The peers, one dispatcher set per peer network: its entry points as the
# destinations, and in the attributes "peer" (a name for the logs and CDRs),
# "trust" (1 if it is inside this network's trust domain, 24.229 4.4) and
# "sockname=Ici". A source is identified by address alone, ignoring port and
# transport
modparam("dispatcher", "list_file", "/etc/cscf/peers.list")
# Failover: the selected set is kept as a list (the _dsdst_ XAVP) for
# ds_next_dst() to walk, and with it each destination's attributes
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "setid_pvname", "$var(dsset)")
modparam("dispatcher", "attrs_pvname", "$var(dsattrs)")
modparam("dispatcher", "ds_ping_interval", 10)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_from", PING_FROM)
# Any answer at all means the entry point is up
modparam("dispatcher", "ds_ping_reply_codes", "class=2;class=3;class=4;class=5")

# 5.10.4: stateless, so nothing to share between replicas but the key. The
# Call-ID is left alone -- an IBCF between visited and home network must not
# change it (5.10.1) -- and so are the messages that stay inside
modparam("topoh", "mask_key", THKEY)
# Empty: a masked URI names the address of the socket it leaves through,
# which is where the peer's in-dialog requests have to come back to
modparam("topoh", "mask_ip", "")
modparam("topoh", "mask_cookie", "TH")
modparam("topoh", "mask_callid", 0)
modparam("topoh", "event_mode", 1)

modparam("uac", "restore_mode", "auto")

modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 40)
modparam("pike", "remove_latency", 4)

# A call has a dialog from its INVITE on: the CDR hangs off it, rtpengine
# ends it by Call-ID and tags (dlg.terminate_dlg), and so does its timeout
modparam("dialog", "default_timeout", DLGTIMEOUT)
modparam("dialog", "send_bye", 1)

# TS 32.260 6.1.3.10, as one log line per transaction and one per call
modparam("acc", "log_flag", FLT_ACC)
modparam("acc", "log_extra", "peer=$dlg_var(peer);side=$dlg_var(side)")
modparam("acc", "cdr_enable", 1)
modparam("acc", "cdr_start_on_confirmed", 1)
modparam("acc", "cdr_extra", "callid=$dlg(callid);peer=$dlg_var(peer);side=$dlg_var(side)")

modparam("rtpengine", "rtpengine_sock", RTPADR)

# rtpengine's media timeout teardown (b2b-url, xmlrpc-format 2) on the same
# 9090 the metrics use: /RPC2 is xmlrpc's, everything else xhttp's
modparam("xhttp", "url_skip", "^/RPC2")
modparam("xmlrpc", "route", "XMLRPC")
modparam("xmlrpc", "url_match", "^/RPC2")

request_route {
	# Before route[INIT], which answers an OPTIONS to this IBCF: a source with
	# no agreement gets nothing, keepalives included
	if($Rn =~ "^Ici") {
		route(PEER_IN);
	} else {
		$avp(entry) = 0;
	}
	route(INIT);
	$var(media) = "";

	if(has_totag()) {
		route(WITHINDLG);
		exit;
	}

	# A CANCEL follows its INVITE's transaction; an ACK that matches none has
	# nowhere to go
	if(is_method("CANCEL")) {
		if(t_check_trans()) {
			route(MEDIA);
			t_relay();
		}
		exit;
	}
	if(is_method("ACK")) {
		exit;
	}

	# 5.10.2.1 and 5.10.3.1 put the IBCF on the registration path of a roamer;
	# hiding the Path and Service-Route that carries is not done here
	if(is_method("REGISTER")) {
		send_reply("403", "Forbidden - No registration across this interconnect");
		exit;
	}

	route(SCREEN_BODY);
	if($avp(entry) == 1) {
		route(ENTRY);
	} else {
		route(EXIT);
	}
}

# A request from Ici: which peer it is, and whether it is to be trusted.
# Sets $avp(entry), $avp(peer) and $avp(trusted), which the reply routes read
# as well
route[PEER_IN] {
	$avp(entry) = 1;
	if(!pike_check_req()) {
		xwarn("pike: $si is flooding, request dropped\n");
		exit;
	}
	# 5.10.3.1 1), 5.10.3.2: a network there is no agreement with gets nothing
	if(!ds_is_from_list("-1", "3")) {
		xnotice("$rm from $si: not a known interconnect\n");
		if(!is_method("ACK")) {
			send_reply("403", "Forbidden - Unknown interconnect");
		}
		exit;
	}
	route(PEER_ATTRS);
	# The topology hiding cookie stays on this side of the IBCF
	remove_hf("TH");
}

# $avp(peer) and $avp(trusted) from the peers.list attributes in
# $var(dsattrs)
route[PEER_ATTRS] {
	$avp(peer) = $(var(dsattrs){param.value,peer});
	if($(var(dsattrs){param.value,trust}) == "1") {
		$avp(trusted) = 1;
	} else {
		$avp(trusted) = 0;
	}
}

# 5.10.3.2: an initial request from a peer
route[ENTRY] {
	if($avp(trusted) != 1) {
		# A peer outside the trust domain asking for originating services is
		# refused; everything only the trust domain may assert is dropped
		if($(hdr(Route)[0]) =~ ";[[:space:]]*orig([;>[:space:]]|$)") {
			send_reply("403", "Forbidden - orig from outside the trust domain");
			exit;
		}
		route(UNTRUSTED_IN);
	}

	# 1C) its own URI out of the topmost Route -- and the rest with it: past
	# the entry point the route is this network's to choose (4)
	remove_hf("Route");

#!ifdef ECSCF
	# 2C) an emergency service URN goes to the E-CSCF
	if($(ru{s.tolower}) =~ "^urn:service:sos") {
		xnotice("emergency $rm <$ru> from $avp(peer), to " + ECSCF + "\n");
		$du = ECSCF;
	} else {
		$du = ICSCF;
	}
#!else
	$du = ICSCF;
#!endif
	xinfo("entry $rm <$ru> from $avp(peer) ($si), to $du\n");
	# Out through Mx: left to itself the request would leave by the socket it
	# came in on, with the Ici address as its source, and the I-CSCF's answer
	# would have no way back
	$fsn = "Mx";

	# The offer came from outside and is on its way in
	$var(media) = "template=incoming";
	$avp(late) = "template=outgoing";
	route(SESSION);
	t_on_reply("FROM_HOME");
	t_on_failure("ENTRY_FAILED");
	record_route();
	route(RELAY);
}

# 5.10.2.2: an initial request leaving the network
route[EXIT] {
	# 1A) its own URI out of the topmost Route, if the request carries one
	loose_route();

	if(!route(PEER_SELECT)) {
		xnotice("exit $rm <$ru>: no interconnect for it\n");
		send_reply("404", "Not Found - No interconnect");
		exit;
	}
	# 3) the peer's entry points in priority order; none of them up is the
	# 504 of 5.10.2.1
	if(!ds_select_dst("$var(set)", "8")) {
		xnotice("exit $rm <$ru>: no entry point of set $var(set) is up\n");
		send_reply("504", "Server Time-out");
		exit;
	}
	$var(dsattrs) = $xavp(_dsdst_=>attrs);
	route(PEER_ATTRS);
	xinfo("exit $rm <$ru> to $avp(peer) at $du\n");

	route(SCREEN_OUT);
	$var(media) = "template=outgoing";
	$avp(late) = "template=incoming";
	route(SESSION);
	t_on_reply("FROM_PEER");
	t_on_failure("EXIT_FAILOVER");
	$fsn = "Ici";
	record_route();
	route(RELAY);
}

# Which interconnect takes the Request-URI: its domain, else the longest
# E.164 prefix of its number, else the default. Sets $var(set)
route[PEER_SELECT] {
	if($rd != $null && $sht(routes=>$(rd{s.tolower})) != $null) {
		$var(set) = $sht(routes=>$(rd{s.tolower}));
		return 1;
	}
	# A tel URI, or a SIP URI with a number for its user part. Visual
	# separators (RFC 3966 3) are not digits
	$var(num) = $(rU{re.subst,/[-.()]//g});
	if($var(num) =~ "^[+][0-9]+$") {
		$var(n) = $(var(num){s.len});
		while($var(n) > 1) {
			$var(p) = $(var(num){s.substr,0,$var(n)});
			if($sht(routes=>$var(p)) != $null) {
				$var(set) = $sht(routes=>$var(p));
				return 1;
			}
			$var(n) = $var(n) - 1;
		}
	}
	if($sht(routes=>*) != $null) {
		$var(set) = $sht(routes=>*);
		return 1;
	}
	return -1;
}

route[WITHINDLG] {
	if(!loose_route()) {
		if(is_method("ACK") && t_check_trans()) {
			t_relay();
			exit;
		}
		send_reply("404", "Not here");
		exit;
	}
	# The peer behind a call is the dialog's; from inside the network it is
	# the only way to know whom the request is going to
	if($avp(entry) == 1) {
		# 5.10.3.3 5), 6)
		if($avp(trusted) != 1) {
			route(UNTRUSTED_IN);
		}
		$fsn = "Mx";
		t_on_reply("FROM_HOME");
	} else {
		$avp(peer) = $dlg_var(peer);
		if($dlg_var(trusted) == "1") {
			$avp(trusted) = 1;
		} else {
			$avp(trusted) = 0;
		}
		route(SCREEN_OUT);
		$fsn = "Ici";
		t_on_reply("FROM_PEER");
	}
	route(SCREEN_BODY);
	# No template: the interfaces were pinned by the initial offer, and a
	# re-offer naming a pair again would move the call's own ports
	$var(media) = "";
	route(MEDIA);
	route(RELAY);
}

# A call, from its initial INVITE: the dialog the CDR and the teardown hang
# off, the accounting, and the offer to the TrGW. $var(media) is the
# template for an offer in the INVITE, $avp(late) the one for an offer in
# the answer to an INVITE that had none
route[SESSION] {
	if(!is_method("INVITE")) {
		return;
	}
	dlg_manage();
	$dlg_var(peer) = $avp(peer);
	$dlg_var(trusted) = $avp(trusted);
	if($avp(entry) == 1) {
		$dlg_var(side) = "entry";
	} else {
		$dlg_var(side) = "exit";
	}
	setflag(FLT_ACC);
	if(has_body("application/sdp")) {
		$avp(late) = $null;
	}
	route(MEDIA);
}

# Annex I.3.1, 24.229 5.10.5: the TrGW for each offer and answer in a
# request, and the session's end. rtpengine_manage() reads the method itself:
# an offer in an INVITE, an answer in an ACK, a delete for a BYE or CANCEL
route[MEDIA] {
	if(is_method("INVITE|ACK|BYE|CANCEL")) {
		rtpengine_manage("$var(media)");
	} else if(is_method("UPDATE") && has_body("application/sdp")) {
		rtpengine_offer();
	} else if(is_method("PRACK") && has_body("application/sdp")) {
		rtpengine_answer();
	}
}

# The answers, and the offer of an INVITE that had none. Only 1xx and 2xx:
# a failure answers nothing, and the session it leaves behind is for the
# failure route to end -- after the failover, not before it
route[MEDIA_REPLY] {
	if(!has_body("application/sdp") || !(status =~ "^[12]")) {
		return;
	}
	if(is_method("INVITE")) {
		if($avp(late) != $null) {
			rtpengine_manage("$avp(late)");
			$avp(offered) = 1;
		} else {
			rtpengine_manage();
		}
	} else if(is_method("UPDATE")) {
		rtpengine_answer();
	}
}

# The session a failed initial INVITE leaves on the TrGW: its own offer, or
# the one MEDIA_REPLY made from an answer when it had none. A CANCEL ended it
# already, and a failed re-INVITE leaves the call as it was
route[MEDIA_FAILED] {
	if(t_is_canceled() || !is_method("INVITE") || has_totag()) {
		return;
	}
	if($avp(late) == $null || $avp(offered) == 1) {
		rtpengine_delete();
	}
}

# From a peer outside the trust domain: what only the trust domain may
# assert (24.229 4.4), and the charging and feature headers of 5.10.3.2
route[UNTRUSTED_IN] {
	remove_hf("P-Charging-Vector");
	remove_hf("P-Charging-Function-Addresses");
	remove_hf("Feature-Caps");
	remove_hf("P-Asserted-Identity");
	remove_hf("P-Asserted-Service");
	remove_hf("P-Served-User");
	remove_hf("P-Profile-Key");
	remove_hf("P-Private-Network-Indication");
}

# Anything leaving for a peer, request or response. $avp(trusted) is the
# peer's
route[SCREEN_OUT] {
	# 5.10.2.2 9), 5.10.3.2: never outside the network
	remove_hf("P-Charging-Function-Addresses");
	if($avp(trusted) != 1) {
		# 24.229 4.4: the headers that stay inside the trust domain
		remove_hf("P-Charging-Vector");
		remove_hf("P-Access-Network-Info");
		remove_hf("P-Asserted-Service");
		remove_hf("P-Served-User");
		remove_hf("P-Profile-Key");
		remove_hf("P-Visited-Network-ID");
		remove_hf("P-Private-Network-Indication");
		route(PRIVACY);
	} else if($hdr(P-Charging-Vector) =~ "fe-identifier") {
		# 5.10.2.2 7): the "fe-identifier" is this network's own
		$var(pcv) = $(hdr(P-Charging-Vector){re.subst,/;[[:space:]]*fe-identifier=("[^"]*"|[^;]*)//gi});
		remove_hf("P-Charging-Vector");
		append_hf("P-Charging-Vector: $var(pcv)\r\n");
	}
	# Which kind of node, and which software, answered
	if($hdr(Server) =~ CORE_UA_RE) {
		remove_hf("Server");
	}
	if($hdr(User-Agent) =~ CORE_UA_RE) {
		remove_hf("User-Agent");
	}
}

# 5.10.8, RFC 3323 and RFC 3325, towards a peer outside the trust domain.
# "header" privacy is the topology hiding's already, which takes precedence
route[PRIVACY] {
	$var(priv) = $(hdr(Privacy){s.tolower});
	if($var(priv) == "" || $var(priv) =~ "none") {
		return;
	}
	if($var(priv) =~ "(id|critical)") {
		remove_hf("P-Asserted-Identity");
	}
	if($var(priv) =~ "history") {
		remove_hf("History-Info");
	}
	# 2) the From of an initial request, put back on everything that comes
	# the other way (uac's restore_mode)
	if($var(priv) =~ "user" && is_request() && !has_totag()) {
		uac_replace_from("Anonymous", "sip:anonymous@anonymous.invalid");
	}
}

# 5.10.6.3: the size of the body, and the type of every part of it. A body
# this IBCF may not pass is refused rather than stripped (5.10.6.3 2), as a
# body that is "handling=required" would have to be anyway
route[SCREEN_BODY] {
	if(!has_body()) {
		return;
	}
	if($cl > MAXBODY) {
		send_reply("413", "Request Entity Too Large");
		exit;
	}
	$var(ct) = $(cT{s.tolower});
	if(!($var(ct) =~ BODY_RE)) {
		route(BODY_REFUSED);
	}
	if(!($var(ct) =~ "^multipart/")) {
		return;
	}
	$var(i) = 0;
	$var(n) = $(rb{line.count});
	while($var(i) < $var(n)) {
		$var(l) = $(rb{line.at,$var(i)}{s.tolower});
		if($var(l) =~ "^content-type:") {
			$var(ct) = $(var(l){re.subst,/^content-type:[[:space:]]*//});
			if(!($var(ct) =~ BODY_RE)) {
				route(BODY_REFUSED);
			}
		}
		$var(i) = $var(i) + 1;
	}
}

route[BODY_REFUSED] {
	xnotice("$rm from $si: body of type '$var(ct)' refused\n");
	append_to_reply("Accept: application/sdp\r\n");
	send_reply("415", "Unsupported Media Type");
	exit;
}

# Responses from inside on their way to the peer
onreply_route[FROM_HOME] {
	route(SCREEN_OUT);
	route(MEDIA_REPLY);
}

# Responses from the peer on their way inside
onreply_route[FROM_PEER] {
	remove_hf("TH");
	remove_hf("P-Charging-Function-Addresses");
	if($avp(trusted) != 1) {
		route(UNTRUSTED_IN);
	}
	route(MEDIA_REPLY);
}

# 5.10.2.1 3), and RFC 3263 4.3 for any request: an entry point that does not
# answer, or says it cannot, is moved on from to the next of the peer's, and
# none left is a 504. Any other failure is the peer's answer and goes back.
failure_route[EXIT_FAILOVER] {
	if(t_is_canceled()) {
		exit;
	}
	if((t_branch_timeout() && !t_branch_replied()) || t_check_status("503")) {
		if(ds_next_dst()) {
			$var(dsattrs) = $xavp(_dsdst_=>attrs);
			route(PEER_ATTRS);
			xnotice("exit $rm <$ru>: entry point down, trying $du\n");
			t_on_reply("FROM_PEER");
			t_on_failure("EXIT_FAILOVER");
			$fsn = "Ici";
			route(RELAY);
			exit;
		}
		xnotice("exit $rm <$ru>: no entry point of $avp(peer) answered\n");
		route(MEDIA_FAILED);
		t_reply("504", "Server Time-out");
		exit;
	}
	route(MEDIA_FAILED);
}

# 5.10.3.2: an incoming call the network refuses, or never answers
failure_route[ENTRY_FAILED] {
	route(MEDIA_FAILED);
}

route[RELAY] {
	if(!t_relay()) {
		route(MEDIA_FAILED);
		send_reply_error();
	}
}

# 5.10.4: what leaves through Ici is hidden, and only that. Everything this
# IBCF sends inside the network goes out as it is
event_route[topoh:msg-outgoing] {
	if($sndfrom(ip) != ICIADDR) {
		drop;
	}
}

# rtpengine's call teardown when the media stops (5.10.2.4, 5.10.3.4): the
# one RPC it sends, and only from inside
route[XMLRPC] {
	if(route(FROM_ICI) || !($rb =~ "<methodName>dlg[.]terminate_dlg</methodName>")) {
		xmlrpc_reply("403", "Forbidden");
		exit;
	}
	xnotice("media timeout: rtpengine ends a call\n");
	dispatch_rpc();
}

# Whether the source is on Ici. By address, not by socket: 9090 listens on
# [::], and what $Ri gives for it is that. An IPv4 source arrives on it
# IPv4-mapped
route[FROM_ICI] {
	$var(src) = $(si{re.subst,/^::ffff://});
	if(is_in_subnet("$var(src)", ICINET)) {
		return 1;
	}
	return -1;
}

# The interconnects from ROUTES, in event_route[htable:mod-init] (sos.cfg)
route[ROUTESLOAD] {
	$var(list) = ROUTES;
	route(SOSLIST);
	while($var(entry) != "") {
		$sht(routes=>$(var(key){s.tolower})) = $(var(val){s.int});
		xinfo("interconnect $var(key) -> set $var(val)\n");
		route(SOSLIST);
	}
}
