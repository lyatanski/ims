#!KAMAILIO
# Emergency Call Session Control Function (E-CSCF)
# Stage 2: 3GPP TS 23.167 6.2.2; stage 3: TS 24.229 5.11
#
# Routes emergency requests to a PSAP chosen from local configuration -- the
# alternative to an LRF that 24.229 5.11.1 allows ("The PSAP URI can be
# retrieved from LRF ... or from local configuration").

#!defenvs REALM
#!defexps SERVER "ecscf.ims." + REALM
# The network this E-CSCF identifies itself as in the "orig-ioi" and
# "term-ioi" P-Charging-Vector parameters it writes
#!defexps IOI REALM
# The PSAP table, whitespace-separated <service>[@<location>]=<uri> entries:
#   <service>   the emergency service URN less "urn:service:", e.g. sos, sos.fire
#   <location>  a prefix of the location identifier: utran-cell-id-3gpp (or
#               cgi-3gpp) of P-Access-Network-Info, i.e. MCC, MNC, TAC and
#               ECI/NCI in hex (24.229 7.2A.4.3). Empty matches anywhere
#   <uri>       a SIP URI for a PSAP reached over IP (24.229 5.11.2 6a), or a
#               tel URI for one in the PSTN, reached through the BGCF (6b)
# e.g. "sos@=sip:psap.example.net sos@00101=sip:psap1.example.net
#       sos.fire@001010001=tel:+35912345"
#!defenvs PSAP
# The next hop towards a PSAP in the PSTN, as a SIP URI
#!trydefenvs BGCF
#!define FLT_DIALOG 1
#!define HEALTH $shtcn(psap=>**) > 0
#!define SOS_INIT route(PSAPLOAD);

# One socket per address family. A [::] socket without IPV6_V6ONLY, which
# kamailio never sets, also claims the IPv4 port, so the TCP pair only binds
# side by side with SO_REUSEPORT (tcp_reuse_port); v4 traffic still lands on
# the 0.0.0.0 socket and keeps its native source address
listen = 0.0.0.0:5060 advertise SERVER name "Mw"
listen = [::]:5060 advertise SERVER name "Mw6"
tcp_reuse_port = yes
user_agent_header = "User-Agent: Emergency-CSCF"
server_header = "Server: Emergency-CSCF"
children = 2

loadmodule "tm"
loadmodule "pv"
loadmodule "sl"
loadmodule "rr"
loadmodule "textops"
loadmodule "ims_dialog"
loadmodule "htable"

include_file "common.cfg"
include_file "sos.cfg"

# is_direction() tells the UE's in-dialog requests from the PSAP's
modparam("rr", "append_fromtag", 1)
modparam("ims_dialog", "dlg_flag", FLT_DIALOG)
modparam("htable", "htable", "psap=>size=6;")

request_route {
	if(has_totag()) {
		route(WITHINDLG);
		exit;
	}

	# A CANCEL follows its INVITE's transaction; an ACK that matches none has
	# nowhere to go
	if(is_method("CANCEL")) {
		if(t_check_trans()) {
			t_relay();
		}
		exit;
	}
	if(is_method("ACK")) {
		exit;
	}

	# TS 24.229 5.11.2: an initial request without an emergency service URN or
	# an emergency number in the Request-URI gets a 403
	if(!route(SOS_DETECT)) {
		send_reply("403", "Forbidden - Not an emergency request");
		exit;
	}

	# 1A) remove its own SIP URI from the topmost Route header field. Along
	# with whatever else is left: the PSAP is chosen here. Not loose_route(),
	# whose deletion of the same header would overlap this one
	remove_hf("Route");

	xnotice("emergency $rm <$ru> as $var(sos), from <$ai>\n");
	if($var(sosnum) != "") {
		$avp(sosnum) = $var(sosnum);
	}

	if(!route(PSAP)) {
		xerr("no PSAP for $var(sos) at location '$var(loc)'\n");
		send_reply("500", "Server Internal Error - No PSAP");
		exit;
	}
	xnotice("PSAP for $var(sos) at location '$var(loc)': $var(psap)\n");

	route(PCV);
	if($var(psap) =~ "^tel:") {
		route(PSTN);
	} else {
		# 6a) a PSAP connected to the IM CN subsystem: its URI as the topmost
		# Route; the Request-URI keeps the service URN for the PSAP to see
		insert_hf("Route: <$var(psap);lr>\r\n");
		$du = $var(psap);
		# 2) and 3) the PSAP is the next hop: no charging headers
		remove_hf("P-Charging-Vector");
		remove_hf("P-Charging-Function-Addresses");
	}

	# 5.11.1: privacy (location and identity suppression) is honoured only
	# where national regulation allows a caller to ask for it. It does not
	# here, so the PIDF-LO, Geolocation, Geolocation-Routing and the
	# P-Access-Network-Info all go on to the PSAP (NOTE 4, NOTE 5).

	# 10) keep the dialog so the session can be released from here
	if(is_method("INVITE")) {
		setflag(FLT_DIALOG);
	}

	t_on_reply("UE");
	# 9) create a Record-Route header field containing its own SIP URI
	record_route();
	if(!t_relay()) {
		send_reply_error();
	}
}

route[WITHINDLG] {
	if(!loose_route()) {
		if(is_method("ACK") && t_check_trans()) {
			t_relay();
			exit;
		}
		send_reply("404", "Not here");
		exit;
	}
	# 5.11.2: the 1xx/2xx to every UE request of the dialog, not only the first
	if(is_direction("downstream")) {
		t_on_reply("UE");
	}
	if(!t_relay()) {
		send_reply_error();
	}
}

# 6b) a PSAP in the PSTN: the BGCF as the topmost Route, the PSAP's tel URI
# as the Request-URI
route[PSTN] {
#!ifdef BGCF
	$ru = $var(psap);
	insert_hf("Route: <" + BGCF + ";lr>\r\n");
	$du = BGCF;
	# 4) towards a BGCF the type 2 "orig-ioi" is this network's, and no
	# "term-ioi" goes with it
	$var(pcv) = $(var(pcv){re.subst,/;[[:space:]]*(orig|term)-ioi=[^;]*//gi});
	remove_hf("P-Charging-Vector");
	append_hf("P-Charging-Vector: $var(pcv);orig-ioi=" + IOI + "\r\n");
#!else
	xerr("PSAP $var(psap) is in the PSTN and no BGCF is configured\n");
	send_reply("500", "Server Internal Error - No BGCF");
	exit;
#!endif
}

# 5) and 6) The location identifier of the P-Access-Network-Info, then the
# PSAP: the most specific service the table has an entry for (sos.fire.x,
# then sos.fire, then sos), and for it the longest location prefix, down to
# the empty one. A service-specific PSAP anywhere outranks a general one
# nearby, as the type of emergency service decides what kind of PSAP has to
# answer. Sets $var(loc) and $var(psap). The PIDF-LO is passed on but not used
# for routing: picking a PSAP from coordinates needs the LRF this replaces.
# Nor is a Geolocation reference dereferenced; with no location taken from
# it, 5A) does not arise.
route[PSAP] {
	$var(loc) = "";
	$var(i) = 0;
	while($var(i) < $hdrc(P-Access-Network-Info)) {
		$var(pani) = $(hdr(P-Access-Network-Info)[$var(i)]);
		if($var(pani) =~ "(utran-cell-id-3gpp|cgi-3gpp)=") {
			# The P-CSCF's own, network-provided value outranks the UE's
			# (TS 23.167 H.4)
			if($var(loc) == "" || $var(pani) =~ "network-provided") {
				$var(loc) = $(var(pani){re.subst,/.*(utran-cell-id-3gpp|cgi-3gpp)=[^0-9A-Za-z]*([0-9A-Za-z]*).*/\2/}{s.toupper});
			}
		}
		$var(i) = $var(i) + 1;
	}

	$var(s) = $(var(sos){s.substr,12,0});
	while($var(s) != "") {
		$var(l) = $var(loc);
		$var(more) = 1;
		while($var(more)) {
			# Tested in place: a $var assigned $null holds 0
			if($sht(psap=>$var(s)@$var(l)) != $null) {
				$var(psap) = $sht(psap=>$var(s)@$var(l));
				return 1;
			}
			if($var(l) == "") {
				$var(more) = 0;
			} else {
				$var(l) = $(var(l){re.subst,/.$//});
			}
		}
		if($var(s) =~ "[.]") {
			$var(s) = $(var(s){re.subst,/[.][^.]*$//});
		} else {
			$var(s) = "";
		}
	}
	return -1;
}

# P-Charging-Vector of the request: 1B) one is generated if the request has
# none, 1C) the received "orig-ioi" is kept for the responses. $var(pcv) is
# the header value, for the next hop to rewrite.
route[PCV] {
	if(is_present_hf("P-Charging-Vector")) {
		$var(pcv) = $hdr(P-Charging-Vector);
	} else {
		$var(pcv) = "icid-value=" + $(ci{s.md5});
	}
	$avp(icid) = $(var(pcv){re.subst,/.*icid-value=([^;]*).*/\1/i});
	if($var(pcv) =~ "orig-ioi=") {
		$avp(orig_ioi) = $(var(pcv){re.subst,/.*orig-ioi=([^;]*).*/\1/i});
	}
}

# Responses on their way back to the UE
onreply_route[UE] {
	# 5.11.2: any 1xx or 2xx asserts an emergency number, whatever the PSAP
	# asserted: the one dialled, or the first configured one for a URN
	if(status =~ "^[12][0-9][0-9]$") {
		remove_hf("P-Preferred-Identity");
		remove_hf("P-Asserted-Identity");
		if($avp(sosnum) != $null) {
			append_hf("P-Asserted-Identity: <tel:$avp(sosnum)>\r\n");
		} else {
			append_hf("P-Asserted-Identity: <tel:$shv(sospai)>\r\n");
		}
	}

	# The received "orig-ioi" and "term-ioi" are dropped; a request that came
	# with an "orig-ioi" is answered with it and this network's type 2
	# "term-ioi"
	if(is_present_hf("P-Charging-Vector")) {
		$var(pcv) = $(hdr(P-Charging-Vector){re.subst,/;[[:space:]]*(orig|term)-ioi=[^;]*//gi});
		remove_hf("P-Charging-Vector");
	} else if($avp(orig_ioi) != $null) {
		$var(pcv) = "icid-value=" + $avp(icid);
	} else {
		return;
	}
	if($avp(orig_ioi) != $null) {
		$var(pcv) = $var(pcv) + ";orig-ioi=" + $avp(orig_ioi) + ";term-ioi=" + IOI;
	}
	append_hf("P-Charging-Vector: $var(pcv)\r\n");
}

# The PSAP table from PSAP, in event_route[htable:mod-init] (sos.cfg). The
# location part of the key goes uppercase, as route[PSAP] looks it up.
route[PSAPLOAD] {
	$var(list) = PSAP;
	route(SOSLIST);
	while($var(entry) != "") {
		$var(svc) = $(var(key){re.subst,/@.*//}{s.tolower});
		if($var(key) =~ "@") {
			$var(l) = $(var(key){re.subst,/^[^@]*@//}{s.toupper});
		} else {
			$var(l) = "";
		}
		$sht(psap=>$var(svc)@$var(l)) = $var(val);
		xinfo("PSAP $var(svc)@$var(l) -> $var(val)\n");
		route(SOSLIST);
	}
}
