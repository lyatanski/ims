#!KAMAILIO
# Telephony Application Server (TAS)
# ISC: 3GPP TS 24.229 5.7; Communication Barring: TS 24.611
#
# A proxy AS (24.229 5.7.4) with one service so far: barring of outgoing (OCB)
# and incoming (ICB) calls by number, per served user. The S-CSCF sends an
# initial INVITE here when the user's iFC says so (the subscriber's `ifc` in
# open5gs/hss.yml), naming the served user and the session case in
# P-Served-User (RFC 5502). A barred call is answered 603 (24.611 4.5.2.6);
# anything else goes back to the S-CSCF on the Route it came with. Nothing is
# record-routed: a call let through has nothing more to ask of the TAS.
#
# The barring lists are userblocklist tables in valkey, one per direction,
# each row a number prefix for one served user, keyed by the user's number as
# digits only:
#   ocb  the numbers <user> may not call
#   icb  the numbers that may not call <user>
# Numbers are compared as digits only, international form, and the longest
# matching prefix decides; a row with allowlist 1 lets its range through
# within a shorter barred one. A row is a db_redis entry plus its place in the
# user's set:
#   HSET ocb:entry::359000000001:3599 username 359000000001 prefix 3599 allowlist 0
#   SADD ocb:user::359000000001 ocb:entry::359000000001:3599
#
# A list that cannot be read bars the call: userblocklist answers a failed
# lookup the same as a match.

#!defenvs REALM
#!defexps SERVER "tas.ims." + REALM
# The valkey holding the lists, as <host>:<port>/<db>
#!trydefenvs DBURL
#!ifndef DBURL
#!define DBURL "redis:6379/6"
#!endif
#!defexps DB_URL "redis://" + DBURL

listen = 0.0.0.0:5060 advertise SERVER name "ISC"
listen = [::]:5060 advertise SERVER name "ISC6"
listen = tcp:[::]:9090
tcp_reuse_port = yes
http_reply_parse = yes
tcp_accept_no_cl = yes
user_agent_header = "User-Agent: Telephony-AS"
server_header = "Server: Telephony-AS"
children = 2
debug = 2

loadmodule "tm"
loadmodule "pv"
loadmodule "sl"
loadmodule "rr"
loadmodule "siputils"
loadmodule "textops"
loadmodule "xlog"
loadmodule "xhttp"
loadmodule "xhttp_prom"
loadmodule "db_redis"
loadmodule "userblocklist"

modparam("xlog", "prefix", "[$ci $rm-$cs] ")
modparam("xlog", "prefix_mode", 1)

modparam("xhttp_prom", "xhttp_prom_stats", "all")

# The schemas are userblocklist's, copied once per direction. Both tables are
# read by user only, so each gets a set per user to read through.
modparam("db_redis", "schema_path", "/etc/as/schema/telephony")
modparam("db_redis", "keys", "ocb=entry:username,prefix&user:username")
modparam("db_redis", "keys", "icb=entry:username,prefix&user:username")
modparam("db_redis", "verbosity", 0)

modparam("userblocklist", "db_url", DB_URL)
# The table version check is on the default table, and the global list's,
# which the module loads whether or not it is used
modparam("userblocklist", "userblocklist_table", "ocb")

request_route {
	if(is_method("CANCEL")) {
		if(t_check_trans()) {
			t_relay();
		}
		exit;
	}
	# The ACK of a negative final response is the transaction's; there is no
	# other, with no Record-Route of this one in any dialog
	if(is_method("ACK")) {
		t_check_trans();
		exit;
	}
	# A retransmission: its transaction answers it, and the script ends here
	t_check_trans();

	# The S-CSCF put this TAS on top of the Route set, its own ISC mark below
	if(!loose_route()) {
		send_reply("403", "Forbidden - Not from an S-CSCF");
		exit;
	}

	if(is_method("INVITE") && !has_totag()) {
		route(BARRING);
	}

	# RFC 5502 5: P-Served-User is for the hop to this AS
	remove_hf("P-Served-User");
	if(!t_relay()) {
		send_reply_error();
	}
}

# TS 24.611 4.5.2.6: OCB checks the called number against the served user's
# outgoing list, ICB the caller against its incoming one. Replies and exits
# when the call is barred.
route[BARRING] {
	# A $var holds 0 for a $null, so the header is tested before it is copied
	if(!is_present_hf("P-Served-User")) {
		xwarn("no P-Served-User: no service\n");
		return;
	}
	$var(psu) = $hdr(P-Served-User);
	$var(user) = $(var(psu){nameaddr.uri}{uri.user}{re.subst,/[^0-9]//g});
	if($var(user) == "") {
		xwarn("served user <$(var(psu){nameaddr.uri})> has no number\n");
		return;
	}

	if($var(psu) =~ ";[[:space:]]*sescase=orig") {
		$var(list) = "ocb";
		$var(uri) = $ru;
	} else if($var(psu) =~ ";[[:space:]]*sescase=term") {
		$var(list) = "icb";
		if($ai != $null) {
			$var(uri) = $ai;
		} else {
			$var(uri) = $fu;
		}
	} else {
		xwarn("P-Served-User without a session case: no service\n");
		return;
	}
	# An E.164 number is 15 digits; the module takes no more than 31
	$var(num) = $(var(uri){uri.user}{re.subst,/[^0-9]//g}{s.substr,0,20});
	if($var(num) == "") {
		return;
	}

	# The domain is a mandatory argument, unused without use_domain
	if(!check_user_blocklist("$var(user)", "$(var(psu){nameaddr.uri}{uri.host})",
			"$var(num)", "$var(list)")) {
		xnotice("$var(list) of $var(user) bars $var(num)\n");
		send_reply("603", "Decline");
		exit;
	}
}

# /metrics, and /check for readiness: db_redis connects at startup or not at
# all, so a running TAS has reached valkey
event_route[xhttp:request] {
	if(prom_check_uri()) {
		prom_dispatch();
	} else {
		xhttp_reply("200", "OK", "text/plain", "ready to serve");
	}
}
