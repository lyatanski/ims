services:
  ocs:
    image: ghcr.io/lyatanski/cgr-engine
    configs:
    - source: cgrates.json
      target: /etc/cgrates/cgrates.json
    - source: Rates.csv
      target: /etc/cgrates/tp/Rates.csv
    - source: Accounts.csv
      target: /etc/cgrates/tp/Accounts.csv
    expose:
    - 3868/tcp
    - 2012/tcp
    - 2080/tcp

  # LoaderS reads the tariff plan (the *.csv configs below) into the engine's
  # internal DB. It is told to once: a periodic run would put every balance
  # back to its initial value, and an inotify one never sees files that were
  # there before it started.
  preload:
    image: alpine
    command:
    - sh
    - -c
    - |
      until wget -qO- --header 'Content-Type: application/json' \
          --post-data '{"jsonrpc":"2.0","id":1,"method":"LoaderSv1.Run","params":[{"LoaderID":"*default"}]}' \
          http://ocs:2080/jsonrpc | tee /dev/stderr | grep -q '"error":null'
      do sleep 1; done
    depends_on:
      ocs:
        condition: service_started

  trace:
    profiles:
    - debug
    network_mode: service:ocs
    command: -d any port 2012 or port 2014 or port 2080
    build:
      context: .
      dockerfile_inline: |
        FROM alpine
        RUN apk add ngrep
        ENTRYPOINT ["ngrep"]

configs:
  cgrates.json:
    content: |
      {
          "logger": {
              "level": 7,
          },
          "listen": {
              "rpcJSON": ":2012",
              "http": ":2080",
          },
          "db": {
              "dbConns": {
                  "*default": {
                      "dbType": "*internal",
                      // nothing to dump into: the image has no
                      // /var/lib/cgrates, and the engine refuses to start
                      // without it
                      "opts": {
                          "internalDBDumpInterval": "0s",
                          "internalDBRewriteInterval": "0s",
                      },
                  },
              },
          },
          "admins": {
              "enabled": true,
          },
          "loaders": [
              {
                  "id": "*default",
                  "enabled": true,
                  "runDelay": "0",    // run by `preload`, through LoaderSv1.Run
                  "lockfilePath": "/etc/cgrates/.cgr.lck",
                  "tpInPath": "/etc/cgrates/tp",
                  "tpOutPath": "",
              },
          ],
          "rates": {
              "enabled": true,
          },
          "accounts": {
              "enabled": true,
              // the account is picked by a *prefix filter, and with indexed
              // selects one only matches over an indexed field
              "prefixIndexedFields": ["*req.Account"],
              "conns": {
                  "*rates": [{ "connIDs": ["*internal"] }],
              },
          },
          "sessions": {
              "enabled": true,
              "conns": {
                  "*accounts": [{ "connIDs": ["*internal"] }],
                  "*rates": [{ "connIDs": ["*internal"] }],
                  "*ees": [{ "connIDs": ["*internal"] }],
              },
          },
          // one line per call in the log: what was charged for it
          "ees": {
              "enabled": true,
              "exporters": [
                  {
                      "id": "usage_log",
                      "type": "*log",
                      "fields": [
                          { "tag": "OriginID", "path": "*exp.OriginID", "type": "*variable", "value": "~*req.OriginID" },
                          { "tag": "Account", "path": "*exp.Account", "type": "*variable", "value": "~*req.Account" },
                          { "tag": "Destination", "path": "*exp.Destination", "type": "*variable", "value": "~*req.Destination" },
                          { "tag": "Usage", "path": "*exp.Usage", "type": "*variable", "value": "~*opts.*accountsCost.Abstracts{*duration}" },
                          { "tag": "Cost", "path": "*exp.Cost", "type": "*variable", "value": "~*opts.*accountsCost.Concretes" },
                      ],
                  },
              ],
          },
          "templates": {
              "*ccr": [
                  { "tag": "ToR", "path": "*cgreq.ToR", "type": "*constant", "value": "*voice" },
                  { "tag": "Category", "path": "*cgreq.Category", "type": "*constant", "value": "call" },
                  { "tag": "RequestType", "path": "*cgreq.RequestType", "type": "*constant", "value": "*prepaid" },
                  {
                      "tag": "OriginID", "path": "*cgreq.OriginID",
                      "type": "*variable", "mandatory": true,
                      "value": "~*req.Session-Id",
                  },
                  // SessionS keys the session on the option, not the field
                  {
                      "tag": "*originID", "path": "*opts.*originID",
                      "type": "*variable", "mandatory": true,
                      "value": "~*req.Session-Id",
                  },
                  {
                      "tag": "OriginHost", "path": "*cgreq.OriginHost",
                      "type": "*variable", "value": "~*vars.RemoteHost",
                  },
                  // sip:<number>@<domain> or tel:+<number> to the number
                  {
                      "tag": "Account", "path": "*cgreq.Account",
                      "type": "*variable", "mandatory": true,
                      "value": "~*req.Subscription-Id.Subscription-Id-Data:s/^(?:sip:|tel:)?\\+?([0-9]+).*/$${1}/",
                  },
                  {
                      "tag": "Destination", "path": "*cgreq.Destination",
                      "type": "*variable", "mandatory": true,
                      "value": "~*req.Service-Information.IMS-Information.Called-Party-Address:s/^(?:sip:|tel:)?\\+?([0-9]+).*/$${1}/",
                  },
                  { "tag": "OptAccounts", "path": "*opts.*accounts", "type": "*constant", "value": "true" },
              ],
              "*cca": [
                  { "tag": "SessionId", "path": "*rep.Session-Id", "type": "*variable", "value": "~*req.Session-Id", "mandatory": true },
                  { "tag": "OriginHost", "path": "*rep.Origin-Host", "type": "*variable", "value": "~*vars.OriginHost", "mandatory": true },
                  { "tag": "OriginRealm", "path": "*rep.Origin-Realm", "type": "*variable", "value": "~*vars.OriginRealm", "mandatory": true },
                  { "tag": "AuthApplicationId", "path": "*rep.Auth-Application-Id", "type": "*variable", "value": "~*vars.*appid", "mandatory": true },
                  { "tag": "CCRequestType", "path": "*rep.CC-Request-Type", "type": "*variable", "value": "~*req.CC-Request-Type", "mandatory": true },
                  { "tag": "CCRequestNumber", "path": "*rep.CC-Request-Number", "type": "*variable", "value": "~*req.CC-Request-Number", "mandatory": true },
                  {
                      "tag": "ResultCode", "path": "*rep.Result-Code",
                      "filters": ["*notempty:~*cgrep.Error:"],
                      "type": "*constant", "value": "5030", "blocker": true,
                  },
              ],
              // after *cca: what the account can still pay for, up to what
              // was asked. *cgrep.MaxUsage is keyed by run ID, and with no
              // chargers there is the one, *primary. (The other agents also
              // copy the smallest into *vars.MaxUsage; DiameterAgent doesn't.)
              "*grant": [
                  {
                      "tag": "ResultCode", "path": "*rep.Result-Code",
                      "filters": ["*lte:~*cgrep.MaxUsage.*primary{*durationSeconds}:0"],
                      "type": "*constant", "value": "4012", "blocker": true,
                  },
                  { "tag": "ResultCode", "path": "*rep.Result-Code", "type": "*constant", "value": "2001" },
                  {
                      "tag": "GrantedUnits",
                      "path": "*rep.Multiple-Services-Credit-Control.Granted-Service-Unit.CC-Time",
                      "type": "*variable", "value": "~*cgrep.MaxUsage.*primary{*durationSeconds}",
                      "mandatory": true,
                  },
              ],
          },
          // Prepaid without a reservation: a CCR asks AccountS how much of
          // the Requested-Service-Unit the account can pay for and grants
          // that, and the Used-Service-Unit of the next CCR is what gets
          // debited. Debiting the request up front and refunding the unused
          // part on CCR-T is what TS 32.299 describes, but the refund of a
          // charge from a *concrete balance panics this engine (EventCharges
          // Truncate, cgrates main as of 2026-10-19).
          "diameterAgent": {
              "enabled": true,
              "listeners": [
                  { "address": ":3868", "network": "tcp" },
              ],
              "conns": {
                  "*sessions": [{ "connIDs": ["*internal"] }],
              },
              "originHost": "ocs.${REALM}",
              "originRealm": "${REALM}",
              "requestProcessors": [
                  // the called party is not charged: grant what it asks for
                  {
                      "id": "VoiceTerminating",
                      "filters": [
                          "*string:~*vars.*cmd:CCR",
                          "*notstring:~*req.Service-Information.IMS-Information.Role-Of-Node:0",
                      ],
                      "flags": ["*none"],
                      "requestFields": [],
                      "replyFields": [
                          { "tag": "CCATemplate", "type": "*template", "value": "*cca" },
                          { "tag": "ResultCode", "path": "*rep.Result-Code", "type": "*constant", "value": "2001" },
                          {
                              "tag": "GrantedUnits",
                              "path": "*rep.Multiple-Services-Credit-Control.Granted-Service-Unit.CC-Time",
                              "type": "*variable",
                              "value": "~*req.Multiple-Services-Credit-Control.Requested-Service-Unit.CC-Time",
                              "filters": ["*exists:~*req.Multiple-Services-Credit-Control.Requested-Service-Unit.CC-Time:"],
                          },
                      ],
                  },
                  {
                      "id": "VoiceInit",
                      "filters": ["*string:~*vars.*cmd:CCR", "*string:~*req.CC-Request-Type:1"],
                      "flags": ["*sessions"],
                      "requestFields": [
                          { "tag": "CCRTemplate", "type": "*template", "value": "*ccr" },
                          { "tag": "OptAuthorize", "path": "*opts.*authorize", "type": "*constant", "value": "true" },
                          {
                              "tag": "OptUsage", "path": "*opts.*usage", "type": "*variable", "mandatory": true,
                              "value": "~*req.Multiple-Services-Credit-Control.Requested-Service-Unit.CC-Time:s/(.*)/$${1}s/",
                          },
                      ],
                      "replyFields": [
                          { "tag": "CCATemplate", "type": "*template", "value": "*cca" },
                          { "tag": "Grant", "type": "*template", "value": "*grant" },
                      ],
                  },
                  // CCR-U: debit what was used, then grant the next slice
                  {
                      "id": "VoiceUpdateDebit",
                      "filters": ["*string:~*vars.*cmd:CCR", "*string:~*req.CC-Request-Type:2"],
                      "flags": ["*sessions", "*continue"],
                      "requestFields": [
                          { "tag": "CCRTemplate", "type": "*template", "value": "*ccr" },
                          { "tag": "OptSession", "path": "*opts.*session", "type": "*constant", "value": "true" },
                          { "tag": "OptDebit", "path": "*opts.*debit", "type": "*constant", "value": "true" },
                          {
                              "tag": "OptUsage", "path": "*opts.*usage", "type": "*variable", "mandatory": true,
                              "value": "~*req.Multiple-Services-Credit-Control.Used-Service-Unit.CC-Time:s/(.*)/$${1}s/",
                          },
                      ],
                      "replyFields": [],
                  },
                  {
                      "id": "VoiceUpdateGrant",
                      "filters": ["*string:~*vars.*cmd:CCR", "*string:~*req.CC-Request-Type:2"],
                      "flags": ["*sessions"],
                      "requestFields": [
                          { "tag": "CCRTemplate", "type": "*template", "value": "*ccr" },
                          // the processors of one message share their opts:
                          // without these the grant is debited as well
                          { "tag": "OptSession", "path": "*opts.*session", "type": "*constant", "value": "false" },
                          { "tag": "OptDebit", "path": "*opts.*debit", "type": "*constant", "value": "false" },
                          { "tag": "OptAuthorize", "path": "*opts.*authorize", "type": "*constant", "value": "true" },
                          {
                              "tag": "OptUsage", "path": "*opts.*usage", "type": "*variable", "mandatory": true,
                              "value": "~*req.Multiple-Services-Credit-Control.Requested-Service-Unit.CC-Time:s/(.*)/$${1}s/",
                          },
                      ],
                      "replyFields": [
                          { "tag": "CCATemplate", "type": "*template", "value": "*cca" },
                          { "tag": "Grant", "type": "*template", "value": "*grant" },
                      ],
                  },
                  {
                      "id": "VoiceTerm",
                      "filters": ["*string:~*vars.*cmd:CCR", "*string:~*req.CC-Request-Type:3"],
                      "flags": ["*sessions"],
                      "requestFields": [
                          { "tag": "CCRTemplate", "type": "*template", "value": "*ccr" },
                          { "tag": "OptSession", "path": "*opts.*session", "type": "*constant", "value": "true" },
                          { "tag": "OptDebit", "path": "*opts.*debit", "type": "*constant", "value": "true" },
                          { "tag": "OptTerminate", "path": "*opts.*terminate", "type": "*constant", "value": "true" },
                          { "tag": "OptEEs", "path": "*opts.*ees", "type": "*constant", "value": "true" },
                          {
                              "tag": "OptUsage", "path": "*opts.*usage", "type": "*variable", "mandatory": true,
                              "value": "~*req.Multiple-Services-Credit-Control.Used-Service-Unit.CC-Time:s/(.*)/$${1}s/",
                          },
                      ],
                      "replyFields": [
                          { "tag": "CCATemplate", "type": "*template", "value": "*cca" },
                          { "tag": "ResultCode", "path": "*rep.Result-Code", "type": "*constant", "value": "2001" },
                      ],
                  },
              ],
          },
      }

  # The tariff plan LoaderS reads. Every subscriber shares account IMS: five
  # free minutes, then 0.22 a minute billed by the second out of 10.00.
  Rates.csv:
    content: |
      #Tenant,ID,FilterIDs,Weights,MinCost,MaxCost,MaxCostStrategy,RateID,RateFilterIDs,RateActivationStart,RateWeights,RateBlocker,RateIntervalStart,RateFixedFee,RateRecurrentFee,RateUnit,RateIncrement
      cgrates.org,RP_VOICE,*string:~*req.ToR:*voice,;0,0,0,*free,RT_ANY,,"* * * * *",;0,false,0s,0,0.22,1m,1s

  Accounts.csv:
    content: |
      #Tenant,ID,FilterIDs,Weights,Blockers,Opts,BalanceID,BalanceFilterIDs,BalanceWeights,BalanceBlockers,BalanceType,BalanceUnits,BalanceUnitFactors,BalanceOpts,BalanceCostIncrements,BalanceAttributeIDs,BalanceRateProfileIDs,ThresholdIDs
      cgrates.org,IMS,*prefix:~*req.Account:${DIAL}|${MCC}${MNC},;10,,,VOICE_5M,*string:~*req.ToR:*voice,;20,,*abstract,5m,,,;1s;0;0,,,*none
      cgrates.org,IMS,,,,,MONETARY,,;10,,*concrete,10,,,;1s;;,,RP_VOICE,
