include:
- ${CORE:-core.yml}   # CORE=stub.yml swaps the HSS for the pro2call Cx stub
- billing.yml
- monitor.yml


x-kamailio: &kamailio
  image: ghcr.io/lyatanski/kamailio
  expose:
  - 5060/tcp
  - 5060/udp
  dns: ${DNSv4}
  healthcheck:
    test: wget -qO- 127.0.0.1:9090/check
    retries: 60
    interval: 5s
    start_period: 5s

# Everything the network sends a UE goes back through the UPF, which wraps it in
# GTP-U: 20 bytes of outer IPv4 + 8 UDP + 8 GTP. So of the 1500-byte path only
# 1464 are left for the packet that leaves here, and `mtu 1452` (measured on this
# stack — 1452 arrives, 1480 does not) is what makes the sender fragment inside
# that budget instead of handing the UPF a datagram it has to fragment a second
# time. Without it a G-PDU over the MTU is split, the trailing fragment carries
# no GTP header, nothing downstream can classify it, and BOTH halves are lost.
#
# It shows up on exactly the messages that matter: the terminating INVITE is
# ~1.8 kB here (5 Record-Route + 6 Via, since a call between two subscribers of
# one core crosses P-CSCF -> S-CSCF -> I-CSCF -> S-CSCF -> P-CSCF, plus the
# P-Charging-* set) so it never reaches the callee, while the 786-byte REGISTER
# 200 OK on the same SA arrives — the UE rings for nothing and the P-CSCF
# retransmits on timer A. Set on both sidecars: RTP toward a UE crosses the same
# tunnel, and rtpengine is the one sending it.
x-route: &route
  image: alpine
  command: sh -c "ip route replace ${UENET} via $$(getent ahostsv4 upf | cut -d' ' -f1 | sort -u | head -1) mtu 1452"
  cap_add:
  - NET_ADMIN

services:
  pcscf:
    << : *kamailio
    command: -f /etc/cscf/proxy.cfg
    environment:
      REALM: ${REALM}
      DBURL: redis:6379/1
      # Gm — ims_ipsec_pcscf binds its IPsec/SIP sockets to this address, and
      # it is what the SMF hands the UE in the PCO. Mw already listens on
      # 0.0.0.0, so this is the only address that has to move when Gm gets a
      # network of its own; $GMv4 defaults to the Mw address, leaving the
      # single-network variants exactly as they were (see stub.yml / priv.yml).
      IPSEC: ${GMv4:-${IPSEC}}
    configs:
    - source: pcscf.xml
      target: /etc/cscf/diameter.xml
    cap_add:
    - NET_ADMIN
    networks:
      default:            # Mw
        ipv4_address: ${IPSEC}
    depends_on:
      kmod:
        condition: service_completed_successfully

  icscf:
    << : *kamailio
    command: -f /etc/cscf/interrogating.cfg
    environment:
      REALM: ${REALM}
      DBURL: redis:6379/2
    configs:
    - source: icscf.xml
      target: /etc/cscf/diameter.xml
    depends_on:
      dbprep:
        condition: service_completed_successfully

  scscf:
    << : *kamailio
    command: -f /etc/cscf/serving.cfg
    environment:
      REALM: ${REALM}
      #DBURL: redis:6379/3
      RTPADR: udp:rtpengine:9910
    configs:
    - source: scscf.xml
      target: /etc/cscf/diameter.xml

  dns:
    image: coredns/coredns
    command: -conf /etc/coredns/Corefile
    configs:
    - source: dns
      target: /etc/coredns/Corefile
    networks:
      default:
        ipv4_address: ${DNSv4}

  rtpengine:
    image: ghcr.io/lyatanski/rtpengine
    command: --no-log-timestamps 
    configs:
    - source: rtpengine.conf
      target: /etc/rtpengine/rtpengine.conf
    expose:
    - 9910/udp
    scale: 1
    healthcheck:
      test: wget -qO- 127.0.0.1:9090/ping
      retries: 60
      interval: 5s
      start_period: 5s

  route-sip:
    << : *route
    network_mode: service:pcscf

  route-rtp:
    << : *route
    network_mode: service:rtpengine

  kmod:
    image: alpine
    command:
    - modprobe
    - -a
    - ah4
    - ah6
    - esp4
    - esp6
    - xfrm4_tunnel
    - xfrm6_tunnel
    - xfrm_user
    - ip_tunnel
    - tunnel4
    - tunnel6
    cap_add:
    - SYS_MODULE
    volumes:
    - /lib/modules:/lib/modules

  dbprep:
    image: valkey/valkey:9-alpine
    command: valkey-cli -u redis://redis:6379/2 HSET s_cscf:entry::1 s_cscf_uri sip:scscf.ims.${REALM}
    restart: on-failure

  redis:
    image: valkey/valkey:9-alpine
    expose:
    - 6379/tcp

  # pro2call's ims_test_s5.lua (images/test): ${SCALE} subscribers attached over
  # S5/S8, each registered with IMS-AKA over ESP, then called pairwise — one
  # process, one event loop, and a summary with the setup-time distribution.
  # `docker compose --profile test up test` runs it; it exits non-zero if any
  # subscriber or call failed, which is what CI waits on.
  test:
    profiles:
    - test
    image: ghcr.io/lyatanski/test
    environment:
      # S5/S8. The generator is the SGW half of it, so it binds GTP-C on its
      # own address — SGW_IP is left unset and auto-derived from $GTPU_IFACE,
      # which is also the interface the eBPF GTP-U datapath attaches to. One
      # network here, so both the S5/S8 and the access side are eth0.
      PGW_IP:            smf
      GTPU_IFACE:        eth0
      GTPU_INNER_IFACE:  eth0
      # The uplink side of the GTP-U size budget needs no variable here: the
      # generator gives the route to the P-CSCF — the address the PCO handed
      # it — an MTU that leaves room for the 36 bytes the datapath adds, so
      # the kernel fragments an oversized ESP datagram before the TC hook,
      # where nothing can. GTPU_INNER_MTU overrides the 1464 it uses (0 leaves
      # routing alone); it is the mirror of the `mtu` on x-route above, and
      # set_pcscf_mtu in ims_test_s5.lua has the arithmetic and the symptom.
      # The USIM, shared by the whole range, and the serving PLMN + home domain
      # the IMPI/IMPU are built from.
      IMS_K:      ${K}
      IMS_OPC:    ${OPC}
      IMS_MCC:    ${MCC}
      IMS_MNC:    ${MNC}
      IMS_REALM:  ims.${REALM}
      # IMSI range: core.yml seeds mongo with <plmn> + the index padded out to
      # 15 digits, so subscriber 1 is this and the rest follow. The padding
      # below assumes the 2-digit MNC of .env; a 3-digit one needs one zero
      # fewer here (and core.yml computes it, so only this line has to move).
      IMS_IMSI:   ${MCC}${MNC}0000000001
      IMS_SUBS:   ${SCALE}
      # The number of a subscriber, derived: core.yml seeds msisdn as $DIAL
      # followed by the index padded to 9 digits, which is $DIAL followed by
      # the last 9 digits of the IMSI.
      IMS_MSISDN_CC:      ${DIAL}
      IMS_MSISDN_DIGITS:  9
      # How the callee is addressed. A handset dials a number, and tel: puts
      # the whole MSISDN -> IMPU -> registered contact chain under test — but
      # open5gs's HSS associates the number as `tel:<msisdn>` and
      # `sip:<msisdn>@<realm>` with NO leading '+' (hss_cx_download_user_data),
      # and the LIR match is exact, while the generator dials E.164 with one.
      # So numbers only route against the pro2call Cx emulator, which derives
      # them from the same two variables above:
      #
      #     CORE=stub.yml CALL_URI=tel docker compose --profile test up test
      #
      # Everywhere else the callee is dialled by the sip IMPU it registered,
      # which needs no number anywhere — and which is also what the generator
      # does unconditionally before the revision that added this variable, so
      # the three settings above are inert until $PRO2CALL_REF carries it.
      CALL_URI:  ${CALL_URI:-sip}
    cap_add:
    - NET_ADMIN   # ESP SAs and policies, the transparent UE socket, the TC hook
    - BPF         # loading the GTP-U datapath
    depends_on:
      icscf:
        condition: service_healthy
      scscf:
        condition: service_healthy

  pcap:
    profiles:
    - debug
    image: quay.io/ptcpdump/ptcpdump
    depends_on:
      pcscf:
        condition: service_healthy
      icscf:
        condition: service_healthy
      scscf:
        condition: service_healthy
    healthcheck:
      test: test -s /pcap/trace.pcapng
      retries: 30
      interval: 2s
      start_period: 5s
    command:
    - ptcpdump
    - -i
    - any
    - -w
    - /pcap/trace.pcapng
    network_mode: host
    pid: host
    privileged: true
    volumes:
    - pcap:/pcap
    - /sys/fs/cgroup:/sys/fs/cgroup:ro
    - /var/run:/var/run:ro
    - /run:/run:ro

  # Wireshark in the browser
  webshark:
    profiles:
    - debug
    image: ghcr.io/lyatanski/webshark
    volumes:
    - pcap:/captures
    ports:
    - 8085:8085


configs:
  pcscf.xml:
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <DiameterPeer
          FQDN="pcscf.ims.${REALM}"
          Realm="ims.${REALM}"
          Vendor_Id="10415"
          Product_Name="CDiameterPeer"
          Workers="4"
      >
              <Peer FQDN="pcrf.epc.${REALM}" Realm="epc.${REALM}" port="3868"/>
              <Auth id="16777236" vendor="10415"/> <!-- Rx 3GPP -->
              <SupportedVendor vendor="10415" />
              <DefaultRoute FQDN="pcrf.epc.${REALM}" metric="1"/>
      </DiameterPeer>

  icscf.xml:
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <DiameterPeer
          FQDN="icscf.ims.${REALM}"
          Realm="ims.${REALM}"
          Vendor_Id="10415"
          Product_Name="CDiameterPeer"
          Workers="4"
      >
              <Peer FQDN="hss.epc.${REALM}" Realm="epc.${REALM}" port="3868"/>
              <Auth id="16777216" vendor="10415"/> <!-- Cx 3GPP -->
              <SupportedVendor vendor="10415" />
              <DefaultRoute FQDN="hss.epc.${REALM}" metric="1"/>
      </DiameterPeer>

  scscf.xml:
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <DiameterPeer
          FQDN="scscf.ims.${REALM}"
          Realm="ims.${REALM}"
          Vendor_Id="10415"
          Product_Name="CDiameterPeer"
          Workers="4"
      >
              <Peer FQDN="hss.epc.${REALM}" Realm="epc.${REALM}" port="3868"/>
              <Peer FQDN="ocs.${REALM}" Realm="${REALM}" port="3868"/>
              <Auth id="16777216" vendor="10415"/> <!-- Cx 3GPP -->
              <Auth id="4"        vendor="10415"/> <!-- Ro 3GPP -->
              <SupportedVendor vendor="10415" />
              <Realm name="${REALM}">
                  <Route FQDN="ocs.${REALM}" metric="1"/>
              </Realm>
              <DefaultRoute FQDN="hss.epc.${REALM}" metric="1"/>
      </DiameterPeer>

  rtpengine.conf:
    content: |
      [rtpengine]
      log-level = 7
      table = -1
      listen-http = 0.0.0.0:9090
      listen-ng = 0.0.0.0:9910
      interface = any
      timeout = 60
      silent-timeout = 3600
      tos = 184
      port-min = 30000
      port-max = 40000
      no-redis-required = true
      #redis-write = redis:6379/4
      #redis-subscribe = redis:6379/5
      #redis-resolve-on-reconnect = true

      [ims-rtpengine-2]
      log-level = 7
      table = -1
      listen-http = 0.0.0.0:9090
      listen-ng = 0.0.0.0:9910
      interface = any
      timeout = 60
      silent-timeout = 3600
      tos = 184
      port-min = 30000
      port-max = 40000
      no-redis-required = true
      redis-write = redis:6379/5
      redis-subscribe = redis:6379/4
      redis-resolve-on-reconnect = true

  dns:
    content: |
      . {
          errors
          log
          health {
             lameduck 5s
          }
          ready
          template IN SRV {
              match (?P<name>.cscf)?\.ims\.mnc\d{2,3}\.mcc\d{3}\.3gppnetwork.org
              answer "{{ .Name }} 1D SRV 0 0 5060 {{ or .Group.name \"icscf\" }}."
              fallthrough
          }
          template IN ANY {
              match (^|[.])(?P<name>[^.]*).*\.mnc\d{2,3}\.mcc\d{3}\.3gppnetwork.org
              answer "{{ .Name }} 1D IN CNAME {{ .Group.name }}."
              fallthrough
          }
          forward . /etc/resolv.conf
          cache 30
          loop
          reload
          loadbalance
      }


networks:
  default:
    enable_ipv6: true
    ipam:
      config:
      - subnet: ${NETv4}
      - subnet: ${NETv6}


volumes:
  pcap:
