include:
- ${CORE:-core.yml}   # CORE=stub.yml swaps the HSS for the pro2call Cx stub
- billing.yml
- monitor.yml


x-kamailio: &kamailio
  image: ghcr.io/lyatanski/kamailio
  expose:
  - 5060/tcp
  - 5060/udp
  dns: ${DNSv4}
  healthcheck:
    test: wget -qO- 127.0.0.1:9090/check
    retries: 60
    interval: 5s
    start_period: 5s

x-route: &route
  image: alpine
  command:
  - sh
  - -c
  - |
    gw=$$(getent ahostsv4 upf | cut -d' ' -f1 | sort -u | head -1)
    gw6=$$(getent ahostsv6 upf | cut -d' ' -f1 | sort -u | head -1)
    test -n "$$gw" && test -n "$$gw6" &&
    ip route replace ${UENET} via $$gw mtu 1450 &&
    ip -6 route replace ${UENETv6} via $$gw6 mtu 1450
  cap_add:
  - NET_ADMIN
  restart: on-failure

services:
  pcscf:
    << : *kamailio
    command: -f /etc/cscf/proxy.cfg
    environment:
      REALM: ${REALM}
      DBURL: redis:6379/1
      IPSEC: ${IPSEC}
      IPSEC6: ${IPSECv6}
      ECSCF: sip:ecscf.ims.${REALM}
    configs:
    - source: pcscf.xml
      target: /etc/cscf/diameter.xml
    cap_add:
    - NET_ADMIN
    networks:
      default:            # Mw
        ipv4_address: ${IPSEC}
        ipv6_address: ${IPSECv6}
    depends_on:
      kmod:
        condition: service_completed_successfully

  icscf:
    << : *kamailio
    command: -f /etc/cscf/interrogating.cfg
    environment:
      REALM: ${REALM}
      DBURL: redis:6379/2
    configs:
    - source: icscf.xml
      target: /etc/cscf/diameter.xml
    depends_on:
      scscf:
        condition: service_healthy

  scscf:
    << : *kamailio
    command: -f /etc/cscf/serving.cfg
    environment:
      REALM: ${REALM}
      #DBURL: redis:6379/3
      REGSRV: addr=redis;port=6379;db=2
      ENUM: e164.${REALM}.
      # Off-net numbers (the BGCF role) and other networks' domains both
      # leave through the IBCF, which anchors their media
      TRUNK: sip:ibcf.ims.${REALM}
      IBCF: sip:ibcf.ims.${REALM}
      E164CC: ${DIAL}
      E164IDD:
      E164NDD:
    configs:
    - source: scscf.xml
      target: /etc/cscf/diameter.xml
    depends_on:
      redis:
        condition: service_healthy

  ecscf:
    << : *kamailio
    command: -f /etc/cscf/emergency.cfg
    environment:
      REALM: ${REALM}
      # <service>[@<cell prefix>]=<uri> entries (cscf/emergency.cfg). Nothing
      # answers at the default: point it at a PSAP, and set BGCF for tel URIs
      PSAP: ${PSAP:-sos=sip:psap.ims.${REALM}}

  # Interconnection Border Control Function: the network's entry and exit
  # point on Ici (TS 23.228 4.14, Annex I), with rtpengine as its TrGW
  ibcf:
    << : *kamailio
    command: -f /etc/cscf/border.cfg
    environment:
      REALM: ${REALM}
      ICI: ${ICI}
      ICINET: ${NETICI}
      RTPADR: udp:trgw:9910
      ECSCF: sip:ecscf.ims.${REALM}
      # Which peers.list set a destination goes to: the peer network's
      # domain, and the number range behind it
      ROUTES: ${PEERDOMAIN}=1 +${PEERDIAL}=1
    configs:
    - source: peers.list
      target: /etc/cscf/peers.list
    networks:
      default:            # Mx
      ici:                # Ici
        ipv4_address: ${ICI}

  tas:
    << : *kamailio
    command: -f /etc/as/telephony.cfg
    environment:
      REALM: ${REALM}
      DBURL: redis:6379/6
    depends_on:
      redis:
        condition: service_healthy

  dns:
    image: coredns/coredns
    command: -conf /etc/coredns/Corefile
    configs:
    - source: dns
      target: /etc/coredns/Corefile
    networks:
      default:
        ipv4_address: ${DNSv4}
        ipv6_address: ${DNSv6}

  # The IBCF's TrGW (TS 23.228 Annex I), rtpengine: `internal` faces the
  # network, `external` the peers. Named devices, as rtpengine binds an
  # interface by name, and a static Mx address because the ng socket listens
  # on that one only -- not on Ici, where the peers are
  trgw:
    image: ghcr.io/lyatanski/rtpengine
    command: --no-log-timestamps 
    configs:
    - source: rtpengine.conf
      target: /etc/rtpengine/rtpengine.conf
    expose:
    - 9910/udp
    scale: 1
    networks:
      default:
        interface_name: mx0
        ipv4_address: ${RTPv4}
      ici:
        interface_name: ici0
        ipv4_address: ${ICIRTP}
    healthcheck:
      test: wget -qO- 127.0.0.1:9090/ping
      retries: 60
      interval: 5s
      start_period: 5s

  route-sip:
    << : *route
    network_mode: service:pcscf

  route-rtp:
    << : *route
    network_mode: service:trgw

  kmod:
    image: alpine
    command:
    - modprobe
    - -a
    - ah4
    - ah6
    - esp4
    - esp6
    - xfrm4_tunnel
    - xfrm6_tunnel
    - xfrm_user
    - ip_tunnel
    - tunnel4
    - tunnel6
    cap_add:
    - SYS_MODULE
    volumes:
    - /lib/modules:/lib/modules

  redis:
    image: valkey/valkey:9-alpine
    expose:
    - 6379/tcp
    healthcheck:
      test: valkey-cli ping | grep -q PONG
      retries: 30
      interval: 2s
      start_period: 2s

  test:
    profiles:
    - test
    image: ghcr.io/lyatanski/pro2call
    environment:
      PGW_IP:            smf
      IMS_PDN_TYPE:      ${PDN_TYPE:-ipv4}   # ipv6 / ipv4v6 run SIP and media over IPv6
      GTPU_IFACE:        eth0
      GTPU_INNER_IFACE:  eth0
      GTP_T3_MS:  ${GTP_T3_MS:-3000}
      IMS_K:      ${K}
      IMS_OPC:    ${OPC}
      IMS_MCC:    ${MCC}
      IMS_MNC:    ${MNC}
      IMS_REALM:  ims.${REALM}
      IMS_IMSI:   ${MCC}${MNC}0000000001
      IMS_SUBS:   ${SCALE}
      IMS_MSISDN_CC:      ${DIAL}
      IMS_MSISDN_DIGITS:  9
      CALL_URI:  ${CALL_URI:-tel}
      CALL_REVERSE_SLEEP_MS: 30000
    cap_add:
    - NET_ADMIN   # ESP SAs and policies, the transparent UE socket, the TC hook
    - BPF         # loading the GTP-U datapath
    - PERFMON     # privileged verifier: skip the Spectre passes
    sysctls:
      # The UE starts sending the moment it has a PDN, while eth0's link-local
      # address is still in DAD: the first neighbour solicitation for the
      # P-CSCF then waits out the 1 s retransmit, and every IPv6 registration
      # measures it
      net.ipv6.conf.all.accept_dad: 0
      net.ipv6.conf.default.accept_dad: 0
    depends_on:
      pcscf:
        condition: service_healthy
      icscf:
        condition: service_healthy
      scscf:
        condition: service_healthy

  # Another operator's network across Ici, and in the same process a
  # stand-in for this network's S-CSCF behind the IBCF: the interconnect
  # check (border.sh). Every check is a line in its log; the exit status is
  # the number that failed
  peer:
    profiles:
    - border
    image: ${PRO2CALL:-ghcr.io/lyatanski/pro2call}
    command: ibcf_peer.lua
    environment:
      PEER_ICI: ${ICIPEER}
      PEER_IBCF: ${ICI}
      PEER_IBCF_MX: ibcf
      PEER_TRGW: ${ICIRTP}
      PEER_TRGW_MX: ${RTPv4}
      PEER_REALM: ${REALM}
      PEER_DIAL: ${PEERDIAL}
      # In the home range, provisioned or not: the answer is the home
      # network's either way
      PEER_HOME: tel:+${DIAL}000000099
      # rtpengine's `timeout`: how long a call without media lasts
      PEER_MEDIA_TIMEOUT_S: 60
    networks:
      default:
        interface_name: mx0
      ici:
        interface_name: ici0
        ipv4_address: ${ICIPEER}
    depends_on:
      ibcf:
        condition: service_healthy
      trgw:
        condition: service_healthy


configs:
  pcscf.xml:
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <DiameterPeer
          FQDN="pcscf.ims.${REALM}"
          Realm="ims.${REALM}"
          Vendor_Id="10415"
          Product_Name="CDiameterPeer"
          Workers="4"
      >
              <Peer FQDN="pcrf.epc.${REALM}" Realm="epc.${REALM}" port="3868"/>
              <Auth id="16777236" vendor="10415"/> <!-- Rx 3GPP -->
              <SupportedVendor vendor="10415" />
              <DefaultRoute FQDN="pcrf.epc.${REALM}" metric="1"/>
      </DiameterPeer>

  icscf.xml:
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <DiameterPeer
          FQDN="icscf.ims.${REALM}"
          Realm="ims.${REALM}"
          Vendor_Id="10415"
          Product_Name="CDiameterPeer"
          Workers="4"
      >
              <Peer FQDN="hss.epc.${REALM}" Realm="epc.${REALM}" port="3868"/>
              <Auth id="16777216" vendor="10415"/> <!-- Cx 3GPP -->
              <SupportedVendor vendor="10415" />
              <DefaultRoute FQDN="hss.epc.${REALM}" metric="1"/>
      </DiameterPeer>

  scscf.xml:
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <DiameterPeer
          FQDN="scscf.ims.${REALM}"
          Realm="ims.${REALM}"
          Vendor_Id="10415"
          Product_Name="CDiameterPeer"
          Workers="4"
      >
              <Peer FQDN="hss.epc.${REALM}" Realm="epc.${REALM}" port="3868"/>
              <Peer FQDN="ocs.${REALM}" Realm="${REALM}" port="3868"/>
              <Auth id="16777216" vendor="10415"/> <!-- Cx 3GPP -->
              <Auth id="4"        vendor="10415"/> <!-- Ro 3GPP -->
              <SupportedVendor vendor="10415" />
              <Realm name="${REALM}">
                  <Route FQDN="ocs.${REALM}" metric="1"/>
              </Realm>
              <DefaultRoute FQDN="hss.epc.${REALM}" metric="1"/>
      </DiameterPeer>

  rtpengine.conf:
    content: |
      [rtpengine]
      log-level = 7
      table = -1
      listen-http = 0.0.0.0:9090
      listen-ng = ${RTPv4}:9910
      interfaces-config = interface
      templates = templates
      timeout = 60
      silent-timeout = 3600
      tos = 184
      port-min = 30000
      port-max = 40000
      no-redis-required = true
      # A call whose media stops is ended by the IBCF that set it up:
      # dlg.terminate_dlg over XMLRPC, %% being the address the offer came from
      b2b-url = http://%%:9090/RPC2
      xmlrpc-format = 2
      #redis-write = redis:6379/4
      #redis-subscribe = redis:6379/5
      #redis-resolve-on-reconnect = true

      [ims-rtpengine-2]
      log-level = 7
      table = -1
      listen-http = 0.0.0.0:9090
      listen-ng = 0.0.0.0:9910
      interfaces-config = interface
      templates = templates
      timeout = 60
      silent-timeout = 3600
      tos = 184
      port-min = 30000
      port-max = 40000
      no-redis-required = true
      redis-write = redis:6379/5
      redis-subscribe = redis:6379/4
      redis-resolve-on-reconnect = true

      [interface-internal]
      address = mx0

      [interface-external]
      address = ici0

      # Named by the IBCF on the initial offer, by the side it came from.
      # strict-source: once latched, a stream is only taken from that source.
      # replace-origin: the o= line names the TrGW too, not the side behind it
      [templates]
      outgoing = direction=internal direction=external strict-source replace-origin
      incoming = direction=external direction=internal strict-source replace-origin

  # The peer networks, one dispatcher set each: their entry points, and
  # whether they are inside this network's trust domain (TS 24.229 4.4)
  peers.list:
    content: |
      # setid destination flags priority attributes
      1 sip:${ICIPEER}:5060 0 0 peer=peer;trust=0;sockname=Ici

  dns:
    content: |
      . {
          errors
          log
          health {
             lameduck 5s
          }
          ready
          # ENUM (RFC 6116)
          template IN NAPTR {
              match ^([0-9]\.)+${DIALR}\.e164\.(?P<home>mnc\d{2,3}\.mcc\d{3}\.3gppnetwork\.org)\.$$
              answer "{{ .Name }} 1D IN NAPTR 10 100 \"u\" \"E2U+sip\" \"!^\\+(.*)$$!sip:\\1@ims.{{ .Group.home }}!\" ."
              fallthrough
          }
          # A number in the tree but outside the served range: no such name.
          template IN NAPTR {
              match ^([0-9]\.)+e164\.mnc\d{2,3}\.mcc\d{3}\.3gppnetwork\.org\.$$
              rcode NXDOMAIN
          }
          template IN SRV {
              match (?P<name>.cscf|ibcf|tas)?\.ims\.mnc\d{2,3}\.mcc\d{3}\.3gppnetwork.org
              answer "{{ .Name }} 1D SRV 0 0 5060 {{ or .Group.name \"icscf\" }}."
              fallthrough
          }
          template IN ANY {
              match (^|[.])(?P<name>[^.]*).*\.mnc\d{2,3}\.mcc\d{3}\.3gppnetwork.org
              answer "{{ .Name }} 1D IN CNAME {{ .Group.name }}."
              fallthrough
          }
          forward . /etc/resolv.conf
          cache 30
          loop
          reload
          loadbalance
      }


networks:
  default:
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.name: ims0
    ipam:
      config:
      - subnet: ${NETv4}
      - subnet: ${NETv6}
  # The interconnect, II-NNI (TS 23.228 Annex K): the IBCF and the TrGW on
  # this network's side, peers on the other
  ici:
    driver_opts:
      com.docker.network.bridge.name: ici0
    ipam:
      config:
      - subnet: ${NETICI}

