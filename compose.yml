include:
- ${CORE:-core.yml}   # CORE=stub.yml swaps the HSS for the pro2call Cx stub
- billing.yml
- monitor.yml


x-kamailio: &kamailio
  image: ghcr.io/lyatanski/kamailio
  expose:
  - 5060/tcp
  - 5060/udp
  dns: ${DNSv4}
  healthcheck:
    test: wget -qO- 127.0.0.1:9090/check
    retries: 60
    interval: 5s
    start_period: 5s

x-route: &route
  image: alpine
  command: sh -c "gw=$$(getent ahostsv4 upf | cut -d' ' -f1 | sort -u | head -1); test -n \"$$gw\" && ip route replace ${UENET} via $$gw mtu 1450"
  cap_add:
  - NET_ADMIN
  restart: on-failure

services:
  pcscf:
    << : *kamailio
    command: -f /etc/cscf/proxy.cfg
    environment:
      REALM: ${REALM}
      DBURL: redis:6379/1
      IPSEC: ${IPSEC}
    configs:
    - source: pcscf.xml
      target: /etc/cscf/diameter.xml
    cap_add:
    - NET_ADMIN
    networks:
      default:            # Mw
        ipv4_address: ${IPSEC}
    depends_on:
      kmod:
        condition: service_completed_successfully

  icscf:
    << : *kamailio
    command: -f /etc/cscf/interrogating.cfg
    environment:
      REALM: ${REALM}
      DBURL: redis:6379/2
    configs:
    - source: icscf.xml
      target: /etc/cscf/diameter.xml
    depends_on:
      scscf:
        condition: service_healthy

  scscf:
    << : *kamailio
    command: -f /etc/cscf/serving.cfg
    environment:
      REALM: ${REALM}
      #DBURL: redis:6379/3
      REGSRV: addr=redis;port=6379;db=2
      RTPADR: udp:rtpengine:9910
      ENUM: e164.${REALM}.
      TRUNK:
      E164CC: ${DIAL}
      E164IDD:
      E164NDD:
    configs:
    - source: scscf.xml
      target: /etc/cscf/diameter.xml
    depends_on:
      redis:
        condition: service_healthy

  dns:
    image: coredns/coredns
    command: -conf /etc/coredns/Corefile
    configs:
    - source: dns
      target: /etc/coredns/Corefile
    networks:
      default:
        ipv4_address: ${DNSv4}

  rtpengine:
    image: ghcr.io/lyatanski/rtpengine
    command: --no-log-timestamps 
    configs:
    - source: rtpengine.conf
      target: /etc/rtpengine/rtpengine.conf
    expose:
    - 9910/udp
    scale: 1
    healthcheck:
      test: wget -qO- 127.0.0.1:9090/ping
      retries: 60
      interval: 5s
      start_period: 5s

  route-sip:
    << : *route
    network_mode: service:pcscf

  route-rtp:
    << : *route
    network_mode: service:rtpengine

  kmod:
    image: alpine
    command:
    - modprobe
    - -a
    - ah4
    - ah6
    - esp4
    - esp6
    - xfrm4_tunnel
    - xfrm6_tunnel
    - xfrm_user
    - ip_tunnel
    - tunnel4
    - tunnel6
    cap_add:
    - SYS_MODULE
    volumes:
    - /lib/modules:/lib/modules

  redis:
    image: valkey/valkey:9-alpine
    expose:
    - 6379/tcp
    healthcheck:
      test: valkey-cli ping | grep -q PONG
      retries: 30
      interval: 2s
      start_period: 2s

  test:
    profiles:
    - test
    image: ghcr.io/lyatanski/pro2call
    environment:
      PGW_IP:            smf
      GTPU_IFACE:        eth0
      GTPU_INNER_IFACE:  eth0
      GTP_T3_MS:  ${GTP_T3_MS:-3000}
      IMS_K:      ${K}
      IMS_OPC:    ${OPC}
      IMS_MCC:    ${MCC}
      IMS_MNC:    ${MNC}
      IMS_REALM:  ims.${REALM}
      IMS_IMSI:   ${MCC}${MNC}0000000001
      IMS_SUBS:   ${SCALE}
      IMS_MSISDN_CC:      ${DIAL}
      IMS_MSISDN_DIGITS:  9
      CALL_URI:  ${CALL_URI:-tel}
    cap_add:
    - NET_ADMIN   # ESP SAs and policies, the transparent UE socket, the TC hook
    - BPF         # loading the GTP-U datapath
    - PERFMON     # privileged verifier: skip the Spectre passes
    depends_on:
      icscf:
        condition: service_healthy
      scscf:
        condition: service_healthy


configs:
  pcscf.xml:
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <DiameterPeer
          FQDN="pcscf.ims.${REALM}"
          Realm="ims.${REALM}"
          Vendor_Id="10415"
          Product_Name="CDiameterPeer"
          Workers="4"
      >
              <Peer FQDN="pcrf.epc.${REALM}" Realm="epc.${REALM}" port="3868"/>
              <Auth id="16777236" vendor="10415"/> <!-- Rx 3GPP -->
              <SupportedVendor vendor="10415" />
              <DefaultRoute FQDN="pcrf.epc.${REALM}" metric="1"/>
      </DiameterPeer>

  icscf.xml:
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <DiameterPeer
          FQDN="icscf.ims.${REALM}"
          Realm="ims.${REALM}"
          Vendor_Id="10415"
          Product_Name="CDiameterPeer"
          Workers="4"
      >
              <Peer FQDN="hss.epc.${REALM}" Realm="epc.${REALM}" port="3868"/>
              <Auth id="16777216" vendor="10415"/> <!-- Cx 3GPP -->
              <SupportedVendor vendor="10415" />
              <DefaultRoute FQDN="hss.epc.${REALM}" metric="1"/>
      </DiameterPeer>

  scscf.xml:
    content: |
      <?xml version="1.0" encoding="UTF-8"?>
      <DiameterPeer
          FQDN="scscf.ims.${REALM}"
          Realm="ims.${REALM}"
          Vendor_Id="10415"
          Product_Name="CDiameterPeer"
          Workers="4"
      >
              <Peer FQDN="hss.epc.${REALM}" Realm="epc.${REALM}" port="3868"/>
              <Peer FQDN="ocs.${REALM}" Realm="${REALM}" port="3868"/>
              <Auth id="16777216" vendor="10415"/> <!-- Cx 3GPP -->
              <Auth id="4"        vendor="10415"/> <!-- Ro 3GPP -->
              <SupportedVendor vendor="10415" />
              <Realm name="${REALM}">
                  <Route FQDN="ocs.${REALM}" metric="1"/>
              </Realm>
              <DefaultRoute FQDN="hss.epc.${REALM}" metric="1"/>
      </DiameterPeer>

  rtpengine.conf:
    content: |
      [rtpengine]
      log-level = 7
      table = -1
      listen-http = 0.0.0.0:9090
      listen-ng = 0.0.0.0:9910
      interfaces-config = interface
      templates = templates
      timeout = 60
      silent-timeout = 3600
      tos = 184
      port-min = 30000
      port-max = 40000
      no-redis-required = true
      #redis-write = redis:6379/4
      #redis-subscribe = redis:6379/5
      #redis-resolve-on-reconnect = true

      [ims-rtpengine-2]
      log-level = 7
      table = -1
      listen-http = 0.0.0.0:9090
      listen-ng = 0.0.0.0:9910
      interfaces-config = interface
      templates = templates
      timeout = 60
      silent-timeout = 3600
      tos = 184
      port-min = 30000
      port-max = 40000
      no-redis-required = true
      redis-write = redis:6379/5
      redis-subscribe = redis:6379/4
      redis-resolve-on-reconnect = true

      [interface-internal]
      address = any

      [interface-external]
      alias = internal

      [templates]
      internal = direction=internal direction=internal
      outgoing = direction=internal direction=external
      incoming = direction=external direction=internal

  dns:
    content: |
      . {
          errors
          log
          health {
             lameduck 5s
          }
          ready
          # ENUM (RFC 6116): the tree the S-CSCF queries to turn a dialled
          # E.164 number into a SIP URI it can route. It answers only for the
          # numbers this IMS serves -- those starting with DIAL, whose digits
          # appear reversed in an ENUM name, hence DIALR. A number it does not
          # claim gets no NAPTR at all, and the S-CSCF breaks that one out to
          # TRUNK or answers 404. Another operator's range is one more rule
          # like this, answering their realm instead of ours.
          #
          # One rule covers every number in the range -- the digits are only
          # ever in the *name*, and the regexp in the record does the rewriting
          # -- and the home domain is taken out of the name too, so nothing
          # here repeats the realm.
          #
          # The regexp drops the leading "+", because what comes out of it is
          # what the I-CSCF asks the HSS for in the LIR, and open5gs returns
          # the MSISDN without one: sip:359000000001@ims.<realm> and
          # tel:359000000001. Change that mapping here, not in the S-CSCF.
          #
          # Both rules must precede the catch-all IN ANY rule below, which
          # matches an ENUM name too and would answer it a nonsense CNAME.
          # `$$` is a literal `$` once compose has interpolated this file.
          template IN NAPTR {
              match ^([0-9]\.)+${DIALR}\.e164\.(?P<home>mnc\d{2,3}\.mcc\d{3}\.3gppnetwork\.org)\.$$
              answer "{{ .Name }} 1D IN NAPTR 10 100 \"u\" \"E2U+sip\" \"!^\\+(.*)$$!sip:\\1@ims.{{ .Group.home }}!\" ."
              fallthrough
          }
          # A number in the tree but outside the served range: no such name.
          # Without this it would reach the catch-all and come back as a CNAME,
          # which is an answer, so the miss has to be made explicit here. No
          # fallthrough, deliberately -- that is the whole point of the rule.
          template IN NAPTR {
              match ^([0-9]\.)+e164\.mnc\d{2,3}\.mcc\d{3}\.3gppnetwork\.org\.$$
              rcode NXDOMAIN
          }
          template IN SRV {
              match (?P<name>.cscf)?\.ims\.mnc\d{2,3}\.mcc\d{3}\.3gppnetwork.org
              answer "{{ .Name }} 1D SRV 0 0 5060 {{ or .Group.name \"icscf\" }}."
              fallthrough
          }
          template IN ANY {
              match (^|[.])(?P<name>[^.]*).*\.mnc\d{2,3}\.mcc\d{3}\.3gppnetwork.org
              answer "{{ .Name }} 1D IN CNAME {{ .Group.name }}."
              fallthrough
          }
          forward . /etc/resolv.conf
          cache 30
          loop
          reload
          loadbalance
      }


networks:
  default:
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.name: ims0
    ipam:
      config:
      - subnet: ${NETv4}
      - subnet: ${NETv6}

