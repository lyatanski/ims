# Called from container.yml once its images are published and tested. A
# called workflow runs from the caller's commit, so a branch push tests that
# branch's charts with that branch's copy of this file -- which a
# `workflow_run` trigger never does: it always runs the default branch's.
name: charts
on:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Lint
      run: |
        for c in core rtpengine ims; do helm dependency update charts/$c; done
        helm lint charts/core charts/ims

    - name: Publish
      run: |
        helm package charts/core charts/ims
        echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
        for c in core-*.tgz ims-*.tgz; do helm push "$c" oci://ghcr.io/${{ github.actor }}; done

  # A single KinD node with the charts' Multus attachments on. They are the
  # shape the charts ship -- transport-mode IPsec does not survive the DNAT a
  # Service does, so testing without them tests a path no deployment uses.
  test:
    needs:
    - publish
    runs-on: ubuntu-latest

    steps:
    # Dual-stack: a UE on an IPv6 PDN rides the UPF's own eth0 and the node's
    # routes on to Gm, so both need IPv6 of their own.
    - name: KinD Config
      run: |
        cat > kind.yaml <<'EOF'
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        networking:
          ipFamily: dual
        EOF

    - name: Create KinD Cluster
      uses: helm/kind-action@v1
      with:
        config: kind.yaml

    # KinD ships neither the bridge plugin nor Multus. v4.3.0 because the thin
    # image is published up to v4.3.0 only, and pinned by name because the
    # manifest says `:snapshot`. Upstream's 50Mi limit OOMKills the daemon
    # before it writes its CNI config.
    - name: Install Multus
      run: |
        NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
        curl -sSLf https://github.com/containernetworking/plugins/releases/download/v1.9.1/cni-plugins-linux-amd64-v1.9.1.tgz \
          | docker exec -i "$NODE" tar -xzf - -C /opt/cni/bin ./bridge ./macvlan ./static

        MULTUS_IMAGE=ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.0
        kubectl apply -f https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/v4.3.0/deployments/multus-daemonset.yml
        kubectl -n kube-system set image ds/kube-multus-ds \
          kube-multus="$MULTUS_IMAGE" install-multus-binary="$MULTUS_IMAGE"
        kubectl -n kube-system set resources ds/kube-multus-ds \
          --containers=kube-multus --requests=memory=256Mi --limits=memory=256Mi
        kubectl -n kube-system rollout status ds/kube-multus-ds --timeout=5m

        timeout 120 sh -c "until docker exec $NODE test -f /etc/cni/net.d/00-multus.conf; do sleep 2; done" || {
          echo "::error::multus never wrote /etc/cni/net.d/00-multus.conf"
          kubectl -n kube-system logs ds/kube-multus-ds
          exit 1
        }

    # The file being there is not enough: kubelet rereads /etc/cni/net.d on
    # its own schedule, and a pod created before it does silently gets only
    # the primary network. Attach something and look at what it got.
    - name: Verify Multus attaches
      run: |
        kubectl apply -f - <<'EOF'
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata: {name: multus-probe}
        spec:
          config: '{"cniVersion": "0.3.1", "name": "multus-probe", "type": "bridge", "bridge": "probe0", "ipam": {"type": "host-local", "subnet": "10.99.0.0/24"}}'
        ---
        apiVersion: v1
        kind: Pod
        metadata:
          name: multus-probe
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name": "multus-probe", "interface": "probe0"}]'
        spec:
          containers:
          - name: probe
            image: registry.k8s.io/pause:3.10
        EOF
        kubectl wait pod/multus-probe --for=condition=Ready --timeout=60s
        status=$(kubectl get pod multus-probe -o jsonpath='{.metadata.annotations.k8s\.v1\.cni\.cncf\.io/network-status}')
        kubectl delete pod/multus-probe net-attach-def/multus-probe
        echo "$status" | grep -q '"interface": *"probe0"' || {
          echo "::error::multus is installed but attached no probe0"
          exit 1
        }

    # kindnet SNATs anything leaving the pod CIDR, and transport-mode ESP does
    # not survive that: the plain REGISTER and the 401 ride through and only
    # the protected REGISTER disappears. The Gm, media and both Ici subnets
    # from the IMS values below, and the same again for IPv6.
    - name: Exempt the secondary subnets from masquerading
      run: |
        NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
        for net in 10.20.0.0/24 10.30.0.0/24 10.40.0.0/24 10.41.0.0/24; do
          docker exec "$NODE" iptables -t nat -I KIND-MASQ-AGENT 1 -d "$net" -j RETURN
        done
        for net in fd20::/64 fd30::/64; do
          docker exec "$NODE" ip6tables -t nat -I KIND-MASQ-AGENT 1 -d "$net" -j RETURN
        done

    # The node's rp_filter is strict, and the border test is asymmetric by
    # construction: its stand-in S-CSCF sits on the pod network and talks to
    # the IBCF's Ici address and the TrGW's media address, which answer from
    # those addresses over their pods' eth0 -- their default route -- while
    # the node's route back to them is the bridge. Loose only asks that the
    # source be routable at all.
    - name: Loosen rp_filter for the border test
      run: |
        NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
        docker exec "$NODE" sysctl -qw net.ipv4.conf.all.rp_filter=2

    # The chart defaults request 5.8 cores between them -- the measured demand
    # of one capacity unit (SIZING.md) -- against the runner's 4 vCPU, so both
    # installs lower `requests` to schedule. Limits stay as shipped: a limit
    # does not affect scheduling, and the SMF and P-CSCF idle above 256Mi.
    #
    # ims.pcscf is the P-CSCF's Gm address rather than the `ims-pcscf` Service:
    # the protected ports bind on gm0, and a protected REGISTER arriving on the
    # pod address has no SA to match. A literal, because core installs before
    # ims exists to be asked -- it is the ims chart's default `gm.addresses`.
    - name: Install Open5GS
      run: |
        helm install core oci://ghcr.io/${{ github.actor }}/core -f - <<'EOF'
        ims:
          pcscf:
          - 10.20.0.10
          - fd20::10
        components:
          hss:
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 2, memory: 256Mi}
          pcrf:
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 1500m, memory: 256Mi}
          smf:
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 2500m, memory: 1Gi}
          upf:
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 2, memory: 768Mi}
        mongodb:
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 1500m, memory: 1Gi}
        EOF

    - name: Install IMS
      run: |
        helm install ims oci://ghcr.io/${{ github.actor }}/ims --wait --timeout 10m -f - <<'EOF'
        gm:
          enabled: true
          addresses6:
          - fd20::10/64
          config:
            cniVersion: 0.3.1
            type: bridge
            bridge: gm0
            isGateway: true
            master: null
            mode: null
        # Two Ici networks, a bridge each, so the IBCF picks the one a call
        # leaves by from the peer it goes to. The TrGW's attachments below
        # share them. Two addresses on ipx, both received on, the first sent
        # from.
        ici:
          networks:
          - name: ipx
            interface: ici-ipx
            addresses: [10.40.0.10/24, 10.40.0.11/24]
            config:
              cniVersion: 0.3.1
              type: bridge
              bridge: ici0
              ipam: {type: static}
          - name: peering
            interface: ici-peering
            addresses: [10.41.0.10/24]
            config:
              cniVersion: 0.3.1
              type: bridge
              bridge: ici1
              ipam: {type: static}
        global:
          ue:
            via: 10.20.0.1
            via6: fd20::1
        cscf:
          border:
            enabled: true
            # One peer per Ici network, each the border test's on it
            peers:
            - name: peer
              network: ipx
              entry: [sip:10.40.0.30:5060]
              routes: [ims.mnc099.mcc001.3gppnetwork.org, "+999"]
            - name: neighbour
              network: peering
              entry: [sip:10.41.0.30:5060]
              routes: [ims.mnc098.mcc001.3gppnetwork.org, "+998"]
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 1, memory: 256Mi}
          proxy:
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 2, memory: 1Gi}
          interrogating:
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 1, memory: 384Mi}
          serving:
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 2, memory: 768Mi}
        trgw:
          media:
            interfaces:
            - name: internal
              address: media0
              # one per replica, past the host-local rangeEnd below
              vips: [10.30.0.251, 10.30.0.252]
              vips6: [fd30::fb, fd30::fc]
              network:
                enabled: true
                name: media
                config:
                  cniVersion: 0.3.1
                  type: bridge
                  bridge: media0
                  isGateway: true
                  ipam:
                    type: host-local
                    ranges:
                    - - subnet: 10.30.0.0/24
                        gateway: 10.30.0.1
                        rangeStart: 10.30.0.10
                        rangeEnd: 10.30.0.250
                    - - subnet: fd30::/64
                        gateway: fd30::1
                        rangeStart: fd30::10
                        rangeEnd: fd30::fa
                    routes:
                    - dst: 10.10.0.0/16
                      gw: 10.30.0.1
                    - dst: fd10:10::/48
                      gw: fd30::1
            # The TrGW's side of each Ici network, on the IBCF's bridge, the
            # addresses past rangeEnd again. The bridge address (isGateway)
            # is how the border test's stand-in S-CSCF, on the pod network,
            # gets to Ici at all.
            - name: external-ipx
              address: ici0
              vips: [10.40.0.251, 10.40.0.252]
              network:
                enabled: true
                name: ici-ipx
                config:
                  cniVersion: 0.3.1
                  type: bridge
                  bridge: ici0
                  isGateway: true
                  ipam:
                    type: host-local
                    ranges:
                    - - subnet: 10.40.0.0/24
                        gateway: 10.40.0.1
                        rangeStart: 10.40.0.100
                        rangeEnd: 10.40.0.250
            - name: external-peering
              address: ici1
              vips: [10.41.0.251, 10.41.0.252]
              network:
                enabled: true
                name: ici-peering
                config:
                  cniVersion: 0.3.1
                  type: bridge
                  bridge: ici1
                  isGateway: true
                  ipam:
                    type: host-local
                    ranges:
                    - - subnet: 10.41.0.0/24
                        gateway: 10.41.0.1
                        rangeStart: 10.41.0.100
                        rangeEnd: 10.41.0.250
          # A pair per Ici network, which the IBCF names by the peer's. The
          # unsuffixed pair is no network's, but has to name an interface
          templates:
            incoming: direction=external-ipx direction=internal strict-source replace-origin
            outgoing: direction=internal direction=external-ipx strict-source replace-origin
            incoming-ipx: direction=external-ipx direction=internal strict-source replace-origin
            outgoing-ipx: direction=internal direction=external-ipx strict-source replace-origin
            incoming-peering: direction=external-peering direction=internal strict-source replace-origin
            outgoing-peering: direction=internal direction=external-peering strict-source replace-origin
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 2, memory: 512Mi}
          valkey:
            resources:
              requests: {cpu: 50m, memory: 32Mi}
              limits: {cpu: 1, memory: 256Mi}
        dns:
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 1, memory: 256Mi}
        # The interconnect check on both Ici networks, one pod each. The media
        # timeout teardown is the TrGW's whatever the network, so only the
        # first waits it out.
        test:
          border:
            enabled: true
            networks:
              peering: {address: 10.41.0.30/24, dial: "998", mediaTimeout: 0}
        EOF

    - name: Test
      run: helm test ims --logs --timeout 10m

    - name: Debug
      if: always()
      run: |
        kubectl get pods,svc,net-attach-def
        kubectl describe pod -l app.kubernetes.io/instance=ims
        # deploy,sts: the CSCFs, the TrGW and valkey are StatefulSets.
        for d in $(kubectl get deploy,sts -o name); do echo "== $d"; kubectl logs "$d" --tail=100; done
