name: charts
on:
  workflow_run:
    workflows: [container]
    types: [completed]
permissions: write-all

jobs:
  charts:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - name: Lint
      run: |
        helm dependency update charts/core
        helm dependency update charts/rtpengine
        helm dependency update charts/ims
        helm lint charts/core charts/ims

    - name: Package
      run: |
        helm package --dependency-update charts/core
        helm package --dependency-update charts/ims

    - name: Log in
      run: helm registry login --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} oci://ghcr.io/

    - name: Publish IMS
      run: helm push ims-*.tgz oci://ghcr.io/${{ github.actor }}

    - name: Publish Open5GS
      run: helm push core-*.tgz oci://ghcr.io/${{ github.actor }}

  test:
    needs:
    - charts
    runs-on: ubuntu-latest

    steps:
    # For values-ci.yaml below -- the charts themselves come from the registry.
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - name: Create KinD Cluster
      uses: helm/kind-action@v1

    # charts/ims/values-ci.yaml attaches Gm and rtpengine's media interface to
    # secondary networks, which is the shape the charts ship: transport-mode
    # IPsec does not survive the DNAT a Service does, so a Service cannot be
    # substituted for the attachment and testing without one tests a path the
    # deployment does not use. That needs the CNI plugins KinD does not ship,
    # and Multus. Without this the install fails outright on an unknown kind.
    #
    # Inlined rather than calling kind.sh: that script is for interactive
    # local runs (it also builds images, captures traffic, drives webshark,
    # ...), and this job needs only these steps -- kept here so CI does not
    # depend on a script meant for a developer's shell.
    - name: Install CNI plugins
      run: |
        NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
        if docker exec "$NODE" test -x /opt/cni/bin/bridge 2>/dev/null; then
          echo "bridge/macvlan already on the node"
        else
          curl -sSLf -o cni.tgz \
            https://github.com/containernetworking/plugins/releases/download/v1.9.1/cni-plugins-linux-amd64-v1.9.1.tgz
          docker exec -i "$NODE" tar -xzf - -C /opt/cni/bin ./bridge ./macvlan ./static < cni.tgz
        fi

    # v4.3.0, not the newer v4.3.1: multus-daemonset.yml is the thin
    # deployment, and the thin image is published up to v4.3.0 only. The
    # manifest names the image `:snapshot` -- the floating tag built from
    # master -- regardless of the release tag it came from, so the image is
    # pinned by name below. Upstream's 50Mi memory limit OOMKills the daemon
    # on this runner before it can write its CNI config, hence the override.
    - name: Install Multus
      run: |
        MULTUS_IMAGE=ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.0
        NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')

        kubectl get crd network-attachment-definitions.k8s.cni.cncf.io >/dev/null 2>&1 || \
          kubectl apply -f https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/v4.3.0/deployments/multus-daemonset.yml

        kubectl -n kube-system set image ds/kube-multus-ds \
          kube-multus="$MULTUS_IMAGE" install-multus-binary="$MULTUS_IMAGE"
        kubectl -n kube-system set resources ds/kube-multus-ds \
          --containers=kube-multus --requests=memory=256Mi --limits=memory=256Mi
        kubectl -n kube-system rollout status ds/kube-multus-ds --timeout=5m

        for i in $(seq 60); do
          docker exec "$NODE" test -f /etc/cni/net.d/00-multus.conf 2>/dev/null && break
          sleep 2
        done
        docker exec "$NODE" test -f /etc/cni/net.d/00-multus.conf 2>/dev/null || {
          echo "::error::multus never wrote /etc/cni/net.d/00-multus.conf"
          kubectl -n kube-system logs ds/kube-multus-ds
          exit 1
        }

    # 00-multus.conf existing is necessary but not sufficient: kubelet rereads
    # /etc/cni/net.d on its own schedule, so there is a window where the file
    # is on disk and the config kubelet runs is still the old one. A pod
    # created in that window is silently handed only the primary network, with
    # no event or log line saying so -- so the only honest check is to attach
    # something and look at what it got, before the charts' own pods are the
    # first to find out.
    - name: Verify multus attaches
      run: |
        kubectl apply -f - <<EOF
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata: {name: multus-probe, namespace: default}
        spec:
          config: |
            {
              "cniVersion": "0.3.1", "name": "multus-probe", "type": "bridge",
              "bridge": "probe0",
              "ipam": {"type": "host-local", "subnet": "10.99.0.0/24"}
            }
        ---
        apiVersion: v1
        kind: Pod
        metadata:
          name: multus-probe
          namespace: default
          annotations:
            k8s.v1.cni.cncf.io/networks: '[{"name":"multus-probe","interface":"probe0"}]'
        spec:
          restartPolicy: Never
          containers:
          - name: probe
            image: registry.k8s.io/pause:3.10
        EOF

        ip=
        for i in $(seq 30); do
          ip=$(kubectl get pod multus-probe -o jsonpath='{.metadata.annotations.k8s\.v1\.cni\.cncf\.io/network-status}' 2>/dev/null | python3 -c 'import sys, json; s = sys.stdin.read().strip() or "[]"; print(next((n["ips"][0] for n in json.loads(s) if n.get("interface") == "probe0"), ""))')
          [ -n "$ip" ] && break
          sleep 2
        done
        kubectl delete pod multus-probe --ignore-not-found
        kubectl delete net-attach-def multus-probe --ignore-not-found
        [ -n "$ip" ] || { echo "::error::multus is installed but attached no probe0 -- every CSCF and rtpengine would have failed later and elsewhere"; exit 1; }
        echo "probe attached probe0 $ip"

    # The chart defaults request 5.8 cores between them, which is the measured
    # demand of one capacity unit (SIZING.md) and more than this runner's 4
    # vCPU: without the override the pods stay Pending and `--wait` times out.
    # values-ci.yaml lowers requests only; the limits stay as shipped.
    - name: Install Open5GS
      run: helm install core oci://ghcr.io/${{ github.actor }}/core -f charts/core/values-ci.yaml

    - name: Install IMS
      run: helm install ims oci://ghcr.io/${{ github.actor }}/ims -f charts/ims/values-ci.yaml --wait --timeout 10m

    # kindnet SNATs anything leaving the pod CIDR, and a Gm address is outside
    # it -- transport-mode ESP does not survive that, and the failure is late
    # and misleading: the plain REGISTER and the 401 both ride through and only
    # the protected REGISTER disappears. It runs here rather than earlier
    # because it reads the subnets off the attachments, which the install is
    # what creates.
    - name: Exempt the secondary subnets from masquerading
      run: |
        NODE=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
        subnets=$(kubectl get net-attach-def -o json | python3 -c 'import sys, json; items = json.load(sys.stdin).get("items", []); ipams = [json.loads(n["spec"]["config"]).get("ipam", {}) for n in items]; nets = [i.get("subnet") or i.get("range") for i in ipams if i.get("subnet") or i.get("range")]; print("\n".join(nets))')
        [ -n "$subnets" ] || { echo "::error::no NetworkAttachmentDefinition to read a subnet from -- is gm.enabled true?"; exit 1; }
        for net in $subnets; do
          docker exec "$NODE" iptables -t nat -C KIND-MASQ-AGENT -d "$net" -j RETURN 2>/dev/null \
            || docker exec "$NODE" iptables -t nat -I KIND-MASQ-AGENT 1 -d "$net" -j RETURN
        done

    - name: Test
      run: helm test ims --logs --timeout 10m

    - name: Debug
      if: always()
      run: |
        kubectl get pods,svc,net-attach-def
        kubectl describe pod -l app.kubernetes.io/instance=ims
        # deploy,sts: the CSCFs, rtpengine and valkey are StatefulSets.
        for d in $(kubectl get deploy,sts -o name); do echo "== $d"; kubectl logs $d --tail=100; done
