name: container
permissions: write-all
on:
  push:
  schedule:
  - cron: '0 1 * * WED,SUN'

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        context:
        - test
        - kamailio
        - rtpengine
        - freediameter
        - openssl
        - open5gs
        - trace
        - cgr-console
        - cgr-engine
        - cgr-loader
        #- cgr-ui
        - grafonnet
    steps:
    - uses: actions/checkout@v6
    - name: Build
      run: >
        docker build -t ghcr.io/${{ github.actor }}/${{ matrix.context }}
        images/${{ matrix.context }}
#    - name: Version
#      id: get
#      run: >
#        docker run --rm ghcr.io/${{ github.actor }}/${{ matrix.context }} --version
#        | sed -n "s/\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/version=\1/p"
#        >> "$GITHUB_OUTPUT"
#    - name: Tag
#      run: >
#        docker tag ghcr.io/${{ github.actor }}/${{ matrix.context }}
#        ghcr.io/${{ github.actor }}/${{ matrix.context }}:${{ steps.get.outputs.version }}
    - name: Login
      run: >
        echo "${{ secrets.GITHUB_TOKEN }}"
        | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Publish
      run: docker push ghcr.io/${{ github.actor }}/${{ matrix.context }}

  test:
    needs:
    - images
    runs-on: ubuntu-latest
    env:
      # every compose call below picks up the tracing overlay too, so Homer,
      # Tempo and the trace agent are exercised on every run
      COMPOSE_FILE: compose.yml:trace.yml
    steps:
    - uses: actions/checkout@v6
    - name: Install Kmod
      run: |
        sudo apt update
        sudo apt install -qy --no-install-recommends linux-modules-extra-$(uname -r)
    # brought up without the test profile first, so the capture is attached and
    # writing before any signalling happens - ptcpdump takes a few seconds to
    # load its eBPF programs and would otherwise miss the first REGISTER
    - name: Set Up
      run: docker compose --profile debug up --detach --quiet-pull
    # --wait blocks on the healthcheck, which reports the capture file as open
    - name: Capture Ready
      run: docker compose --profile debug up --detach --wait pcap
    - name: Test
      run: docker compose --profile test --profile debug up --detach test
    - name: Wait
      run: docker compose --profile test --profile debug wait test
    - name: Check
      run: docker compose --profile test --profile debug ps --all
      if: always()
    # ptcpdump buffers; stop it before the capture is read or uploaded
    - name: Stop Capture
      run: docker compose --profile test --profile debug stop pcap
      if: always()
    - name: Spans
      # fail loudly if signalling flowed but no span came out the other end
      run: |
        docker compose --profile test --profile debug logs hepd
        docker compose exec -T grafana wget -qO- \
          'http://tempo:3200/api/search?q=%7B+resource.service.namespace+%3D+%22ims%22+%7D&limit=20' \
          | tee /dev/stderr | grep -q '"traceID"'
      if: always()
    - name: Logs
      run: docker compose --profile test --profile debug logs
      if: always()
    - name: Trace
      uses: actions/upload-artifact@v4
      with:
        name: trace
        path: pcap/
        if-no-files-found: error
      if: always()
    - name: Tear Down
      run: docker compose --profile test --profile debug down --volumes
      if: always()
